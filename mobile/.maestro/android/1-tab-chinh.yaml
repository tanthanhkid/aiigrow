- takeScreenshot: ../out/anh/11-viec-qua
- tapOn: "App & web.*"
- assertVisible: "Con mở được gì trên máy"
- takeScreenshot: ../out/anh/12-app-web
- tapOn: "Báo cáo.*"
- assertVisible: "Dùng nhiều nhất"
- takeScreenshot: ../out/anh/13-bao-cao
- tapOn: "Cả nhà.*"
- assertVisible: "Các con"
- assertVisible: "Máy của con"
- takeScreenshot: ../out/anh/14-ca-nha
- tapOn: "Hôm nay.*"
- assertVisible: "Cần Ba Mẹ để ý"
