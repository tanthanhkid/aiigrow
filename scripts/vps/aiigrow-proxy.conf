# /etc/nginx/snippets/aiigrow-proxy.conf trên VPS — khối proxy tới pm2 aiigrow (127.0.0.1:3320), dùng chung cho các location của scripts/vps/aiigrow.nginx.conf
proxy_pass http://127.0.0.1:3320;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;          # lib/gia-dinh.ts › nguonGoi đọc x-real-ip (giới hạn lượt theo IP)
proxy_set_header X-Forwarded-For $remote_addr;    # ghi đè, không nối — client không giả được IP
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;          # lib/ban-agent.ts › gocCongKhai (link tải/ghép máy đúng https://aiigrow.aiilab.vn)
proxy_set_header Connection "";
proxy_read_timeout 120s;                          # ≥ 25 giây giữ của /api/device/cho-thay-doi (long-poll P1); đừng hạ dưới 40s
