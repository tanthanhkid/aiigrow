# /etc/nginx/sites-enabled/aiigrow.conf trên VPS trinity-crm (scripts/deploy-vps.sh). certbot --nginx -d aiigrow.aiilab.vn thêm khối 443.
server {
    listen 80;
    listen [::]:80;
    server_name aiigrow.aiilab.vn;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # lib/gia-dinh.ts › nguonGoi đọc x-real-ip (giới hạn lượt theo IP)
        proxy_set_header X-Forwarded-For $remote_addr;    # ghi đè, không nối — client không giả được IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
