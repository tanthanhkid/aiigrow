# /etc/nginx/sites-enabled/aiigrow.conf trên VPS trinity-crm (scripts/deploy-vps.sh). certbot --nginx -d aiigrow.aiilab.vn thêm khối 443.
# Cần /etc/nginx/snippets/aiigrow-proxy.conf (scripts/vps/aiigrow-proxy.conf). /opt/aiigrow và releases/ phải 755 để nginx (www-data) đọc tệp tĩnh.
server {
    listen 80;
    listen [::]:80;
    server_name aiigrow.aiilab.vn;
    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Tệp tĩnh có hash (bản web Expo + Next) đọc thẳng từ đĩa, cache 1 năm — đỡ cho node trên máy 1 vCPU.
    # Không thấy tệp (bản cũ đã dọn) ⇒ chuyển cho Next như trước.
    location ^~ /_expo/ {
        root /opt/aiigrow/current/public/app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @next;
    }
    location ^~ /assets/ {
        root /opt/aiigrow/current/public/app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @next;
    }
    location ^~ /_next/static/ {
        alias /opt/aiigrow/current/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @next;
    }
    # API: mọi phương thức
    location ^~ /api/ {
        include /etc/nginx/snippets/aiigrow-proxy.conf;
    }
    # Trang + tệp tĩnh: chỉ GET/HEAD (POST lên tệp tĩnh làm Next trả 500)
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include /etc/nginx/snippets/aiigrow-proxy.conf;
    }
    location @next {
        include /etc/nginx/snippets/aiigrow-proxy.conf;
    }
}
