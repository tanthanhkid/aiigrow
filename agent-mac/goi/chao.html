<h2>Chào mừng đến với AiiGrow</h2>
<p>AiiGrow giúp Ba Mẹ quản lý thời gian dùng máy của Con. Bộ cài sẽ đặt ứng dụng AiiGrow và dịch vụ nền của AiiGrow trên máy này.</p>
<p>Sau khi cài xong, Ba Mẹ mở biểu tượng AiiGrow trên thanh menu để ghép máy bằng mã 6 số.</p>
