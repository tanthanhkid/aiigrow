name: agent-win

# Agent Windows AiiGrow trên Windows thật (windows-latest = Windows Server 2022, quyền admin):
#   unit  — dotnet test (gồm test chỉ chạy được trên Windows: DPAPI…)
#   build — bộ cài một tệp ở ba số bản: bản đang phát (Directory.Build.props) + hai bản cao hơn để thử cập nhật
#   e2e   — máy chủ Next cục bộ (PGlite) + agent-win/e2e/chay.ps1: cài im lặng, đồng bộ, Chặn thật (AppLocker + web), khoá,
#           Giám sát, cập nhật đè, giả lỗi, tự cập nhật, gỡ. Xem agent-win/e2e/README.md.
on:
  pull_request:
    paths: ['agent-win/**', 'server/**', '.github/workflows/agent-win.yml']
  push:
    branches: [main]
    paths: ['agent-win/**', 'server/**', '.github/workflows/agent-win.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet test
        run: dotnet test agent-win/tests/AiiGrow.Tests -c Release --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --results-directory test-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results
          if-no-files-found: ignore

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        ban: [goc, '9.9.8', '9.9.9']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Đặt số bản thử (chỉ trong job)
        if: matrix.ban != 'goc'
        shell: bash
        run: sed -i -E "s#<Version>[^<]*</Version>#<Version>${{ matrix.ban }}</Version>#" agent-win/Directory.Build.props && grep Version agent-win/Directory.Build.props
      - name: Build bộ cài một tệp
        shell: bash
        # Git Bash trên runner Windows không có «shasum» (build-mot-file.sh dòng cuối) ⇒ cấp một shim gọi sha256sum, không sửa script build.
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/usr/bin/env bash\nshift 2\nexec sha256sum "$@"\n' > "$RUNNER_TEMP/shim/shasum"
          chmod +x "$RUNNER_TEMP/shim/shasum"
          PATH="$RUNNER_TEMP/shim:$PATH" agent-win/build-mot-file.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.ban }}
          path: agent-win/ra/AiiGrow-Setup.exe
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: e2e-bin
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: pnpm install (server)
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Số bản đang phát
        id: ban
        shell: bash
        run: echo "goc=$(sed -nE 's#.*<Version>([^<]*)</Version>.*#\1#p' agent-win/Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - name: E2E (cài, đồng bộ, chặn, khoá, cập nhật, gỡ)
        shell: powershell
        run: >-
          & "$env:GITHUB_WORKSPACE\agent-win\e2e\chay.ps1"
          -SetupGoc "$env:GITHUB_WORKSPACE\e2e-bin\setup-goc\AiiGrow-Setup.exe"
          -SetupMoi1 "$env:GITHUB_WORKSPACE\e2e-bin\setup-9.9.8\AiiGrow-Setup.exe"
          -SetupMoi2 "$env:GITHUB_WORKSPACE\e2e-bin\setup-9.9.9\AiiGrow-Setup.exe"
          -BanGoc "${{ steps.ban.outputs.goc }}" -BanMoi1 9.9.8 -BanMoi2 9.9.9
          -ThuMucLog "$env:GITHUB_WORKSPACE\e2e-logs";
          exit $LASTEXITCODE
      - name: Gom log còn lại
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force e2e-logs\con-lai | Out-Null
          Get-ChildItem "$env:ProgramData\AiiGrow" -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination e2e-logs\con-lai -ErrorAction SilentlyContinue
          Get-ScheduledTask -TaskName 'AiiGrow*' -ErrorAction SilentlyContinue | Format-List * | Out-File -Encoding utf8 e2e-logs\con-lai\tac-vu.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: warn
