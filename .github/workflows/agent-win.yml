name: agent-win

# Agent Windows AiiGrow trên Windows thật (windows-latest, quyền admin):
#   unit  — dotnet test (gồm test chỉ chạy được trên Windows: DPAPI…)
#   build — bộ cài một tệp ở ba số bản: bản đang phát (Directory.Build.props) + hai bản cao hơn để thử cập nhật
#   e2e   — máy chủ Next cục bộ (PGlite) + agent-win/e2e/chay.ps1: cài im lặng, đồng bộ, Chặn thật (AppLocker + web), khoá,
#           Giám sát, cập nhật đè, giả lỗi, tự cập nhật, gỡ. Xem agent-win/e2e/README.md.
#
# LẤY EXE SỚM (không chờ e2e ~6 phút): mỗi job build tải exe lên artifact `setup-<bản>` ngay khi build xong (upload-artifact@v4 — tải được
# ngay cả khi run còn chạy). Bản phát hành là `setup-goc` (số bản trong Directory.Build.props):
#   gh run list -R tanthanhkid/aiigrow -w agent-win -c <sha commit tăng Version>   # lấy <run-id> của ĐÚNG commit (paths hẹp: commit chỉ
#                                                    # đụng web/admin không có run — đừng lấy «run mới nhất của nhánh»)
#   gh run download <run-id> -R tanthanhkid/aiigrow -n setup-goc -D ra-ci        # → ra-ci/AiiGrow-Setup.exe (in số bản: xem Chi tiết tệp)
# Vẫn nên đợi e2e xanh trước khi trỏ server/lib/ban-agent.ts sang bản mới (xem chú thích ở đó).
#
# paths: chỉ phần máy chủ mà agent Windows + e2e (agent-win/e2e/chay.ps1, proxy.mjs) thật sự chạy qua — /api/device/**, /api/agent/**,
# /api/m/** (catch-all lib/api-m.ts: otp, dang-ky, con, goi-cai, may/che-do, toi, tuan-thu), /api/suc-khoe, toàn bộ server/lib (route dùng
# chung lib; trừ *.test.ts) và cấu hình dựng Next (package.json, lockfile, next.config, tsconfig, instrumentation, middleware/proxy nếu thêm). Trang web/admin/cron/dns/
# aiirob/quay không kích CI Windows. Thêm route mới mà agent gọi ⇒ thêm vào hai danh sách dưới.
on:
  pull_request:
    paths:
      - 'agent-win/**'
      - '.github/workflows/agent-win.yml'
      - 'server/app/api/device/**'
      - 'server/app/api/agent/**'
      - 'server/app/api/m/**'
      - 'server/app/api/suc-khoe/**'
      - 'server/lib/**'
      - '!server/lib/**/*.test.ts'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'
      - 'server/next.config.ts'
      - 'server/tsconfig.json'
      - 'server/instrumentation.ts'
      - 'server/middleware.ts'
      - 'server/proxy.ts'
  push:
    branches: [main]
    paths:
      - 'agent-win/**'
      - '.github/workflows/agent-win.yml'
      - 'server/app/api/device/**'
      - 'server/app/api/agent/**'
      - 'server/app/api/m/**'
      - 'server/app/api/suc-khoe/**'
      - 'server/lib/**'
      - '!server/lib/**/*.test.ts'
      - 'server/package.json'
      - 'server/pnpm-lock.yaml'
      - 'server/next.config.ts'
      - 'server/tsconfig.json'
      - 'server/instrumentation.ts'
      - 'server/middleware.ts'
      - 'server/proxy.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-win-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-unit-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('agent-win/**/*.csproj') }}
          restore-keys: nuget-win-unit-
      - name: dotnet test
        run: dotnet test agent-win/tests/AiiGrow.Tests -c Release --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --results-directory test-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results
          if-no-files-found: ignore

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        ban: [goc, '9.9.8', '9.9.9']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # khoá riêng job build (gói runtime win-x64 của publish một tệp không có trong cache job unit) + bản SDK (runtime pack theo bản vá .NET)
          key: nuget-win-build-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('agent-win/**/*.csproj') }}
          restore-keys: nuget-win-build-
      - name: Đặt số bản thử (chỉ trong job)
        if: matrix.ban != 'goc'
        shell: bash
        run: sed -i -E "s#<Version>[^<]*</Version>#<Version>${{ matrix.ban }}</Version>#" agent-win/Directory.Build.props && grep Version agent-win/Directory.Build.props
      - name: Build bộ cài một tệp
        shell: bash
        # Git Bash trên runner Windows không có «shasum» (build-mot-file.sh dòng cuối) ⇒ cấp một shim gọi sha256sum, không sửa script build.
        run: |
          mkdir -p "$HOME/shim"
          printf '#!/usr/bin/env bash\nshift 2\nexec sha256sum "$@"\n' > "$HOME/shim/shasum"
          chmod +x "$HOME/shim/shasum"
          PATH="$HOME/shim:$PATH" agent-win/build-mot-file.sh
      # Exe có ngay khi job này xong — phát hành lấy `setup-goc` bằng gh run download (chú thích đầu tệp), không chờ e2e.
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.ban }}
          path: agent-win/ra/AiiGrow-Setup.exe
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: e2e-bin
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: pnpm install (server)
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Số bản đang phát
        id: ban
        shell: bash
        run: echo "goc=$(sed -nE 's#.*<Version>([^<]*)</Version>.*#\1#p' agent-win/Directory.Build.props)" >> "$GITHUB_OUTPUT"
      - name: E2E (cài, đồng bộ, chặn, khoá, cập nhật, gỡ)
        shell: powershell
        run: >-
          & "$env:GITHUB_WORKSPACE\agent-win\e2e\chay.ps1"
          -SetupGoc "$env:GITHUB_WORKSPACE\e2e-bin\setup-goc\AiiGrow-Setup.exe"
          -SetupMoi1 "$env:GITHUB_WORKSPACE\e2e-bin\setup-9.9.8\AiiGrow-Setup.exe"
          -SetupMoi2 "$env:GITHUB_WORKSPACE\e2e-bin\setup-9.9.9\AiiGrow-Setup.exe"
          -BanGoc "${{ steps.ban.outputs.goc }}" -BanMoi1 9.9.8 -BanMoi2 9.9.9
          -ThuMucLog "$env:GITHUB_WORKSPACE\e2e-logs";
          exit $LASTEXITCODE
      - name: Gom log còn lại
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force e2e-logs\con-lai | Out-Null
          Get-ChildItem "$env:ProgramData\AiiGrow" -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination e2e-logs\con-lai -ErrorAction SilentlyContinue
          Get-ScheduledTask -TaskName 'AiiGrow*' -ErrorAction SilentlyContinue | Format-List * | Out-File -Encoding utf8 e2e-logs\con-lai\tac-vu.txt
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: warn
