name: mobile-android

# Bước 2 CI (docs/CI-RA-LOI.md): chạy app Ba Mẹ (Expo, mobile/) trên Android emulator thật + Maestro (mobile/.maestro/android/).
#   apk        : expo prebuild + gradle assembleRelease (chỉ x86_64 cho emulator) → artifact apk-ba-me
#   emulator   : Postgres service + máy chủ Next (next dev) + seed CI (không secret production) + emulator KVM + Maestro, mỗi màn takeScreenshot
# App trỏ API http://10.0.2.2:3310 (máy chủ trên runner). Release build cần cleartext HTTP ⇒ vá AndroidManifest sau prebuild (chỉ trên runner).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_call:   # dem.yml gọi lại

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Ho_Chi_Minh
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: mobile — cài
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: expo prebuild android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Vá cleartext HTTP (máy chủ CI ở http://10.0.2.2) — chỉ bản dựng trên runner
        working-directory: mobile
        run: |
          set -e
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' "$f" && sed -i 's/android:usesCleartextTraffic="[a-z]*"/android:usesCleartextTraffic="true"/' "$f" \
            || sed -i 's#<application #<application android:usesCleartextTraffic="true" #' "$f"
          grep -n 'usesCleartextTraffic' "$f"
      - name: gradle assembleRelease (x86_64, API → máy chủ CI)
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API: http://10.0.2.2:3310
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" -Dorg.gradle.workers.max=4
      - name: Tìm APK
        run: |
          set -e
          mkdir -p apk-out
          cp mobile/android/app/build/outputs/apk/release/*.apk apk-out/ba-me.apk
          ls -la apk-out
      - uses: actions/upload-artifact@v4
        with:
          name: apk-ba-me
          path: apk-out/ba-me.apk
          retention-days: 7

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiigrow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aiigrow
      AIIGROW_CI_LOGIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: apk-ba-me
          path: apk-in

      - name: server — cài
        working-directory: server
        run: |
          rc=0; o="$(pnpm install --frozen-lockfile 2>&1)" || rc=$?
          echo "$o" | tail -15
          if [ $rc != 0 ] && grep -oE 'ERR_PNPM_[A-Z_]+' <<<"$o" | grep -vq '^ERR_PNPM_IGNORED_BUILDS$'; then exit 1; fi
          rm -f pnpm-workspace.yaml
          [ -d node_modules/next ] || { echo "pnpm install lỗi (thiếu node_modules/next)"; exit 1; }
      - name: server — seed CI
        working-directory: server
        run: SEED_CI_RA="$RUNNER_TEMP/seed-ci.json" node --import ./lib/test-fixtures/next-esm.mjs scripts/seed-ci.ts
      - name: server — chạy next dev :3310 (nền) + làm nóng đường đăng nhập
        working-directory: server
        run: |
          set -e
          nohup pnpm exec next dev -p 3310 -H 0.0.0.0 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:3310/ && break; sleep 2; done
          # đăng nhập thử cho Next biên dịch trước route (lần đầu chậm)
          for i in 1 2 3; do
            curl -s -m 120 -X POST http://127.0.0.1:3310/api/m/dang-nhap -H 'content-type: application/json' \
              -d '{"dinhDanh":"0900000001","matKhau":"aiigrow-ci-123"}' | tee "$RUNNER_TEMP/dn.json"; echo
            grep -q '"token"' "$RUNNER_TEMP/dn.json" && break; sleep 5
          done
          grep -q '"token"' "$RUNNER_TEMP/dn.json" || { tail -50 "$RUNNER_TEMP/server.log"; exit 1; }

      - name: Maestro
        run: |
          set -e
          export MAESTRO_VERSION=1.41.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator + Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash ./mobile/.maestro/android/chay.sh

      - name: Log máy chủ
        if: always()
        run: tail -200 "$RUNNER_TEMP/server.log" > mobile/.maestro/out/server-tail.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: mobile/.maestro/out
          if-no-files-found: warn
          retention-days: 14
