name: chup-man-win

# Chụp ảnh THẬT các màn của AiiGrow trên Windows (windows-latest): bộ cài AiiGrow-Setup.exe từng trang, khay, app to, màn chặn/khoá.
# Ảnh nằm ở artifact «man-hinh-windows». Không phải kiểm thử sản phẩm — xem agent-win/e2e/chup.ps1.
on:
  workflow_dispatch:
  push:
    branches: [chup-win]
    paths: ['agent-win/e2e/chup.ps1', 'agent-win/e2e/Chup/**', '.github/workflows/chup-man-win.yml']

permissions:
  contents: read

concurrency:
  group: chup-man-win-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        ban: [goc, '9.9.8']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Đặt số bản thử (chỉ trong job)
        if: matrix.ban != 'goc'
        shell: bash
        run: sed -i -E "s#<Version>[^<]*</Version>#<Version>${{ matrix.ban }}</Version>#" agent-win/Directory.Build.props && grep Version agent-win/Directory.Build.props
      - name: Build bộ cài một tệp
        shell: bash
        run: |
          mkdir -p "$HOME/shim"
          printf '#!/usr/bin/env bash\nshift 2\nexec sha256sum "$@"\n' > "$HOME/shim/shasum"
          chmod +x "$HOME/shim/shasum"
          PATH="$HOME/shim:$PATH" agent-win/build-mot-file.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.ban }}
          path: agent-win/ra/AiiGrow-Setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: Build công cụ chụp (chỉ bản gốc)
        if: matrix.ban == 'goc'
        run: dotnet publish agent-win/e2e/Chup -c Release -o chup-bin
      - uses: actions/upload-artifact@v4
        if: matrix.ban == 'goc'
        with:
          name: chup-bin
          path: chup-bin
          if-no-files-found: error
          retention-days: 3

  chup:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          path: bin
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: pnpm install (server)
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Chụp màn hình
        shell: powershell
        run: >-
          & "$env:GITHUB_WORKSPACE\agent-win\e2e\chup.ps1"
          -SetupGoc "$env:GITHUB_WORKSPACE\bin\setup-goc\AiiGrow-Setup.exe"
          -SetupMoi "$env:GITHUB_WORKSPACE\bin\setup-9.9.8\AiiGrow-Setup.exe"
          -ChupExe "$env:GITHUB_WORKSPACE\bin\chup-bin\AiiGrow.Chup.exe"
          -Ra "$env:GITHUB_WORKSPACE\anh";
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: man-hinh-windows
          path: anh
          if-no-files-found: warn
