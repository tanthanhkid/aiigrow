name: agent-android

# Agent Android (AiiGrow Con) trên ubuntu (miễn phí).
#   build    — unit test Gradle + APK debug ⇒ artifact (chặn)
#   emulator — KVM, điện thoại + máy tính bảng, chạy lên app + chụp màn; KHÔNG chặn (continue-on-error)
on:
  pull_request:
    paths: &duong
      - 'agent-android/**'
      - '.github/workflows/agent-android.yml'
  push:
    branches: [main]
    paths: *duong
  workflow_dispatch:
  workflow_call:   # dem.yml (chạy đêm trên main) gọi lại

permissions:
  contents: read

concurrency:
  group: agent-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit test + APK debug
        working-directory: agent-android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: agent-android/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: agent-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    name: emulator (${{ matrix.loai }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - loai: dien-thoai
            profile: pixel_6
          - loai: may-tinh-bang
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            mkdir -p man-android
            adb install -r apk/*.apk
            adb shell am start -n vn.aiilab.aiigrow.con/vn.aiilab.aiigrow.maycon.ManChinh || adb shell monkey -p vn.aiilab.aiigrow.con 1
            sleep 8
            adb exec-out screencap -p > man-android/${{ matrix.loai }}-chinh.png
            adb shell pidof vn.aiilab.aiigrow.con
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: man-android-${{ matrix.loai }}
          path: man-android
          if-no-files-found: warn
          retention-days: 14
