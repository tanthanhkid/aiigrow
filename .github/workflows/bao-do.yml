name: bao-do

# Báo đỏ SAU MERGE: workflow CI chạy trên main (push) kết luận failure ⇒ tìm PR đã merge ra commit đó và comment vào PR:
# workflow nào đỏ, link run, lệnh `git revert` sẵn. KHÔNG tự revert, không chặn gì (luật: merge + deploy ngay, CI main đỏ thì người quyết revert).
# Chạy tay để thử: gh workflow run bao-do -f run_id=<id run đỏ trên main>
on:
  workflow_run:
    workflows: [agent-win, agent-mac, agent-ios, agent-android, chup-man-win, mobile, server]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Id một run (đỏ) để thử báo'
        required: true

permissions: {}

jobs:
  bao:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion) &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # commits/<sha>/pulls
      actions: read         # đọc run
      pull-requests: write  # comment PR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Comment PR của commit đỏ
        run: |
          set -euo pipefail
          INFO=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          SHA=$(jq -r .head_sha <<<"$INFO"); TEN=$(jq -r .name <<<"$INFO"); URL=$(jq -r .html_url <<<"$INFO")
          KL=$(jq -r '.conclusion // "chưa-xong"' <<<"$INFO"); NHANH=$(jq -r .head_branch <<<"$INFO")
          echo "run $RUN_ID: $TEN $KL nhánh $NHANH commit $SHA"
          PR=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -z "$PR" ]; then
            echo "::warning::commit $SHA không thuộc PR đã merge nào — bỏ qua"
            exit 0
          fi
          DAU="<!-- bao-do:$TEN:$SHA -->"
          DA_CO=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments?per_page=100" --jq '.[].body')
          if grep -qF -- "$DAU" <<<"$DA_CO"; then
            echo "PR #$PR đã có báo đỏ cho $TEN @ $SHA — không comment lặp"
            exit 0
          fi
          JOB_DO=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"' || true)
          {
            echo "$DAU"
            echo "🔴 **CI trên main đỏ sau merge** — workflow \`$TEN\` ($KL) ở commit \`${SHA:0:8}\`."
            echo
            echo "Run: $URL"
            [ -n "$JOB_DO" ] && { echo; echo "Job đỏ:"; echo "$JOB_DO"; }
            echo
            echo "Nếu cần gỡ commit này khỏi main (không tự revert — người quyết):"
            echo '```bash'
            echo "git fetch origin && git switch -c revert-${SHA:0:8} origin/main"
            echo "git revert --no-edit $SHA"
            echo "git push -u origin revert-${SHA:0:8} && gh pr create --fill"
            echo '```'
          } > than.md
          gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@than.md --jq .html_url
