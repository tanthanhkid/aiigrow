name: mobile

# App Ba Mẹ (Expo, mobile/): typecheck + lint + test. Node/npm theo package-lock.json.
on:
  pull_request:
    paths: &duong
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths: *duong
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Phụ thuộc expo khớp SDK (chặn crash dyld do prebuild lệch)
        run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
