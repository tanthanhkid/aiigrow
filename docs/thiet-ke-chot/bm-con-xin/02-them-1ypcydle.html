<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>

*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e8ddcf,#F2EBE3 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--sh)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.n-the.g{height:176px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)}
.n-the.c{height:128px;background:#fbf0d6}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 26px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 12px;border-radius:3px;background:#cdc3b8}
.hinh{width:80px;height:80px;margin:0 auto;border-radius:28px;display:grid;place-items:center;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629);box-shadow:0 14px 20px -12px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.18)}
.hinh svg{width:44px;height:44px;fill:#F4C76A}
h1{margin-top:12px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:6px;text-align:center;font-size:15px;line-height:21px;font-weight:600;color:#5a5a5a}
.chip{display:flex;width:max-content;margin:10px auto 0;padding:5px 12px;border-radius:13px;background:#F4C76A;color:#0A1629;font-size:13px;font-weight:800;white-space:nowrap}
.ds{margin-top:14px;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.mat{display:flex;align-items:center;gap:12px;min-height:60px;font-size:15px;font-weight:800}
.mat small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3}.ic img{width:24px;height:24px}.ic svg.i{width:24px;height:24px}
.day{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut.phu{height:48px;color:#0A1629;background:#fff;box-shadow:var(--sh)}
.nut.xanh{height:48px;color:#0A1629;background:linear-gradient(#f8d68e,#F4C76A);box-shadow:var(--sh)}

/* ===== E Ánh kim: lớp phủ chung ===== */
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--clay:var(--sh);--lom:var(--sunk);--kn:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
html,body,.app{background:var(--n)!important;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif!important}
.app::before{display:none!important}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.n-sao,svg.i.st{fill:#E2B354;stroke:#C9973B}
.top{background:linear-gradient(var(--n) 75%,rgba(236,228,217,0))!important}
.top h1{color:var(--ink)!important}.ngay{color:var(--ink2)!important}
.chuong{background:var(--n)!important;box-shadow:var(--sh)!important;color:var(--ink)}
.chuong svg.i{width:24px;height:24px}
.chuong em{background:var(--ink)!important;color:#F4C76A!important;box-shadow:0 0 0 2px var(--n)!important}
.nut{background:var(--kim)!important;color:#0A1629!important;box-shadow:var(--kn)!important;border-radius:16px!important;font-weight:700!important}
.nut::before{display:none!important}
.nut svg.i{width:22px;height:22px}
.nut.phu{background:var(--n)!important;box-shadow:var(--sh)!important}
.muc{color:var(--ink)!important}
.muc span,.muc a{color:#8a6a2b!important;font-weight:600}
.ic{background:var(--n)!important;box-shadow:var(--sunk)!important;color:var(--ink);border-radius:50%!important}
.ic svg.i{width:24px;height:24px}
.the,.hang,.minh,.ls,.xong,.chan,.de-y{background:var(--n)!important;box-shadow:var(--shL)!important;border-radius:28px!important}
.hang,.minh{border-radius:26px!important}
.hang p small,.minh p small,.minh b small{color:var(--ink2)!important}
.hang b,.minh b{color:var(--ink)!important}
.tab{background:var(--n)!important;box-shadow:0 -6px 12px -6px var(--lo)!important}
.tab div{color:var(--ink3)!important;font-weight:600!important}
.tab svg.i{box-sizing:content-box;width:24px;height:24px;padding:3px 16px;border-radius:15px}
.tab .on{color:var(--ink)!important;font-weight:700!important}
.tab .on svg.i{background:var(--n);box-shadow:var(--sunk)}
.tab svg.i.n-sao{fill:none!important;stroke:currentColor!important}

.app{background:var(--n)!important}
.nen{background:var(--n)!important}
.n-top i{background:var(--n)!important;box-shadow:var(--sh)!important}
.n-be i{background:var(--n)!important;box-shadow:var(--sunk)!important}
.n-the{background:var(--n)!important;box-shadow:var(--shL)!important}
.n-the.g{background:#0A1629!important}.n-the.c{background:var(--n)!important}
.mo{background:rgba(10,22,41,.35)!important}
.sheet{background:var(--n)!important;box-shadow:0 -8px 16px rgba(10,22,41,.18),inset 0 1px 0 var(--hi)!important}
.keo{background:#b9ad9e!important}
.hinh{background:#0A1629!important;box-shadow:var(--sh)!important}
.hinh svg{fill:#F4C76A!important}
h1{color:var(--ink)}
.phu-de{color:var(--ink2)!important}
.chip{background:var(--n)!important;box-shadow:var(--sunk)!important;color:#8a6a2b!important}
.ds{background:var(--n)!important;box-shadow:var(--sh)!important}
.mat small,.lg small{color:var(--ink2)!important}
.lg+.lg{border-top-color:rgba(120,98,70,.2)!important}
.nut.xanh{background:var(--n)!important;box-shadow:var(--sunk)!important}
.nut.phu,.nut.xanh{color:var(--ink)!important}
.nut{font-weight:700!important}
.ic svg.i{width:22px;height:22px}
.no{background:var(--n)!important;box-shadow:var(--sunk)!important;color:#A2412C!important}
.mat+.mat{border-top-color:rgba(120,98,70,.2)!important}.mat b{background:var(--n)!important;box-shadow:var(--sunk)!important;color:var(--ink)!important}.mat b.no{color:#A2412C!important}.mat .ic{box-shadow:var(--sunk)!important}

</style></head><body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Hôm nay<i></i></div><div class="n-be"><i style="background:#E8600C"></i><i style="background:#1F48FF"></i><i style="background:#9b2fc0"></i><i style="background:#0f8a68"></i></div><div class="n-the g"></div><div class="n-the c"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></div>
<h1>Đã thêm YouTube<br>· Tính phút</h1>
<p class="phu-de">Bảo Anh xem YouTube sẽ trừ sao của con</p>
<span class="chip">Tính phút · 1 sao = 1 phút xem</span>
<div class="ds"><div class="mat"><span class="ic"><svg class="i n-tin" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span><p>Đã báo Bảo Anh<small>Trên Laptop · 19:40</small></p></div></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Về Hôm nay</span>
<span class="nut xanh" role="button" tabindex="0">Đổi sang Không tính phút</span>
<span class="nut phu" role="button" tabindex="0" data-toi="them-a4nqjrmp">Hoàn tác</span>
</div>
</div>
</div></body></html>
