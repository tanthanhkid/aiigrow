<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e3efeb,#f4f4f2 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#f7f6f3;box-shadow:var(--clay)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.n-the.g{height:176px;background:linear-gradient(#d6e9e2,#eef4f1)}
.n-the.c{height:128px;background:#f9e7d2}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.34)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfcec9}
.hinh{width:88px;height:88px;margin:0 auto;border-radius:30px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--clay)}
.hinh svg{width:44px;height:44px;fill:#3a403d}
h1{margin-top:14px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.phu-de{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;line-height:21px;font-weight:600;color:#3a403d}
.diem{flex:none;display:inline-flex;align-items:center;gap:3px;padding:3px 9px 3px 5px;border-radius:12px;background:#fbecc0;color:#6e4300;font-size:13px;font-weight:800;white-space:nowrap}
.diem img{width:16px;height:16px}
.ds{margin-top:16px;padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.mat{display:flex;align-items:center;gap:12px;min-height:60px;font-size:15px;font-weight:800}
.mat p{flex:1;min-width:0}
.mat small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.day{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut.phu{height:50px;color:#0f1312;background:#fff;box-shadow:var(--clay)}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Hôm nay<i></i></div><div class="n-be"><i style="background:#f08a3c"></i><i style="background:#5b7fd6"></i><i style="background:#d86a8f"></i><i style="background:#3f9a86"></i></div><div class="n-the g"></div><div class="n-the c"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg viewBox="0 0 256 256"><path d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z"></path></svg></div>
<h1>Đã không cho lần này</h1>
<p class="phu-de">Con vẫn đổi được<span class="diem"><img src="/assets/icon3d/sao.webp" alt="">30 sao</span>ra phút</p>
<div class="ds"><div class="mat"><span class="ic"><img src="/assets/icon3d/tin.webp" alt=""></span><p>Đã báo Bảo Anh<small>«Ba Mẹ chưa cho lúc này»</small></p></div></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Về Hôm nay</span>
<span class="nut phu" role="button" tabindex="0" data-toi="them-a4nqjrmp">Hoàn tác</span>
</div>
</div>
</div></body></html>
