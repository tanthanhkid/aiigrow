<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e8ddcf,#F2EBE3 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--sh)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.n-the.g{height:176px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)}
.n-the.c{height:128px;background:#fbf0d6}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cdc3b8}
.hinh{width:88px;height:88px;margin:0 auto;border-radius:30px;display:grid;place-items:center;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629);box-shadow:0 14px 20px -12px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.18)}
.hinh svg{width:48px;height:48px;fill:#F4C76A}
h1{margin-top:14px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:6px;text-align:center;font-size:15px;line-height:21px;font-weight:600;color:#5a5a5a}
.ds{margin-top:16px;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.mat{display:flex;align-items:center;gap:12px;min-height:60px;font-size:15px;font-weight:800}
.mat+.mat{border-top:1px solid #efe7dd}
.mat p{flex:1;min-width:0}
.mat small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.mat b.no{background:#ffe1e1;color:#b81f1f}
.mat b{flex:none;padding:4px 9px;border-radius:11px;background:#e3f5d8;color:#0A1629;font-size:12.5px;font-weight:800}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3}.ic img{width:24px;height:24px}
.day{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut.phu{height:50px;color:#0A1629;background:#fff;box-shadow:var(--sh)}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Hôm nay<i></i></div><div class="n-be"><i style="background:#E8600C"></i><i style="background:#1F48FF"></i><i style="background:#9b2fc0"></i><i style="background:#0f8a68"></i></div><div class="n-the g"></div><div class="n-the c"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></div>
<h1>Đã cho Bảo Anh<br>vay 20 sao</h1>
<p class="phu-de">= 20 phút chơi hoặc đổi quà<br>Sao nhiệm vụ sẽ trả nợ trước</p>
<div class="ds">
<div class="mat"><span class="ic"><img src="/assets/icon3d/sao.webp" alt=""></span><p>Bảo Anh đang nợ<small>Nợ cũ 20 + vay 20 sao</small></p><b class="no">−40 sao</b></div>
<div class="mat"><span class="ic"><img src="/assets/icon3d/tin.webp" alt=""></span><p>Đã báo Bảo Anh<small>Trên Laptop · 19:40</small></p></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Về Hôm nay</span>
<span class="nut phu" role="button" tabindex="0" data-toi="them-a4nqjrmp">Hoàn tác</span>
</div>
</div>
</div></body></html>
