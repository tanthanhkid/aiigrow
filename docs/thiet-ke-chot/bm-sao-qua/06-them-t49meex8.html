<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.sau{position:absolute;inset:0;filter:blur(5px);background:linear-gradient(#e3efeb,#f4f4f2 300px)}
.sau .t{position:absolute;left:56px;top:58px;font-size:22px;font-weight:800}
.sau .o{position:absolute;left:16px;right:16px;border-radius:28px;background:#ecebe7}
.sau .k{position:absolute;left:16px;right:16px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.sau .v{position:absolute;left:84px;right:84px;top:340px;height:56px;border-radius:28px;background:#fbecc0}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.38);z-index:2}
.bang{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 16px 26px;border-radius:32px 32px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2);text-align:center}
.keo{width:40px;height:5px;border-radius:3px;background:#d4d3cf;margin:0 auto 10px}
.rob{width:120px;height:auto;display:block;margin:0 auto}
h2{margin-top:8px;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.phu{margin:6px 12px 0;font-size:14.5px;line-height:21px;font-weight:600;color:#3a403d}
.qua{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 14px 10px 10px;border-radius:24px;background:#f7f6f3;box-shadow:var(--clay);text-align:left}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:26px;height:26px}
.qua p{flex:1;font-size:15px;font-weight:800}.qua p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.sao{flex:none;padding:4px 10px;border-radius:12px;background:#fbecc0;color:#6e4300;font-size:12.5px;font-weight:800}
.nut{display:flex;align-items:center;justify-content:center;height:52px;margin-top:18px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#c8372d,#a01d16);box-shadow:0 12px 18px -10px rgba(160,29,22,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.phu2{display:flex;align-items:center;justify-content:center;height:48px;margin-top:10px;border-radius:24px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<div class="sau" aria-hidden="true"><p class="t">Sửa quà</p><div class="o" style="top:130px;height:56px"></div><div class="k" style="top:234px;height:64px"></div><div class="v"></div><div class="k" style="top:470px;height:260px"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-473f52w6"></div>
<div class="bang">
<div class="keo"></div>
<img class="rob" src="/assets/rob/chi.webp" alt="">
<h2>Xoá quà Đi ăn kem?</h2>
<p class="phu">Con sẽ không thấy quà này trên máy nữa. Sao con đã có không bị mất.</p>
<div class="qua"><span class="ic"><img src="/assets/icon3d/coc.webp" alt=""></span><p>Đi ăn kem<small>Áp cho Bảo Anh, Bảo Minh</small></p><span class="sao">100 sao</span></div>
<span class="nut" role="button" tabindex="0" data-toi="them-473f52w6">Xoá quà Đi ăn kem</span>
<span class="phu2" role="button" tabindex="0" data-toi="them-473f52w6">Giữ lại quà</span>
</div>
</div></body></html>
