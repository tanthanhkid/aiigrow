<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--clay:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--nho:4px 4px 8px var(--lo),-4px -4px 8px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
html,body{width:375px;height:812px;overflow:hidden;background:#ECE4D9;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#ECE4D9}
.sau{position:absolute;inset:0;filter:blur(5px);background:linear-gradient(#ECE4D9,#ECE4D9 300px)}
.sau .t{position:absolute;left:20px;top:52px;font-size:28px;font-weight:800}
.sau .av{position:absolute;top:104px;width:56px;height:56px;border-radius:50%}
.sau .k{position:absolute;left:16px;right:16px;border-radius:28px;background:#ECE4D9;box-shadow:var(--clay)}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.45);z-index:2}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 16px 26px;border-radius:32px 32px 0 0;background:#ECE4D9;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:#d9cfc2}
.hinh{width:104px;height:104px;margin:0 auto;border-radius:32px;display:grid;place-items:center;background:#ECE4D9;box-shadow:var(--clay)}
.hinh img,.hinh svg.i{width:68px;height:68px}
h1{margin-top:14px;text-align:center;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px}
.phu{margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:14.5px;line-height:21px;color:#5b5248;font-weight:600}
.phu b{display:flex;align-items:center;gap:3px;padding:4px 10px 4px 5px;border-radius:12px;background:#F4C76A;color:#0A1629;font-weight:800}
.phu b img,b svg.i{width:18px;height:18px}
.the{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:24px;background:#e4f6d9;font-size:14px;font-weight:700;color:#0A1629;line-height:20px}
.the img,.the svg.i{flex:none;width:48px;height:auto}
.day{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.nut{display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:var(--btnSh)}
.hai{display:flex;gap:10px}
.thoi{flex:1;display:flex;align-items:center;justify-content:center;height:46px;border-radius:23px;background:#ECE4D9;box-shadow:var(--clay);font-size:14.5px;font-weight:800;color:#0A1629;white-space:nowrap}
.thoi.huy{color:#b81f1f}
svg.i{flex:none}svg.st{fill:#E2B354;stroke:#C9973B}
.phat.ngoc{background:#0A1629;color:#F4C76A;box-shadow:var(--nho)}
.tag{box-shadow:var(--lom)}
.vi{box-shadow:var(--clay),inset 0 0 0 1px rgba(244,199,106,.35)}
.vi strong svg.i{width:46px;height:46px}
.tab span[aria-selected="true"]{background:#0A1629;color:#F4C76A;box-shadow:none}
.tab span[aria-selected="false"]{color:#7c7166}
.tag.da{background:#0A1629;color:#F4C76A;box-shadow:none}
.vach i{background:var(--kim)}
.sao{box-shadow:none}
.mo{background:rgba(10,22,41,.35)}
.sau .av{background:#ECE4D9;box-shadow:var(--lom)}.sau .av:first-of-type{background:#0A1629}
.the{background:#ECE4D9;box-shadow:var(--lom)}
.thoi.huy{color:#b42318}
</style></head>
<body><div class="app">
<div class="sau" aria-hidden="true"><p class="t">Nhiệm vụ</p><i class="av" style="left:20px;"></i><i class="av" style="left:88px;"></i><i class="av" style="left:156px;"></i><i class="av" style="left:224px;"></i><div class="k" style="top:186px;height:150px"></div><div class="k" style="top:356px;height:220px"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-e91jg28j"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H16.5"></path></svg></div>
<h1>Đã trao «Chọn món bữa tối»<br>cho Bảo Anh chưa?</h1>
<p class="phu">Con chọn hôm nay · đang giữ <b><svg class="i st" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>50 sao</b></p>
<p class="phu" style="margin-top:4px;font-size:13px;color:#A2412C">trong đó 20 sao Ba Mẹ cho vay</p>
<div class="the"><img src="/assets/rob/xong.webp" alt="">Bấm «Đã trao» thì mới trừ 50 sao. Bảo Anh sẽ còn −20 sao, trả dần bằng nhiệm vụ.</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-e91jg28j">Đã trao, trừ 50 sao</span>
<div class="hai"><span class="thoi" role="button" tabindex="0" data-toi="them-e91jg28j">Chưa, để tối mai</span><span class="thoi huy" role="button" tabindex="0" data-toi="them-e91jg28j">Huỷ &amp; hoàn sao</span></div>
</div>
</div>
</div></body></html>
