<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap"><title>Tải không được</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--nen:#ECE4D9;--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--the:#ECE4D9;--soft:#ECE4D9;--lom:#ECE4D9;--chu:#0A1629;--chu2:#5b5248;--chu3:#7c7166;--dam:#0A1629;--lamS:#ECE4D9;--vangS:#ECE4D9;--camS:#ECE4D9;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--clay:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--nho:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);--lomIn:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--men:none;--sang:none;--ngocK:var(--kim);--bongNgoc:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
html,body{width:390px;height:844px;overflow:hidden;background:var(--nen);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--chu);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.pg{position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(120% 520px at 20% 0,#F2EBE3 0,var(--nen) 70%) no-repeat,var(--nen);padding:20px 16px 22px;gap:16px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px}.top .logo{width:42px;height:42px;border-radius:13px;box-shadow:var(--nho);object-fit:cover}.top b{font-size:20px;font-weight:800;letter-spacing:-.4px}
.ve{flex:none;width:44px;height:44px;display:grid;place-items:center;margin-left:-8px;border-radius:22px}
.canh{display:flex;align-items:flex-end;gap:12px}.canh>img{flex:none;display:block;filter:drop-shadow(0 14px 12px rgba(10,22,41,.22))}
.noi{position:relative;flex:1;background:var(--the);background-image:var(--men);box-shadow:var(--clay);font-weight:800;line-height:1.3;color:var(--chu);padding:14px 16px;border-radius:26px;font-size:17px}.noi::before{content:"";position:absolute;left:-9px;bottom:26px;width:22px;height:22px;background:var(--the);transform:rotate(45deg);border-radius:4px;box-shadow:-4px 4px 6px -3px rgba(10,22,41,.18)}.noi small{display:block;font-size:14px;font-weight:600;color:var(--chu3);margin-top:4px}
.bt{flex:none;display:grid;place-items:center;border-radius:50%;background-color:var(--soft);box-shadow:var(--nho);background-image:radial-gradient(60% 34% at 50% 18%,rgba(255,255,255,.95),rgba(255,255,255,0) 100%),radial-gradient(50% 20% at 50% 92%,rgba(255,255,255,.5),rgba(255,255,255,0) 100%)}.bt.cam{background-color:var(--camS)}.bt.lam{background-color:var(--lamS)}.bt img{display:block;filter:drop-shadow(0 2px 2px rgba(10,22,41,.18))}
.the{position:relative;background:var(--the);background-image:var(--men);box-shadow:var(--clay);border-radius:30px;padding:16px}
.vach{height:12px;border-radius:99px;background:var(--lom);box-shadow:var(--lomIn);overflow:hidden}.vach i{display:block;height:100%;border-radius:99px;background:#c9692a}
.dong{display:flex;align-items:center;gap:12px}.dong+.dong{margin-top:12px}
.t1{font-size:16.5px;font-weight:800;letter-spacing:-.2px}.t2{font-size:13.5px;font-weight:600;color:var(--chu3);margin-top:2px}
.tai{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;color:#fff;font-weight:800;text-align:center;line-height:1.2;white-space:nowrap;background:var(--ngocK);box-shadow:var(--bongNgoc);border:0;min-height:68px;border-radius:26px;font-size:18px;padding:8px 18px}.tai svg{flex:none;fill:#fff}
.du{display:flex;align-items:center;gap:10px;margin-top:12px;height:56px;padding:0 6px 0 16px;border-radius:20px;background:var(--lom);box-shadow:var(--lomIn)}
.du span{flex:1;min-width:0;font-size:14.5px;font-weight:800;color:var(--dam);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;font-size:14px;font-weight:800;border-radius:16px;background:var(--the);box-shadow:var(--nho);color:var(--dam);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 8px;border-radius:99px;background:var(--the);background-image:var(--sang);box-shadow:var(--nho);font-weight:700;font-size:15px;color:var(--chu2);white-space:nowrap}.chip img{width:32px;height:32px}
.khac{display:flex;flex-direction:column;gap:10px;margin-top:auto}.khac>span{font-size:14.5px;font-weight:700;color:var(--chu2)}

.noi::before{background:var(--n)!important;box-shadow:3px 3px 5px -3px var(--lo)!important}
.lo{background:var(--n)!important;box-shadow:var(--lomIn)!important}
.hop{background:#F6F0E8!important;box-shadow:5px 5px 10px var(--lo),-5px -5px 10px var(--hi)!important}
.mn{background:var(--n);box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi);color:#0A1629}.mn.ok{background:var(--kim)!important;color:#0A1629!important;box-shadow:3px 3px 6px var(--lo),-3px -3px 6px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)!important}
.ma i{background:var(--n)!important;box-shadow:var(--lomIn)!important;color:#0A1629}
.vach,.du{background:var(--n)!important;box-shadow:var(--lomIn)!important}.vach i{background:var(--kim)!important}
.du span{color:#0A1629}.mo{background:var(--n)!important;color:#0A1629!important;box-shadow:var(--nho)!important;font-weight:700}
.lk{color:#8a6a2b!important;font-weight:600!important}
.top .logo{box-shadow:var(--nho)}
.ve{background:var(--n);box-shadow:var(--nho)}
.dong.mot{background:var(--n)!important;box-shadow:var(--lomIn)!important}.dong.mot h3,.dong.mot p{color:#A2412C!important}.dong.mot .bt{background:var(--n)!important}
.may.canhbao{color:#A2412C!important;box-shadow:var(--lomIn)!important}.may.canhbao svg{color:#A2412C}
h1,h3,.h{font-weight:800}
.the .dong{background:none!important;box-shadow:none!important}
