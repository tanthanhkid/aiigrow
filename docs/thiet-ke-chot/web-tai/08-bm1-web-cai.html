<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap"><title>Cài AiiGrow - iPhone / iPad</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--nen:#ecebe7;--the:#f7f6f3;--chu:#0f1312;--chu2:#3a403d;--chu3:#565c59;--dam:#0a5246;--soft:#dcebe6;--lamS:#e1e9fb;--vangS:#fbecc0;--clay:0 22px 30px -14px rgba(28,32,30,.34),0 6px 10px -5px rgba(28,32,30,.2),inset 0 1.5px 0 #fff,inset 0 -2px 0 rgba(255,255,255,.7),inset 0 -10px 16px -8px rgba(40,44,42,.14);--nho:0 12px 16px -8px rgba(28,32,30,.4),0 3px 5px -2px rgba(28,32,30,.24),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.16);--men:radial-gradient(46% 18px at 50% 3px,#fff 0,rgba(255,255,255,.95) 62%,rgba(255,255,255,0) 78%),linear-gradient(180deg,#fefefd 0,rgba(254,254,253,0) 26%,rgba(40,44,42,.025) 60%,rgba(40,44,42,.07) 100%);--ngocK:linear-gradient(180deg,rgba(255,255,255,.34) 0,rgba(255,255,255,.08) 24%,rgba(255,255,255,0) 26%),radial-gradient(60% 40% at 50% 105%,rgba(80,220,190,.4),rgba(0,0,0,0) 100%),linear-gradient(180deg,#0f6b5c,#08463d);--bongNgoc:0 14px 18px -6px rgba(10,82,70,.65),0 3px 5px -2px rgba(10,82,70,.35),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,30,25,.4)}
html,body{width:390px;height:844px;overflow:hidden;background:var(--nen);font-family:Inter,system-ui,sans-serif;color:var(--chu);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.pg{position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(120% 520px at 20% 0,#e3ebe7 0,var(--nen) 70%) no-repeat,var(--nen);padding:20px 16px 22px;gap:18px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px}.top b{font-size:20px;font-weight:800;letter-spacing:-.4px}
.ve{flex:none;width:44px;height:44px;display:grid;place-items:center;margin-left:-8px;border-radius:22px}
.bt{flex:none;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background-color:var(--soft);box-shadow:var(--nho);background-image:radial-gradient(60% 34% at 50% 18%,rgba(255,255,255,.95),rgba(255,255,255,0) 100%),radial-gradient(50% 20% at 50% 92%,rgba(255,255,255,.5),rgba(255,255,255,0) 100%)}.bt.lam{background-color:var(--lamS)}.bt.vang{background-color:var(--vangS)}.bt img{display:block;width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(28,32,30,.18))}
.canh{display:flex;align-items:flex-end;gap:14px}.canh>img{flex:none;display:block;filter:drop-shadow(0 14px 12px rgba(28,32,30,.22))}
.noi{position:relative;flex:1;background:var(--the);background-image:var(--men);box-shadow:var(--clay);font-weight:800;line-height:1.3;color:var(--chu)}.noi::before{content:"";position:absolute;left:-9px;bottom:26px;width:22px;height:22px;background:var(--the);transform:rotate(45deg);border-radius:4px;box-shadow:-4px 4px 6px -3px rgba(28,32,30,.18)}.noi small{display:block;font-weight:600;color:var(--chu3);margin-top:4px}
.tai{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;color:#fff;font-weight:800;text-align:center;line-height:1.2;white-space:nowrap;background:var(--ngocK);box-shadow:var(--bongNgoc);border:0}.tai svg{flex:none;fill:#fff}
.nho-d{text-align:center;font-size:13.5px;font-weight:600;color:var(--chu3);margin-top:10px}
.dong{display:flex;align-items:center;gap:14px;border-radius:28px;padding:12px 14px;min-height:84px;background:var(--the);background-image:var(--men);box-shadow:var(--clay)}
.so{flex:none;width:42px;height:42px;font-size:19px;display:grid;place-items:center;border-radius:50%;background:var(--ngocK);box-shadow:var(--bongNgoc);color:#fff;font-weight:800}
.dong div{flex:1;min-width:0}.dong h3{font-size:17px;font-weight:800;letter-spacing:-.2px}.dong p{font-size:13.5px;font-weight:600;color:var(--chu3);margin-top:2px}</style></head><body><div class="pg">

<div class="canh"><img src="/assets/rob/chi.webp" alt="" width="110" height="110"><div class="noi" style="padding:14px 16px;border-radius:24px;font-size:17px">3 bước là xong!<small>Làm trên máy của con.</small></div></div>
