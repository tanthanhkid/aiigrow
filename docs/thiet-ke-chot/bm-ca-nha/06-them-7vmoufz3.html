<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.nd{position:absolute;left:16px;right:16px;top:104px}
.ho{display:flex;align-items:center;gap:14px;padding:16px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.av{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#c08a5b;color:#fff;font-size:28px;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 10px 16px -8px rgba(0,0,0,.35)}
.ho p{font-size:17px;font-weight:800}
.ho p small{display:block;margin-top:2px;font-size:13px;font-weight:600;color:#565c59}
.chip{display:inline-flex;margin-top:6px;padding:4px 10px;border-radius:11px;background:#dcebe6;color:#0a5246;font-size:12.5px;font-weight:800}
.muc{margin:20px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.ds{padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.lg{display:flex;align-items:center;gap:12px;min-height:64px}
.lg+.lg{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800}
.lg p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.cac{display:flex}
.cac i{width:26px;height:26px;margin-left:-6px;border-radius:50%;display:grid;place-items:center;border:2px solid #f7f6f3;font-style:normal;font-size:11.5px;font-weight:800;color:#fff}
.cac i:first-child{margin-left:0}
.a{background:#f08a3c}.m{background:#5b7fd6}.n{background:#d86a8f}.k{background:#3f9a86}
.bo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;height:50px;border-radius:26px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:800;color:#b42318;white-space:nowrap}
.bo img{width:22px;height:22px}
.ghi{margin:10px 8px 0;text-align:center;font-size:12.5px;font-weight:600;color:#565c59}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Bà Hoa</h1></div>
<div class="nd">
<div class="ho"><div class="av">H</div><p>Bà Hoa<small>Vào nhà từ 20/10 · Mẹ Lan mời</small><span class="chip">Làm được như Ba Mẹ</span></p></div>
<p class="muc">Bà Hoa trong nhà</p>
<div class="ds">
<div class="lg"><span class="ic"><img src="/assets/icon3d/dt.webp" alt=""></span><p>Số điện thoại<small>0903 222 111</small></p></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/nguoi.webp" alt=""></span><p>Cùng trông<small>Cả 4 con</small></p><span class="cac"><i class="a">B</i><i class="m">M</i><i class="n">N</i><i class="k">K</i></span></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/dongho.webp" alt=""></span><p>7 ngày qua<small>Cho thêm giờ 3 lần · ngoài quy tắc</small></p></div>
</div>
<span class="bo" role="button" tabindex="0" data-toi="them-xnbiksmr"><img src="/assets/icon3d/thoat.webp" alt="">Mời Bà Hoa rời nhà</span>
<p class="ghi">Bà Hoa sẽ không xem, không cho giờ được nữa.</p>
</div>
</div></body></html>
