<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:24px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#E3D9CB;box-shadow:inset 4px 4px 8px rgba(120,98,70,.28),inset -4px -4px 8px #FFFBF5;color:var(--ink);font-size:22px}
.kim{background:var(--kim);color:#0A1629;font-weight:700;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;font-size:16px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutp{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.nutd{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#b42318;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.chev{flex:none;width:18px;height:18px;fill:var(--ink)}
.card{background:var(--n);box-shadow:var(--shL);border-radius:28px}
.sv{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(var(--n) 75%,rgba(236,228,217,0))}
.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.toi{padding:14px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.dau{display:flex;align-items:center;gap:12px}
.av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:24px;font-weight:800;background:var(--n);box-shadow:var(--sunk)}
.dau p{flex:1;font-size:13px;font-weight:600;color:var(--ink2)}
.cac{display:flex;margin-top:4px}
.cac i{width:24px;height:24px;margin-left:-5px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--n);background:var(--n);box-shadow:var(--sunk);font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink)}
.cac i:first-child{margin-left:0}
.nhan{margin:14px 6px 6px;font-size:13.5px;font-weight:800;color:#0A1629}
.hang{display:flex;gap:8px}
.lom{flex:1;min-width:0;display:flex;align-items:center;height:50px;padding:0 18px;border-radius:25px;background:var(--n);box-shadow:var(--sunk)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 17px 'Be Vietnam Pro',sans-serif;color:#0A1629}
.nut{flex:none;display:flex;align-items:center;justify-content:center;height:50px;padding:0 18px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.muc{margin:20px 6px 8px}
.ds{padding:4px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.lg{display:flex;align-items:center;gap:12px;min-height:64px}
.lg+.lg{border-top:1px solid rgba(120,98,70,.18)}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800}
.lg p small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2)}
.lg.do p{color:#b42318}
.lg.do .ic{color:#b42318}
.mui{flex:none;width:18px;height:18px;fill:#0A1629}
</style></head>

</div>

<div class="lg" role="button" tabindex="0" data-toi="bm1-welcome"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></span><p>Đăng xuất<small>Trên điện thoại này</small></p><svg class="mui chev" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="them-liz6hzww"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="m3 11 9-8 9 8M5 10v10h14V10"></path></svg></span><p>Rời nhà<small>Không trông 4 con nữa</small></p><svg class="mui chev" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
