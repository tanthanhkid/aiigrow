<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.nd{position:absolute;left:16px;right:16px;top:100px}
.muc{margin:14px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.muc:first-child{margin-top:4px}
.lom{display:flex;align-items:center;height:54px;padding:0 20px;border-radius:27px;background:#ecebe7;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 18px Inter,sans-serif;color:#0f1312}
.goi{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px 12px 8px;border-radius:28px;background:#dcebe6;box-shadow:var(--clay)}
.goi img{flex:none;width:56px;height:auto}
.goi p{font-size:14px;line-height:20px;font-weight:700;color:#0a5246}
.goi p b{font-weight:800}
.nut{display:flex;align-items:center;justify-content:center;margin-top:20px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-ncmuuqav"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Đổi mật khẩu</h1></div>
<div class="nd">
<p class="muc">Mật khẩu đang dùng</p><div class="lom"><input type="password" aria-label="Mật khẩu đang dùng" value="••••••••"></div>
<p class="muc">Mật khẩu mới</p><div class="lom"><input type="password" aria-label="Mật khẩu mới" value=""></div>
<p class="muc">Nhập lại mật khẩu mới</p><div class="lom"><input type="password" aria-label="Nhập lại mật khẩu mới" value=""></div>
<div class="goi"><img src="/assets/rob/chi.webp" alt=""><p><b>Ít nhất 8 ký tự.</b> Quên mật khẩu cũ thì đăng xuất rồi chọn «Quên mật khẩu».</p></div>
<span class="nut" role="button" tabindex="0" data-toi="them-ncmuuqav">Lưu mật khẩu mới</span>
</div>
</div></body></html>
