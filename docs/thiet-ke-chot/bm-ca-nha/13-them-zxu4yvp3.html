<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 30px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.canh{position:relative;display:flex;align-items:flex-end;gap:6px;height:150px}
.canh img{flex:none;width:118px;height:auto;margin-left:-6px}
.bong{position:relative;margin-bottom:46px;padding:12px 16px;border-radius:24px 24px 24px 8px;background:#f7f6f3;box-shadow:var(--clay);font-size:18px;line-height:24px;font-weight:800;letter-spacing:-.2px}
.chinh{display:flex;align-items:center;gap:14px;min-height:76px;margin-top:6px;padding:12px 16px 12px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.chinh .bt{flex:none;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:#dcebe6;box-shadow:var(--lom)}.chinh .bt img{width:32px;height:32px}
.chinh p{flex:1;min-width:0;font-size:17px;font-weight:800}.chinh p small{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:#565c59}
.mui{flex:none;width:18px;height:18px;fill:#0a5246}
.muc{margin:22px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.ds{padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.lg{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0}
.lg+.lg{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:26px;height:26px}
.lg p{flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:800}
.lg .mui{fill:#8a908d}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Hỏi AiiGrow</h1></div>
<div class="cuon">
<div class="canh"><img src="/assets/rob/so-tay.webp" alt=""><div class="bong">Ba Mẹ cần<br>giúp gì ạ?</div></div>
<div class="chinh" role="button" tabindex="0" data-toi="them-dmdjjhh1"><span class="bt"><img src="/assets/icon3d/tin.webp" alt=""></span><p>Nhắn tin AiiGrow<small>Hỏi gì cũng được, có người trả lời</small></p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<p class="muc">Ba Mẹ hay hỏi</p>
<div class="ds">
<div class="lg" role="button" tabindex="0" data-toi="bm2-may-m2"><span class="ic"><img src="/assets/icon3d/khien.webp" alt=""></span><p>Máy con báo «chưa bảo vệ» thì làm sao?</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="them-1akngbxb"><span class="ic"><img src="/assets/icon3d/sao.webp" alt=""></span><p>Sao đổi ra phút chơi thế nào?</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="them-5hzkl6p5"><span class="ic"><img src="/assets/icon3d/nguoi.webp" alt=""></span><p>Mời ông bà cùng trông con</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="bm2-may-ds"><span class="ic"><img src="/assets/icon3d/laptop.webp" alt=""></span><p>Ghép thêm máy cho con</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
</div>
</div>
</div></body></html>
