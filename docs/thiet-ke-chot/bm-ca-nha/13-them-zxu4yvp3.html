<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:24px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink);font-size:22px}
.kim{background:var(--kim);color:#0A1629;font-weight:700;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;font-size:16px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutp{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.nutd{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#b42318;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.chev{flex:none;width:18px;height:18px;fill:var(--ink)}
.card{background:var(--n);box-shadow:var(--shL);border-radius:28px}
.sv{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(var(--n) 75%,rgba(236,228,217,0))}
.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 30px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.canh{position:relative;display:flex;align-items:flex-end;gap:6px;height:150px}
.canh img{flex:none;width:118px;height:auto;margin-left:-6px}
.bong{position:relative;margin-bottom:46px;padding:12px 16px;border-radius:24px 24px 24px 8px;background:var(--n);box-shadow:var(--sh);font-size:18px;line-height:24px;font-weight:800;letter-spacing:-.2px}
.chinh{display:flex;align-items:center;gap:14px;min-height:76px;margin-top:6px;padding:12px 16px 12px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.chinh .bt{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink)}.chinh .bt svg{width:28px;height:28px}
.chinh p{flex:1;min-width:0;font-size:17px;font-weight:800}.chinh p small{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--ink2)}
.mui{flex:none;width:18px;height:18px;fill:#0A1629}
.muc{margin:22px 6px 8px}
.ds{padding:4px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.lg{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0}
.lg+.lg{border-top:1px solid rgba(120,98,70,.18)}
.lg p{flex:1;min-width:0;font-size:15px;line-height:20px;font-weight:800}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Hỏi AiiGrow</h1></div>
<div class="cuon">
<div class="canh"><img src="/assets/rob/so-tay.webp" alt=""><div class="bong">Ba Mẹ cần<br>giúp gì ạ?</div></div>
<div class="chinh" role="button" tabindex="0" data-toi="them-dmdjjhh1"><span class="bt"><svg viewBox="0 0 24 24" class="sv"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg></span><p>Nhắn tin AiiGrow<small>Hỏi gì cũng được, có người trả lời</small></p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<p class="muc">Ba Mẹ hay hỏi</p>
<div class="ds">
<div class="lg" role="button" tabindex="0" data-toi="bm2-may-m2"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg></span><p>Máy con báo «chưa bảo vệ» thì làm sao?</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="them-1akngbxb"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></span><p>Sao đổi ra phút chơi thế nào?</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="them-5hzkl6p5"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2.3.7 3.5 2.6 3.5 5.6"></path></svg></span><p>Mời ông bà cùng trông con</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="lg" role="button" tabindex="0" data-toi="bm2-may-ds"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><rect x="4" y="5" width="16" height="11" rx="2"></rect><path d="M2 20h20"></path></svg></span><p>Ghép thêm máy cho con</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
</div>
</div>
</div>
</body></html>
