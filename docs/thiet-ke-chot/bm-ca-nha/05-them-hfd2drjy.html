<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:24px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#E3D9CB;box-shadow:inset 4px 4px 8px rgba(120,98,70,.28),inset -4px -4px 8px #FFFBF5;color:var(--ink);font-size:22px}
.kim{background:var(--kim);color:#0A1629;font-weight:700;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;font-size:16px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutp{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.nutd{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#b42318;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.chev{flex:none;width:18px;height:18px;fill:var(--ink)}
.card{background:var(--n);box-shadow:var(--shL);border-radius:28px}
.sv{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.san{position:absolute;left:16px;right:16px;top:62px;height:270px;border-radius:36px;background:var(--ink);box-shadow:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);overflow:hidden}
.rob{position:absolute;left:50%;bottom:-20px;width:214px;margin-left:-107px;height:auto}
.tick{position:absolute;right:80px;top:40px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--kim);box-shadow:0 0 0 3px var(--ink),0 0 0 5px #D9AE57}
.tick svg{width:30px;height:30px;fill:#0A1629}
.chu{position:absolute;left:16px;right:16px;top:352px;text-align:center}
.chu h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.5px}
.chu p{margin-top:6px;font-size:15px;line-height:21px;color:var(--ink2)}
.nhan{position:absolute;left:22px;right:14px;top:442px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--ink2)}
.nhan span{display:flex;align-items:center;height:44px;padding:0 8px;color:#8a6a2b;font-weight:600}
.tb{position:absolute;left:16px;right:16px;top:488px;padding:14px;border-radius:24px;background:var(--ink);color:#F2EBE3;box-shadow:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35)}
.tb .dau{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#d6cbbd}
.tb .lg{width:22px;height:22px;border-radius:6px;background:var(--kim);display:grid;place-items:center;color:#0A1629}
.tb .lg svg{width:15px;height:15px}
.tb .dau span:last-child{margin-left:auto}
.tb b{display:block;margin-top:8px;font-size:15.5px}
.tb p{margin-top:2px;font-size:14px;color:#F2EBE3}
.cho{position:absolute;left:50%;top:612px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:var(--n);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:var(--sunk)}
.cho i{width:8px;height:8px;border-radius:4px;background:#D9AE57;box-shadow:0 0 0 4px rgba(217,174,87,.3)}
.day{position:absolute;left:16px;right:16px;bottom:22px;display:flex;flex-direction:column;gap:6px}
.nut{height:56px;font-size:17px}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:15px;font-weight:700;color:#b42318}
</style></head>

<p class="nhan">Điện thoại Ba Tuấn sẽ hiện:<span role="button" tabindex="0" data-toi="them-dclemm2i">Xem bên máy Ba Tuấn ›</span></p>

</div>
</div>
</body></html>
