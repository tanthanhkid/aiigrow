<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 120px;scrollbar-width:none;z-index:1}
.cuon::-webkit-scrollbar{display:none}
.the{position:relative;height:180px;border-radius:30px;background:linear-gradient(135deg,#dcefe7,#b8dccd);box-shadow:var(--clay);overflow:hidden}
.the::before{content:"";position:absolute;left:16px;right:16px;top:3px;height:52px;border-radius:30px 30px 80px 80px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}
.the .rob{position:absolute;right:-6px;bottom:-14px;width:140px;height:auto}
.avt{position:absolute;left:20px;top:18px;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:#3f9a86;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 10px 16px -8px rgba(10,82,70,.45),inset 0 2px 0 rgba(255,255,255,.35);font-size:32px;font-weight:800;color:#fff}
.cam{position:absolute;left:68px;top:62px;width:44px;height:44px;display:grid;place-items:center}
.cam i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 6px 10px -6px rgba(28,32,30,.4)}
.cam svg{width:17px;height:17px;fill:#0a5246}
.ten{position:absolute;left:22px;bottom:18px}
.ten b{display:block;font-size:26px;line-height:30px;font-weight:800;letter-spacing:-.5px;color:#0a5246}
.ten span{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 12px 3px 4px;border-radius:16px;background:rgba(255,255,255,.85);font-size:13.5px;font-weight:800;color:#0a5246}
.ten span i{font-style:normal;font-size:20px;line-height:24px}
.muc{margin:18px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.lom{display:flex;align-items:center;height:52px;padding:0 20px;border-radius:26px;background:#ecebe7;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 18px Inter,sans-serif;color:#0f1312}
.lom.chon{justify-content:space-between;font-size:17px;font-weight:700;cursor:pointer}
.lom.chon small{font-size:13px;font-weight:700;color:#565c59}
.lom.chon svg{width:20px;height:20px;fill:#0a5246}
.mau{display:flex;gap:12px;align-items:center;padding-left:4px}
.mau i{width:44px;height:44px;border-radius:50%;box-shadow:0 6px 10px -6px rgba(28,32,30,.4),inset 0 2px 0 rgba(255,255,255,.4)}
.mau i.chon{box-shadow:0 0 0 3px #f4f4f2,0 0 0 6px #0f6b5c}
.pin{position:relative;margin-top:18px;padding:14px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.pin .dau{display:flex;align-items:center;gap:10px;margin:0 0 10px 2px;font-size:15px;font-weight:800}
.pin .dau .ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.pin .dau .ic img{width:24px;height:24px}
.pin .dau em{margin-left:auto;margin-right:4px;font-style:normal;font-size:12.5px;font-weight:700;color:#565c59}
.o4{display:flex;gap:10px}
.o4 i{flex:1;height:52px;border-radius:20px;background:#ecebe7;box-shadow:var(--lom);display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:800;color:#0f1312}
.o4 i.dang{box-shadow:0 0 0 2.5px #0f6b5c,var(--lom)}
.goi{margin:10px 2px 0;font-size:12.5px;line-height:17px;font-weight:600;color:#3a403d}
.goi b{color:#0a5246;font-weight:800}
.day{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 26px;z-index:3;background:linear-gradient(rgba(244,244,242,0),#f4f4f2 18px)}
.nut{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:28px;border:0;font:800 16px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Thêm con</h1></div>
<div class="cuon">
<div class="the" aria-label="Xem trước hồ sơ của con">
<div class="avt">K</div>
<div class="cam" role="button" tabindex="0" aria-label="Thêm ảnh của con"><i><svg viewBox="0 0 256 256"><path d="M208,52H182.42L170,33.34A12,12,0,0,0,160,28H96a12,12,0,0,0-10,5.34L73.57,52H48A28,28,0,0,0,20,80V192a28,28,0,0,0,28,28H208a28,28,0,0,0,28-28V80A28,28,0,0,0,208,52ZM128,180a44,44,0,1,1,44-44A44.05,44.05,0,0,1,128,180Z"></path></svg></i></div>
<div class="ten"><b>Khang</b><span aria-label="9 tuổi, theo năm sinh 2017"><i>🐓</i>9 tuổi</span></div>
<img class="rob" src="/assets/rob/chi.webp" alt="">
</div>
<p class="muc">Tên gọi ở nhà</p>
<div class="lom"><input aria-label="Tên gọi ở nhà của con" value="Khang"></div>
<p class="muc">Năm sinh</p>
<div class="lom chon" role="button" tabindex="0" aria-label="Chọn năm sinh của con" data-toi="them-hjjdppuw"><span>2017 <small>· tuổi Dậu</small></span><svg viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<p class="muc">Màu của con</p>
<div class="mau" aria-label="Chọn màu để nhận ra con"><i style="background:#f08a3c"></i><i style="background:#5b7fd6"></i><i style="background:#d86a8f"></i><i class="chon" style="background:#3f9a86"></i><i style="background:#9a7fd0"></i></div>
<div class="pin" aria-label="Mã PIN vào máy của Khang">
<div class="dau"><span class="ic"><img src="/assets/icon3d/khoa.webp" alt=""></span>Mã PIN vào máy<em>4 số</em></div>
<div class="o4" aria-label="Đặt PIN 4 số"><i>•</i><i>•</i><i class="dang"></i><i></i></div>
<div class="goi"><b>Khang dùng PIN này để vào máy.</b> Không dùng ngày sinh.</div>
</div>
</div>
<div class="day">
<button class="nut" type="button" data-toi="them-fi17hb99">Lưu hồ sơ Khang</button>
</div>
</div></body></html>
