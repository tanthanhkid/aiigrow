<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--c2:#3a3a3a;--c3:#5f554b;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--the:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--nho:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);--lom:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi);--vang:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--ranh:#E4DACD;--xam:#E3D9CB;--dau:#C9973B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:var(--ink)}
.top h1{flex:1;min-width:0;padding:4px 0 4px 2px;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:88px;overflow:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px;z-index:1}
.the{position:relative;flex:none;min-height:170px;border-radius:30px;background:var(--n);padding:18px;display:flex;align-items:center;box-shadow:var(--the)}
.the .tr{display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:44%}
.avb{position:relative;width:84px;height:84px;border-radius:42px;border:4px solid var(--n);box-shadow:var(--nho)}
.avb .a{width:76px;height:76px;border-radius:38px;background:var(--ink);display:grid;place-items:center;font-size:34.2px;line-height:39px;font-weight:800;color:#F4C76A;box-shadow:var(--nho),inset 0 0 0 2px rgba(217,174,87,.85)}
.avb .cam{position:absolute;right:-8px;bottom:-6px;width:34px;height:34px;border-radius:17px;background:var(--n);display:grid;place-items:center;box-shadow:var(--nho)}
.avb .cam img{width:20px;height:20px}
.the .ten{font-size:24px;line-height:28px;font-weight:800;color:var(--ink)}
.chip{display:flex;align-items:center;gap:4px;background:var(--n);border-radius:99px;padding:3px 10px;box-shadow:var(--nho)}
.chip i{font-style:normal;font-size:13px;line-height:19px}.chip b{font-size:12.5px;line-height:18px;font-weight:800}
.the .rob{position:absolute;right:6px;bottom:0;top:6px;width:48%;display:flex;align-items:flex-end;justify-content:flex-end}
.the .rob img{width:150px;height:150px;object-fit:contain}
.anh{display:flex;gap:8px}
.anh div{flex:1;min-height:56px;border-radius:22px;background:var(--n);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--nho);font-size:12.5px;line-height:18px;font-weight:800;color:var(--c2)}
.anh img{width:24px;height:24px}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .l{padding:0 4px;font-size:14px;line-height:21px;font-weight:800;display:block}
.o{display:flex;align-items:center;min-height:54px;border-radius:27px;background:var(--ranh);box-shadow:var(--lom);padding:0 18px}
.o input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 17px 'Be Vietnam Pro',sans-serif;color:var(--ink);padding:12px 0}
.o.nam{font-variant-numeric:tabular-nums}
.o.nam b{flex:1;font-size:18px;line-height:23px;font-weight:800}
.o.nam svg{width:18px;height:18px;fill:var(--ink)}
.f .gc{margin:0 6px;font-size:13px;line-height:19px;color:var(--c3)}
.mau{display:flex;gap:12px;padding:0 4px}
.mau i{width:50px;height:50px;border-radius:25px;display:grid;place-items:center}
.mau i::after{content:"";width:38px;height:38px;border-radius:19px;background:var(--d);box-shadow:var(--nho)}
.mau i.c{box-shadow:inset 0 0 0 3px var(--dau)}
.pin{flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:30px;background:var(--n);box-shadow:var(--the)}
.pin .dau{display:flex;align-items:center;gap:10px}
.pin .ic{flex:none;width:40px;height:40px;border-radius:14px;background:var(--xam);box-shadow:var(--lom);display:grid;place-items:center}.pin .ic img{width:24px;height:24px}
.pin .dau b{flex:1;font-size:15px;line-height:22px;font-weight:800}.pin .dau em{font-style:normal;font-size:12.5px;line-height:18px;font-weight:600;color:var(--c2)}
.o4{display:flex;gap:10px}
.o4 i{flex:1;max-width:84px;height:58px;border-radius:20px;background:var(--xam);box-shadow:var(--lom);display:grid;place-items:center;font-style:normal;font-size:26px;line-height:30px;font-weight:800;font-variant-numeric:tabular-nums}
.o4 i.d{box-shadow:0 0 0 2.5px var(--ink),var(--lom)}
.pin .g{font-size:13px;line-height:19px;color:var(--c2)}.pin .g b{font-weight:800;color:var(--ink)}
.prow{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px}
.prow img{width:22px;height:22px}.prow span{flex:1;font-size:14px;line-height:21px;font-weight:800;color:var(--c2)}
.prow b{font-size:14px;line-height:21px;font-weight:800;color:var(--ink)}.prow svg{width:16px;height:16px;fill:var(--ink)}
.day{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 24px;background:var(--n);z-index:3}
.nut{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:0 20px;border-radius:28px;border:0;font:800 16px/22px 'Be Vietnam Pro',sans-serif;color:var(--ink);white-space:nowrap;background:var(--kim);box-shadow:var(--vang)}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Thêm con</h1></div>
<div class="cuon">
<div class="the" aria-label="Xem trước hồ sơ của con"><div class="tr"><div class="avb"><div class="a">K</div><div class="cam" role="button" tabindex="0" aria-label="Chụp ảnh đại diện"><img src="/assets/icon3d/camera.webp" alt=""></div></div><div class="ten">Khang</div><div class="chip" aria-label="9 tuổi, tuổi Dậu, theo năm sinh 2017"><i>🐓</i><b>9 tuổi</b></div></div><div class="rob"><img src="/assets/rob/chi.webp" alt=""></div></div>
<div class="anh"><div role="button" tabindex="0" aria-label="Chụp ảnh đại diện"><img src="/assets/icon3d/camera.webp" alt="">Chụp ảnh</div><div role="button" tabindex="0" aria-label="Chọn ảnh đại diện"><img src="/assets/icon3d/tia.webp" alt="">Chọn ảnh</div></div>
<div class="f"><label>Tên gọi ở nhà</label><div class="o"><input aria-label="Tên gọi ở nhà" value="Khang"></div></div>
<div class="f"><span class="l">Năm sinh</span><div class="o nam" role="button" tabindex="0" aria-label="Chọn năm sinh của con, đang là 2017" data-toi="them-hjjdppuw"><b>2017</b><svg viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div></div>
<div class="f"><span class="l">Màu của con</span><div class="mau" role="radiogroup" aria-label="Chọn màu để nhận ra con"><i style="--d:#0A1629"></i><i style="--d:#C9973B" class="c"></i><i style="--d:#9C5B2E"></i><i style="--d:#4F6B2A"></i><i style="--d:#6E3B4E"></i></div></div>
<div class="pin" aria-label="Mã PIN vào máy"><div class="dau"><span class="ic"><img src="/assets/icon3d/khoa.webp" alt=""></span><b>Mã PIN vào máy</b><em>4 số</em></div><div class="o4" aria-label="Đặt PIN 4 số"><i>3</i><i>8</i><i class="d"></i><i></i></div><div class="g"><b>Khang dùng PIN này để vào máy.</b> Không dùng ngày sinh.</div></div>
</div>
<div class="day"><button class="nut" type="button" data-toi="them-5t1kazz5">Lưu hồ sơ Khang</button></div>
</div></body></html>
