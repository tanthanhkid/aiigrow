<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(var(--n) 75%,rgba(236,228,217,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 120px;scrollbar-width:none;z-index:1}
.cuon::-webkit-scrollbar{display:none}
.the{position:relative;height:180px;border-radius:30px;background:var(--ink);box-shadow:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);overflow:hidden}
.the .rob{position:absolute;right:-6px;bottom:-14px;width:140px;height:auto}
.avt{position:absolute;left:20px;top:18px;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--ink);box-shadow:0 0 0 3px #D9AE57;font-size:32px;font-weight:800;color:#F4C76A}
.cam{position:absolute;left:68px;top:62px;width:44px;height:44px;display:grid;place-items:center}
.cam i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sh)}
.cam svg{width:17px;height:17px;color:var(--ink)}
.ten{position:absolute;left:22px;bottom:18px}
.ten b{display:block;font-size:26px;line-height:30px;font-weight:800;letter-spacing:-.5px;color:#F2EBE3}
.ten span{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 12px 3px 6px;border-radius:16px;background:var(--kim);font-size:13.5px;font-weight:800;color:#0A1629}
.ten span i{display:grid;place-items:center}.ten span svg{width:16px;height:16px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.lom{display:flex;align-items:center;height:52px;padding:0 20px;border-radius:26px;background:var(--n);box-shadow:var(--sunk)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 18px 'Be Vietnam Pro',sans-serif;color:#0A1629}
.lom.chon{justify-content:space-between;font-size:17px;font-weight:700;cursor:pointer}
.lom.chon small{font-size:13px;font-weight:600;color:var(--ink2)}
.lom.chon svg{width:20px;height:20px;fill:#0A1629}
.mau{display:flex;gap:12px;align-items:center;padding-left:4px}
.mau i{width:44px;height:44px;border-radius:50%;background:var(--n);box-shadow:var(--sunk);display:grid;place-items:center}
.mau i::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--d)}
.mau i.chon{background:var(--ink);box-shadow:0 0 0 2px #D9AE57}
.pin{position:relative;margin-top:18px;padding:14px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.pin .dau{display:flex;align-items:center;gap:10px;margin:0 0 10px 2px;font-size:15px;font-weight:800}
.pin .dau .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink)}.pin .dau .ic svg{width:22px;height:22px}
.pin .dau em{margin-left:auto;margin-right:4px;font-style:normal;font-size:12.5px;font-weight:600;color:var(--ink2)}
.o4{display:flex;gap:10px}
.o4 i{flex:1;height:52px;border-radius:20px;background:var(--n);box-shadow:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:22px;font-weight:800;color:#0A1629}
.o4 i.dang{box-shadow:0 0 0 2px #D9AE57,var(--sunk)}
.goi{margin:10px 2px 0;font-size:12.5px;line-height:17px;font-weight:400;color:var(--ink2)}
.goi b{color:#0A1629;font-weight:800}
.day{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 26px;z-index:3;background:linear-gradient(rgba(236,228,217,0),var(--n) 18px)}
.nut{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:16px;border:0;font:700 16px 'Be Vietnam Pro',sans-serif;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
</style></head>
<body data-lk-sua=""><div class="app">

<img class="rob" src="/assets/rob/chi.webp" alt="">
</div>
<p class="muc">Tên gọi ở nhà</p>
<div class="lom"><input aria-label="Tên gọi ở nhà của con" value="Khang"></div>
<p class="muc">Năm sinh</p>
<div class="lom chon" role="button" tabindex="0" aria-label="Chọn năm sinh của con" data-toi="them-hjjdppuw"><span>2017 <small>· tuổi Dậu</small></span><svg viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<p class="muc">Màu của con</p>
<div class="mau" aria-label="Chọn màu để nhận ra con"><i style="--d:#7c7166"></i><i style="--d:#C9973B"></i><i style="--d:#b9ad9e"></i><i class="chon" style="--d:#F4C76A"></i><i style="--d:#5b5248"></i></div>
<div class="pin" aria-label="Mã PIN vào máy của Khang">
<div class="dau"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>Mã PIN vào máy<em>4 số</em></div>

</div>

</div>
</body></html>
