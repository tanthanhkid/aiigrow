<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.nd{position:absolute;left:16px;right:16px;top:104px}
.san{position:relative;height:112px;border-radius:28px;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay);overflow:hidden}
.san::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:36px;border-radius:26px 26px 60px 60px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0))}
.nha{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:center;align-items:center}
.nha span{width:50px;height:50px;margin:0 -5px;border-radius:50%;display:grid;place-items:center;border:4px solid #eef4f1;font-size:19px;font-weight:800;color:#fff}
.l{background:#e98aa6}.a{background:#f08a3c}.m{background:#5b7fd6}.n{background:#d86a8f}.k{background:#3f9a86}
.nha .moi{margin-left:8px;background:#fff;border:3px dashed #0f6b5c}
.nha .moi svg{width:20px;height:20px;fill:#0a5246}
.san p{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13.5px;font-weight:800;color:#0a5246}
.cach{margin-top:18px;display:flex;gap:4px;padding:4px;border-radius:24px;background:#ecebe7;box-shadow:var(--lom)}
.cach span{flex:1;height:40px;border-radius:20px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#565c59}
.cach .on{background:#f7f6f3;color:#0f1312;box-shadow:var(--clay)}
.lom{margin-top:12px;display:flex;align-items:center;height:56px;padding:0 20px;border-radius:28px;background:#ecebe7;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 20px Inter,sans-serif;color:#0f1312;letter-spacing:.3px}
.goi{display:flex;justify-content:flex-end}
.goi span{min-height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:800;color:#0a5246}
.quyen{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.quyen p{font-size:15px;font-weight:800}
.quyen p small{display:block;font-size:12.5px;font-weight:600;color:#565c59;line-height:17px}
.day{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:22px;height:22px}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:14px;font-weight:700;color:#565c59;white-space:nowrap}
.lk b{margin-left:4px;color:#0a5246}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Mời người nhà</h1></div>
<div class="nd">
<div class="san"><div class="nha"><span class="l">L</span><span class="a">B</span><span class="m">M</span><span class="n">N</span><span class="k">K</span><span class="moi"><svg viewBox="0 0 24 24"><path d="M10.5 4.5a1.5 1.5 0 0 1 3 0v6h6a1.5 1.5 0 0 1 0 3h-6v6a1.5 1.5 0 0 1-3 0v-6h-6a1.5 1.5 0 0 1 0-3h6Z"></path></svg></span></div><p>Cùng trông 4 con với Mẹ Lan</p></div>
<div class="cach" role="tablist" aria-label="Mời bằng"><span class="on" role="tab" aria-selected="true" tabindex="0">Số điện thoại</span><span role="tab" aria-selected="false" tabindex="0">Email</span></div>
<div class="lom"><input type="tel" inputmode="tel" aria-label="Số điện thoại người được mời" value="0909 876 543"></div>
<div class="goi"><span role="button" tabindex="0" data-toi="them-hfd2drjy">Chọn từ danh bạ ›</span></div>
<div class="quyen"><span class="ic"><img src="/assets/icon3d/khien.webp" alt=""></span><p>Ba Tuấn làm được như bạn<small>Cho giờ, duyệt việc, đổi cài đặt</small></p></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-hfd2drjy"><img src="/assets/icon3d/gui.webp" alt="">Gửi lời mời cho Ba Tuấn</span>
<span class="lk" role="button" tabindex="0" data-toi="them-mflye65x">Ba Tuấn chưa có app?<b>Xem cách gửi link</b></span>
</div>
</div>
</div></body></html>
