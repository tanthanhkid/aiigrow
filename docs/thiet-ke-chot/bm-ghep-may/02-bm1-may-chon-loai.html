<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:5;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 120px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.muc{display:flex;align-items:center;gap:6px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.muc:first-child{margin-top:4px}
.cac-con{display:flex;justify-content:space-between;padding:6px 4px 0}
.be{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:7px}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800;box-shadow:0 8px 14px -8px rgba(28,32,30,.4),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 10px -4px rgba(0,0,0,.18)}
.av.a{background:#f08a3c}.av.m{background:#5b7fd6}.av.n{background:#d86a8f}.av.k{background:#3f9a86}
.be.on .av{box-shadow:0 0 0 3px #f4f4f2,0 0 0 5.5px #0f6b5c,0 10px 16px -8px rgba(10,82,70,.6)}
.be b{font-size:12.5px;font-weight:800;color:#3a403d;white-space:nowrap}
.be.on b{color:#0a5246}
.be.them .av{background:#f7f6f3;box-shadow:var(--clay)}
.be.them .av svg{width:22px;height:22px;fill:#0a5246}
.chon{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 14px 14px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.chon.on{background:#dcebe6;box-shadow:0 0 0 2.5px #0f6b5c,var(--clay);flex-wrap:wrap;row-gap:10px}
.ra{flex:none;width:26px;height:26px;border-radius:50%;background:#0f6b5c;display:grid;place-items:center}.ra svg{width:15px;height:15px;fill:#fff}
.ra.trong{background:#e6e5e1;box-shadow:var(--lom)}
.chon p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap}.chon p small{display:block;margin-top:3px;font-size:12.5px;font-weight:600;color:#3a403d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.tom{display:flex;gap:6px;width:100%}
.tom span{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:14px;background:rgba(255,255,255,.85);font-size:12.5px;font-weight:800;color:#0a5246;white-space:nowrap}.tom img{width:18px;height:18px}
.tu2{display:flex;align-items:center;gap:10px;margin:16px 6px 0;font-size:13.5px;font-weight:600;color:#3a403d}.tu2 img{width:24px;height:24px}
.rob{display:block;width:130px;height:auto;margin:10px auto 0}
.day{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:#f4f4f2;box-shadow:0 -12px 18px -12px rgba(28,32,30,.25);z-index:6}
.nut{width:100%;position:relative;overflow:hidden;height:56px;border-radius:30px;border:0;display:flex;align-items:center;justify-content:center;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
</style></head>
<body data-lk-sua=""><div class="app">

<div class="cuon">
<p class="muc">Máy mới của ai?</p>
<div class="cac-con" role="radiogroup">
<div class="be on" role="radio" aria-checked="true"><span class="av a">A</span><b>Bảo Anh</b></div>
<div class="be" role="radio" aria-checked="false"><span class="av m">M</span><b>Bảo Minh</b></div>
<div class="be" role="radio" aria-checked="false"><span class="av n">N</span><b>Bảo Ngọc</b></div>
<div class="be" role="radio" aria-checked="false"><span class="av k">K</span><b>Khang</b></div>
<div class="be them" role="button" tabindex="0" data-toi="them-9ozp26pq"><span class="av"><svg viewBox="0 0 24 24"><path d="M10.5 4.5a1.5 1.5 0 0 1 3 0v6h6a1.5 1.5 0 0 1 0 3h-6v6a1.5 1.5 0 0 1-3 0v-6h-6a1.5 1.5 0 0 1 0-3h6Z"></path></svg></span><b>Thêm con</b></div>
</div>
<p class="muc">Cài cho máy mới</p>
<div class="chon on" role="radio" aria-checked="true"><span class="ra"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></span><p>Giống Laptop của Bảo Anh<small>Y như máy trước · nên chọn</small></p>
<div class="tom"><span><img src="/assets/icon3d/dongho.webp" alt="">60 phút</span><span><img src="/assets/icon3d/khien.webp" alt="">Chặn app &amp; web</span><span><img src="/assets/icon3d/trang_ngu.webp" alt="">Ngủ 21:30</span></div></div>
<div class="chon" role="radio" aria-checked="false"><span class="ra trong"></span><span class="ic"><img src="/assets/icon3d/banhrang.webp" alt=""></span><p>Cài riêng cho máy này<small>Chỉnh sau khi ghép xong</small></p></div>
<p class="tu2"><img src="/assets/icon3d/lap_lanh.webp" alt="">Không cần chọn loại máy, trang tải tự nhận.</p>
<img class="rob" src="/assets/rob/chi.webp" alt="">
</div>
<div class="day"><button class="nut" type="button" data-toi="bm1-may-ghep"><span>Lấy mã ghép máy mới cho Bảo Anh</span></button></div>
</div></body></html>
