<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:140px;padding:44px 8px 0;z-index:4;background:linear-gradient(#e3efeb 80%,rgba(227,239,235,0))}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{margin:6px 12px 0;font-size:28px;font-weight:800;letter-spacing:-.6px;white-space:nowrap}
.cuon{position:absolute;left:0;right:0;top:140px;bottom:150px;overflow-y:auto;padding:8px 16px 24px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.the{position:relative;height:168px;border-radius:32px;background:#f7f6f3;box-shadow:var(--clay);overflow:hidden}
.the+.the{margin-top:14px}
.the .hinh{position:absolute;left:12px;top:12px;bottom:12px;width:128px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1)}
.the .hinh img{width:92px;height:92px}
.the.loi .hinh{background:linear-gradient(#f9dcc0,#fdeedd)}
.the.nghi .hinh{background:linear-gradient(#e6e5e1,#f1f0ec)}
.huy{position:absolute;right:-6px;bottom:-6px;width:44px;height:44px}
.nd{position:absolute;left:156px;right:14px;top:20px}
.nd h2{font-size:21px;font-weight:800}
.tt{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:12px;background:#dcebe6;color:#0a5246;font-size:13px;font-weight:800;white-space:nowrap}
.loi .tt{background:#fbd9bb;color:#a14b00}
.nd p{margin-top:8px;font-size:13.5px;line-height:19px;font-weight:600;color:#3a403d}
.xem{position:absolute;left:156px;bottom:10px;display:flex;align-items:center;min-height:44px;font-size:14.5px;font-weight:800;color:#0a5246;white-space:nowrap}
.loi .xem{color:#a14b00}
.day{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;display:flex;flex-direction:column;gap:6px;background:#f4f4f2;box-shadow:0 -12px 18px -12px rgba(28,32,30,.25);z-index:4}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.lk{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:15px;font-weight:800;color:#0f1312}
.lk img{width:22px;height:22px}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Máy của Bảo Anh</h1></div>
<div class="cuon">
<div class="the loi" role="button" tabindex="0">
<div class="hinh"><img src="/assets/icon3d/tablet.webp" alt=""></div>
<div class="nd"><h2>iPad</h2><span class="tt">! Chưa bảo vệ</span><p>Không bị tính giờ<br>từ 20:45 hôm qua</p></div>
<span class="xem">Sửa iPad ›</span>
</div>
<div class="the" role="button" tabindex="0">
<div class="hinh"><img src="/assets/icon3d/laptop.webp" alt=""><img class="huy" src="/assets/icon3d/khien.webp" alt=""></div>
<div class="nd"><h2>Laptop</h2><span class="tt">✓ Đang bảo vệ</span><p>Đang chơi Roblox<br>Hôm nay 40 phút</p></div>
<span class="xem">Xem máy ›</span>
</div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0">+ Ghép thêm máy cho Bảo Anh</span>
<span class="lk" role="button" tabindex="0"><img src="/assets/icon3d/khoa.webp" alt="">Khoá tất cả máy ngay</span>
</div>
</div></body></html>
