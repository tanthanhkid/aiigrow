<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.muc{display:flex;align-items:center;gap:6px;margin:10px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.muc em{font-style:normal;padding:2px 8px;border-radius:10px;font-size:12px;background:#ecebe7;color:#3a403d}
.the{position:relative;display:flex;gap:14px;padding:12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.the+.the{margin-top:12px}
.hinh{position:relative;flex:none;width:112px;height:120px;border-radius:22px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}
.hinh img{width:78px;height:78px}
.the.loi .hinh{background:#f3d6b8}
.huy{position:absolute;right:-4px;bottom:-4px;width:40px!important;height:40px!important}
.nd{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:6px}
.nd h2{font-size:20px;font-weight:800}
.tt{align-self:flex-start;margin-top:6px;padding:4px 9px;border-radius:11px;background:#dcebe6;color:#0a5246;font-size:12.5px;font-weight:800;white-space:nowrap}
.loi .tt{background:#f9e7d2;color:#8a3c0c}
.nd p{margin-top:6px;font-size:13px;line-height:18px;font-weight:600;color:#3a403d}
.nd p b{color:#1aa37a;font-weight:800}
.xem{margin-top:auto;display:flex;align-items:center;min-height:44px;font-size:14px;font-weight:800;color:#0a5246;white-space:nowrap}
.loi .xem{color:#8a3c0c}
.day{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut.phu{color:#0f1312;background:#fff;box-shadow:var(--clay)}
.nut img{width:22px;height:22px}
.ghi{margin:12px 8px 0;font-size:12.5px;font-weight:600;color:#565c59;line-height:18px;text-align:center}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ho-so"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Máy của Bảo Anh</h1></div>
<div class="cuon">
<p class="muc">Cần sửa<em>1</em></p>
<div class="the loi" role="button" tabindex="0" data-toi="bm2-may-m2">
<div class="hinh"><img src="/assets/icon3d/tablet.webp" alt=""></div>
<div class="nd"><h2>iPad</h2><span class="tt">! Chưa bảo vệ</span><p>Không bị tính giờ<br>từ 20:45 hôm qua</p><span class="xem">Sửa iPad ›</span></div>
</div>
<p class="muc">Đang bảo vệ<em>1</em></p>
<div class="the" role="button" tabindex="0" data-toi="bm2-may-m1">
<div class="hinh"><img src="/assets/icon3d/laptop.webp" alt=""><img class="huy" src="/assets/icon3d/khien.webp" alt=""></div>
<div class="nd"><h2>Laptop</h2><span class="tt">✓ Đang bảo vệ</span><p><b>● Roblox</b> từ 19:02 · 39′<br>Chặn app &amp; web</p><span class="xem">Xem máy ›</span></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm1-may-chon-loai">+ Ghép thêm máy cho Bảo Anh</span>
<span class="nut phu" role="button" tabindex="0" data-toi="them-sll7clha"><img src="/assets/icon3d/khoa.webp" alt="">Khoá tất cả máy ngay</span>
</div>
<p class="ghi">Giờ chơi tính chung mọi máy: còn 18 phút.</p>
</div>
</div></body></html>
