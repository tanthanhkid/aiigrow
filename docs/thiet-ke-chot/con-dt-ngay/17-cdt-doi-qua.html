*{box-sizing:border-box;margin:0;padding:0}

.the{background:#fff;border:1px solid #ece7dc;border-radius:24px;box-shadow:0 2px 8px rgba(30,30,20,.06),0 1px 2px rgba(30,30,20,.05);padding:16px}
.the.vang{background:#fff5d9;border-color:#f5e6b8}
.giua{text-align:center}

.ic3 img{width:80px;height:80px}

.hang{display:flex;align-items:center;justify-content:center;gap:12px}

.phu{font-size:15px;line-height:20px;color:#5f6b7a;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;font-weight:800;font-size:13.5px;white-space:nowrap;background:#f1efe9;color:#5f6b7a}
.pill img{width:22px;height:22px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:26px;font-weight:800;font-size:17px;white-space:nowrap;background:#2f9e5f;color:#fff;box-shadow:0 3px 8px rgba(47,158,95,.28)}
.b img{width:26px;height:26px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-weight:800;font-size:15px;color:#5f6b7a;white-space:nowrap}
