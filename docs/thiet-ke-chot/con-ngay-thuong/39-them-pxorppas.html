<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{overflow:hidden;width:460px;height:340px}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#0f1312;-webkit-font-smoothing:antialiased;background:radial-gradient(circle 420px at 20% 0,#e3ebe7,#ecebe7)}.wrap{padding:22px}.the{position:relative;border-radius:28px;background:#f7f6f3;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 30px rgba(28,32,30,.38),0 4px 10px rgba(28,32,30,.20)}.the::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(192px 19px at 50% 0,#fff,rgba(255,255,255,.95) 50%,rgba(255,255,255,0)),linear-gradient(180deg,#fefefe 0,rgba(254,254,254,0) 26%,rgba(28,32,30,.07) 100%)}.the>*{position:relative;z-index:1}.hs{display:flex;align-items:center;gap:12px}.vc{flex:none;width:48px;height:48px;border-radius:50%;background:#fbecc0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(28,32,30,.40),0 2px 5px rgba(28,32,30,.22)}.vc img{width:27px;height:27px}.nut{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:0;border-radius:18px;font:700 15px/18px -apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;white-space:nowrap;cursor:pointer}.nut.chi{color:#fff;background:linear-gradient(180deg,#2e3533,#121615);box-shadow:0 7px 16px rgba(15,19,18,.6),0 2px 5px rgba(15,19,18,.35)}.nut.sang{color:#0f1312;background:linear-gradient(180deg,#fff 0,#f7f6f3 50%,#efeeeb 100%);box-shadow:0 6px 14px rgba(28,32,30,.40),0 2px 4px rgba(28,32,30,.24)}.md{height:34px;border-radius:17px;border:1.5px dashed #565c59;background:#fbecc0;font:600 14px/31px -apple-system,sans-serif;text-align:center;cursor:pointer;white-space:nowrap}</style></head><body><div class="wrap"><div class="the"><div class="hs"><div class="vc"><img src="/a
