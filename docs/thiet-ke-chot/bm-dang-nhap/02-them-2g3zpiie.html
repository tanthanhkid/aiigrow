<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(10,22,41,.26),0 4px 8px -5px rgba(10,22,41,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(10,22,41,.12);--lom:inset 0 5px 10px rgba(10,22,41,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:400px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:8px;right:8px;top:44px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0A1629}
.hoi{min-height:44px;padding:0 10px;display:flex;align-items:center;font-size:14px;font-weight:700;color:#0A1629}
.buoc{position:absolute;left:50%;top:65px;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.buoc i{width:28px;height:6px;border-radius:3px;background:#ebe2d7}.buoc i.on{background:#0A1629}
.san{position:absolute;left:16px;right:16px;top:100px;height:200px;border-radius:36px;background:linear-gradient(#F2EBE3,#F2EBE3);box-shadow:var(--clay);overflow:hidden}
.san::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:60px;border-radius:34px 34px 80px 80px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));z-index:1}
.san .rob{position:absolute;right:0;bottom:-20px;width:160px;height:auto;z-index:2}
.bong{position:absolute;left:18px;top:28px;max-width:170px;padding:11px 16px;border-radius:22px;background:#fff;font-size:15px;line-height:20px;font-weight:700;z-index:3;box-shadow:0 6px 10px -6px rgba(10,22,41,.26),inset 0 -6px 10px -5px rgba(10,22,41,.12)}
.bong::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-7px;width:14px;height:14px;background:#fff;border-radius:3px;transform:rotate(45deg)}
.khoa{position:absolute;left:28px;bottom:22px;width:56px;height:56px;z-index:3;transform:rotate(-10deg)}
.chu{position:absolute;left:16px;right:16px;top:320px;text-align:center}
.chu h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.nd{position:absolute;left:16px;right:16px;top:376px}
.nhan{display:flex;align-items:center;gap:8px;margin:0 6px 8px;font-size:14px;font-weight:700;white-space:nowrap}
.nhan em{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;background:#0A1629}
.nhan.sau{margin-top:20px}
.lom{display:flex;align-items:center;gap:8px;height:60px;padding:0 7px 0 20px;border-radius:30px;background:#ebe2d7;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:800 20px 'Be Vietnam Pro',sans-serif;color:#0A1629;letter-spacing:.3px}
.gui{flex:none;height:46px;padding:0 14px;border-radius:23px;display:flex;align-items:center;gap:6px;color:#fff;font-size:14px;font-weight:800;white-space:nowrap;background:#0A1629;box-shadow:0 8px 14px -8px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -4px 8px -3px rgba(0,0,0,.25)}
.gui svg{width:15px;height:15px;fill:#fff}
.o6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.o6 span{height:60px;border-radius:18px;background:#ebe2d7;box-shadow:var(--lom);display:grid;place-items:center;font-size:26px;font-weight:800}
.o6 span.dang{background:#F2EBE3;box-shadow:0 0 0 2.5px #0A1629,var(--clay)}
.lai{display:flex;justify-content:center;align-items:center;gap:6px;min-height:44px;margin-top:6px;font-size:14px;font-weight:600;color:#5a5a5a}
.lai b{color:#0A1629;font-weight:800}
.day{position:absolute;left:16px;right:16px;bottom:22px}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 14px 20px -10px rgba(10,22,41,.55),0 4px 8px -4px rgba(10,22,41,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--kimsh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}

html,body,.app{background:var(--n)!important}
.app::before{display:none!important}
body{color:#0A1629}
.hero{background:var(--n)!important;box-shadow:var(--shL)!important}
.hero::before{display:none!important}
.bong{background:var(--n)!important;box-shadow:var(--sh)!important}
.bong::after{background:var(--n)!important}
.bong p{color:#5b5248!important}
.nhan em{color:#7c7166!important}
.lom{background:var(--n)!important;box-shadow:var(--sunk)!important}
.lom input{color:#0A1629}
.mat svg{fill:#7c7166!important}
.nut{background:var(--kim)!important;color:#0A1629!important;font-weight:700!important;border-radius:16px!important;box-shadow:var(--kimsh)!important}
.nut::before{display:none!important}
.nut.phu{background:var(--n)!important;box-shadow:var(--sh)!important}
.ghi{color:#7c7166!important}
.lk{color:#8a6a2b!important;font-weight:600!important}

.buoc i{background:var(--n)!important;box-shadow:var(--sunk)}.buoc i.on{background:#0A1629!important;box-shadow:none}
.san{background:var(--n)!important;box-shadow:var(--shL)!important}
.san::before{display:none!important}
.bong{background:var(--n)!important;box-shadow:var(--sh)!important;color:#0A1629}
.bong::after{background:var(--n)!important}
.hoi{color:#0A1629}
.nhan em{background:#0A1629!important;color:#F4C76A!important}
.mat svg{fill:#7c7166!important}
.goi{color:#7c7166!important}.goi.ok{color:#0A1629!important}

.khoa{display:grid;place-items:center;width:50px!important;height:50px!important;border-radius:50%;background:var(--n);box-shadow:var(--sh);transform:none!important;color:#0A1629}
.gui{background:#0A1629!important;color:#F4C76A!important;box-shadow:none!important}
.gui svg{fill:#F4C76A!important}
.o6 span{background:var(--n)!important;box-shadow:var(--sunk)!important}
.o6 span.dang{background:var(--n)!important;box-shadow:0 0 0 2.5px #0A1629,var(--sunk)!important}
.lai{color:#5b5248!important}.lai b{color:#0A1629}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top">
<div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-dang-nhap"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div>
<div class="hoi" role="button" tabindex="0" data-toi="them-zxu4yvp3">Cần giúp?</div>
</div>
<div class="buoc" aria-label="Bước 1 trên 2"><i class="on"></i><i></i></div>
<div class="san"><div class="bong">Đừng lo, Grow giúp lấy lại nè!</div><span class="khoa"><svg class="sv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg></span><img class="rob" src="/assets/rob/so-tay.webp" alt=""></div>

</div>

</div>
</body></html>
