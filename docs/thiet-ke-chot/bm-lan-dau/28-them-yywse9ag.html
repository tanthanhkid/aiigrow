<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:390px;height:844px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:400px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:8px;top:44px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.hoi{min-height:44px;padding:0 10px;display:flex;align-items:center;font-size:14px;font-weight:700;color:#0a5246}
.buoc{position:absolute;left:50%;top:65px;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.buoc i{width:28px;height:6px;border-radius:3px;background:#dddcd8}.buoc i.on{background:#0f6b5c}
.san{position:absolute;left:16px;right:16px;top:100px;height:196px;border-radius:36px;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay);overflow:hidden}
.san::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:60px;border-radius:34px 34px 80px 80px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));z-index:1}
.san .rob{position:absolute;right:0;bottom:-22px;width:160px;height:auto;z-index:2}
.bong{position:absolute;left:18px;top:26px;max-width:180px;padding:11px 16px;border-radius:22px;background:#fff;font-size:15px;line-height:20px;font-weight:700;z-index:3;box-shadow:0 6px 10px -6px rgba(28,32,30,.26),inset 0 -6px 10px -5px rgba(40,44,42,.12)}
.bong::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-7px;width:14px;height:14px;background:#fff;border-radius:3px;transform:rotate(45deg)}
.khoa{position:absolute;left:28px;bottom:20px;width:56px;height:56px;z-index:3;transform:rotate(-10deg)}
.chu{position:absolute;left:16px;right:16px;top:314px;text-align:center}
.chu h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.nd{position:absolute;left:16px;right:16px;top:368px}
.nhan{display:flex;align-items:center;gap:8px;margin:0 6px 8px;font-size:14px;font-weight:700}
.nhan em{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;background:#0f6b5c}
.nhan.sau{margin-top:22px}
.lom{display:flex;align-items:center;gap:8px;height:62px;padding:0 8px 0 20px;border-radius:31px;background:#e6e5e1;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:800 20px Inter,sans-serif;color:#0f1312;letter-spacing:.4px}
.gui{flex:none;height:46px;padding:0 16px;border-radius:23px;display:flex;align-items:center;gap:6px;color:#fff;font-size:14.5px;font-weight:800;white-space:nowrap;background:#0f6b5c;box-shadow:0 8px 14px -8px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -4px 8px -3px rgba(0,0,0,.25)}
.gui svg{width:15px;height:15px;fill:#fff}
.o6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.o6 span{height:62px;border-radius:18px;background:#e6e5e1;box-shadow:var(--lom);display:grid;place-items:center;font-size:26px;font-weight:800}
.o6 span.dang{background:#f7f6f3;box-shadow:0 0 0 2.5px #0f6b5c,var(--clay)}
.lai{display:flex;justify-content:center;align-items:center;gap:6px;min-height:44px;margin-top:6px;font-size:14px;font-weight:600;color:#565c59}
.lai b{color:#0a5246;font-weight:800}
.day{position:absolute;left:16px;right:16px;bottom:24px}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
</style></head>
<body><div class="app">
<div class="top">
<div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-dang-nhap"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div>
<div class="hoi" role="button" tabindex="0" data-toi="bm2-ho-tro">Cần giúp?</div>
</div>
<div class="buoc" aria-label="Bước 1 trên 2"><i class="on"></i><i></i></div>
<div class="san"><div class="bong">Đừng lo, Rob giúp lấy lại nè!</div><img class="khoa" src="/assets/icon3d/khoa.webp" alt=""><img class="rob" src="/assets/rob/so-tay.webp" alt=""></div>
<div class="chu"><h1>Quên mật khẩu</h1></div>
<div class="nd">
<div class="nhan"><em>1</em>Nhập số đã đăng ký, bấm Gửi mã</div>
<div class="lom"><input type="tel" inputmode="tel" aria-label="Số điện thoại đã đăng ký" value="0912 345 678"><span class="gui" role="button" tabindex="0"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg>Đã gửi mã</span></div>
<div class="nhan sau"><em>2</em>Nhập mã 6 số vừa nhận</div>
<div class="o6" aria-label="Nhập mã 6 số"><span>4</span><span>8</span><span>2</span><span class="dang"></span><span></span><span></span></div>
<p class="lai">Chưa nhận được? <b>Gửi lại sau 0:42</b></p>
</div>
<div class="day"><button class="nut" type="button" data-toi="them-6aomy24b"><span>Xác nhận mã</span></button></div>
</div></body></html>
