<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--nho:0 6px 10px -6px rgba(28,32,30,.26),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.14);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:360px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.buoc{display:flex;gap:8px}.buoc i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e6e5e1;box-shadow:var(--lom)}.buoc i img{width:20px;height:20px;opacity:.45}.buoc i.on{background:#fbecc0;box-shadow:0 0 0 2.5px #0f6b5c,var(--clay)}.buoc i.on img,.buoc i.xong img{opacity:1}
.nen{position:absolute;left:16px;right:16px;top:104px}
.nen h2{font-size:26px;font-weight:800;letter-spacing:-.5px}
.nen .o{height:150px;margin-top:14px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.38);z-index:6}
.bang{position:absolute;left:0;right:0;bottom:0;height:566px;padding:10px 16px 0;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -14px 30px -10px rgba(15,19,18,.35),inset 0 1.5px 0 #fff;z-index:7}
.keo{width:44px;height:5px;margin:0 auto 12px;border-radius:3px;background:#c9c8c3}
.dau2{display:flex;align-items:center;gap:10px}.dau2 img{width:34px;height:34px}
.dau2 b{font-size:20px;font-weight:800;white-space:nowrap}
.tab2{display:flex;gap:4px;margin-top:14px;padding:5px;border-radius:24px;background:#ebebe7;box-shadow:var(--lom)}
.tab2 div{flex:1;height:56px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#565c59}
.tab2 small{font-size:12px;font-weight:700}.tab2 b{font-size:20px;font-weight:800}
.tab2 div.on{background:#fff;box-shadow:var(--nho);color:#0a5246}
.banh{position:relative;display:flex;justify-content:center;gap:56px;height:200px;margin-top:14px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay);overflow:hidden}
.banh::before{content:"";position:absolute;left:12px;right:12px;top:80px;height:40px;border-radius:14px;background:#dcebe6}
.banh::after{content:"";position:absolute;inset:0;background:linear-gradient(#f7f6f3,rgba(247,246,243,0) 38%,rgba(247,246,243,0) 62%,#f7f6f3)}
.banh .hai{position:absolute;left:50%;top:80px;line-height:40px;font-size:26px;font-weight:800;transform:translateX(-50%);z-index:1}
.cot{position:relative;display:flex;flex-direction:column;align-items:center;width:56px}
.cot span{height:40px;line-height:40px;font-size:22px;font-weight:600;color:#565c59}
.cot span.giua{font-size:26px;font-weight:800;color:#0f1312}
.nhan2{margin:16px 6px 8px;font-size:13px;font-weight:700;color:#565c59}
.ngay{display:flex;gap:5px}
.ngay span{flex:1;height:40px;display:grid;place-items:center;border-radius:14px;background:#ebebe7;box-shadow:var(--lom);font-size:13px;font-weight:800;color:#565c59}
.ngay span.chon{background:#dcebe6;color:#0a5246;box-shadow:0 0 0 2px #0f6b5c}
.day{position:absolute;left:16px;right:16px;bottom:16px}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;display:flex;align-items:center;justify-content:center;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-ob-gio"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><div class="buoc" aria-label="Bước 4 trên 5: Giờ"><i class="xong"><img src="/assets/icon3d/tick.webp" alt=""></i><i class="xong"><img src="/assets/icon3d/sao.webp" alt=""></i><i class="xong"><img src="/assets/icon3d/qua.webp" alt=""></i><i class="on"><img src="/assets/icon3d/dongho.webp" alt=""></i><i><img src="/assets/icon3d/may_tinh.webp" alt=""></i></div></div>
<div class="nen"><h2>Giờ chơi của Bảo Anh</h2><div class="o"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm1-ob-gio"></div>
<div class="bang" role="dialog" aria-label="Chọn giờ ngủ">
<div class="keo"></div>
<div class="dau2"><img src="/assets/icon3d/trang_ngu.webp" alt=""><b>Giờ ngủ của Bảo Anh</b></div>
<div class="tab2"><div class="on" role="tab" aria-selected="true"><small>Máy khoá lúc</small><b>21:30</b></div><div role="tab" aria-selected="false"><small>Mở lại lúc</small><b>6:30</b></div></div>
<div class="banh" aria-label="Chọn giờ: 21 giờ 30">
<span class="hai">:</span>
<div class="cot"><span>19</span><span>20</span><span class="giua">21</span><span>22</span><span>23</span></div>
<div class="cot"><span>20</span><span>25</span><span class="giua">30</span><span>35</span><span>40</span></div>
</div>
<p class="nhan2">Áp dụng các ngày</p>
<div class="ngay"><span class="chon">T2</span><span class="chon">T3</span><span class="chon">T4</span><span class="chon">T5</span><span class="chon">T6</span><span class="chon">T7</span><span class="chon">CN</span></div>
<div class="day"><button class="nut" type="button" data-toi="bm1-ob-gio"><span>Lưu giờ ngủ 21:30 – 6:30</span></button></div>
</div>
</div></body></html>
