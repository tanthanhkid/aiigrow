<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--clay:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:var(--ink)}
.nd{position:absolute;left:16px;right:16px;top:104px;z-index:2;text-align:center}
.bt{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--clay)}.bt img{width:56px;height:56px}
.h{margin-top:18px;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.5px}
.s{margin-top:6px;font-size:15px;line-height:21px;color:#5b5248}.s b{color:var(--ink)}
.ma{display:flex;gap:8px;justify-content:center;margin-top:28px}
.ma i{width:48px;height:60px;border-radius:18px;background:#E3D9CB;box-shadow:var(--lom);display:grid;place-items:center;font:800 26px 'Be Vietnam Pro',sans-serif;font-style:normal}
.ma i.dang{background:var(--n);box-shadow:0 0 0 3px #D9AE57,var(--clay)}
.lai{display:inline-flex;align-items:center;gap:8px;margin-top:22px;min-height:44px;font-size:14px;font-weight:600;color:#7c7166}
.lai img{width:20px;height:20px}
.day{position:absolute;left:16px;right:16px;bottom:22px;z-index:3}
.nut{width:100%;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:var(--ink);white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-dang-ky"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="nd">
<div class="bt"><img src="/assets/icon3d/khien.webp" alt=""></div>
<h1 class="h">Nhập mã xác thực</h1>
<p class="s">Mã 6 số đã gửi tới <b>0912 345 678</b></p>
<div class="ma"><i>4</i><i>8</i><i>2</i><i>0</i><i class="dang"></i><i></i></div>
<div class="lai"><img src="/assets/icon3d/dong_ho_cat.webp" alt="">Chưa nhận được? Gửi lại sau 0:42</div>
</div>
<div class="day"><button class="nut" type="button" data-toi="bm1-ob-ten-con"><span>Xác thực số điện thoại</span></button></div>
</div>
</body></html>
