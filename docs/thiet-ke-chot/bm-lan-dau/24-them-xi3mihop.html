<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--nho:0 6px 10px -6px rgba(28,32,30,.26),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.14);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:360px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;z-index:5}
.top h1{flex:1;margin-left:4px;font-size:21px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.giup{flex:none;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--nho)}.giup img{width:26px;height:26px}
.card{position:absolute;left:16px;right:16px;top:100px;height:222px;border-radius:34px;background:radial-gradient(90% 70% at 50% 30%,#e9f4f0,#cfe5dd);box-shadow:var(--clay);overflow:hidden;text-align:center}
.card::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:60px;border-radius:32px 32px 80px 80px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0))}
.card .rob{position:absolute;left:4px;top:12px;width:112px}
.card .qr{position:absolute;right:16px;top:14px;width:108px;height:108px;border-radius:20px;background:#fff;padding:8px;box-shadow:var(--nho)}.qr svg{width:100%;height:100%}
.card small{position:absolute;left:0;right:0;top:128px;font-size:13px;font-weight:700;color:#3a403d}
.card b{position:absolute;left:0;right:0;top:146px;font-size:44px;line-height:50px;font-weight:800;letter-spacing:5px}
.card .hh{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#3a403d;white-space:nowrap}.hh img{width:18px;height:18px}
.nho2{position:absolute;left:22px;top:336px;font-size:14px;font-weight:800;color:#3a403d}
.share{position:absolute;left:16px;right:16px;top:362px;display:grid;grid-template-columns:repeat(5,1fr);padding:14px 4px 10px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.share div{display:flex;flex-direction:column;align-items:center;gap:6px}
.share .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;box-shadow:var(--nho)}
.share .ic img{width:30px;height:30px}
.share p{height:30px;font-size:11.5px;line-height:15px;font-weight:700;text-align:center;color:#3a403d}
.zalo{background:#0068ff;color:#fff;font-size:13px;font-weight:800}
.tin{background:#34c759}.mes{background:linear-gradient(135deg,#0a7cff,#a334fa 60%,#ff5c87)}.chep{background:#e6e5e1}.khac{background:#e6e5e1}
.khac i{display:flex;gap:4px}.khac i b{width:6px;height:6px;border-radius:50%;background:#3a403d}
.gan{position:absolute;left:16px;right:16px;top:494px;display:flex;align-items:center;gap:12px;height:68px;padding:0 14px 0 12px;border-radius:24px;background:#f7f6f3;box-shadow:var(--clay);font-size:14.5px;line-height:19px;font-weight:800;color:#0a5246}
.gan .t{flex:1;min-width:0;white-space:nowrap}.gan small{display:block;font-size:12.5px;font-weight:600;color:#3a403d}
.bt{width:46px;height:46px;border-radius:23px;flex:none;display:grid;place-items:center;background:#dcebe6;box-shadow:var(--nho)}.bt img{width:28px;height:28px}
.gan svg{flex:none;width:18px;height:18px;fill:#0a5246}
.day{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:4px}
.cho{display:flex;align-items:center;justify-content:center;gap:10px;height:30px;font-size:13.5px;font-weight:700;color:#0a5246;white-space:nowrap}.cho i{width:8px;height:8px;border-radius:50%;background:#0f6b5c;box-shadow:0 0 0 4px #dcebe6}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;display:flex;align-items:center;justify-content:center;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
.lk{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#3a403d}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Ghép máy của Bảo Anh</h1><span class="giup" role="button" tabindex="0" aria-label="Cần giúp?"><img src="/assets/icon3d/dau_hoi.webp" alt="Cần giúp?"></span></div>
<div class="card"><img class="rob" src="/assets/rob/cho.webp" alt=""><div class="qr" aria-label="Mã QR ghép máy"><svg viewBox="0 0 29 29" shape-rendering="crispEdges"><path fill="#0f1312" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM22 0h7v7h-7zM23 1v5h5V1zM24 2h3v3h-3zM0 22h7v7H0zM1 23v5h5v-5zM2 24h3v3H2zM9 0h2v2H9zM12 1h3v2h-3zM16 0h2v3h-2zM9 4h3v2H9zM14 4h2v3h-2zM18 4h2v2h-2zM9 8h2v3H9zM12 9h4v2h-4zM18 8h3v2h-3zM0 9h3v2H0zM4 9h3v3H4zM23 9h2v2h-2zM26 9h3v3h-3zM1 13h3v2H1zM6 13h4v2H6zM12 13h2v4h-2zM16 12h3v3h-3zM21 13h3v2h-3zM25 14h4v2h-4zM0 17h2v3H0zM4 17h3v2H4zM9 17h2v3H9zM15 17h4v2h-4zM21 17h2v4h-2zM25 18h3v2h-3zM13 20h3v2h-3zM9 22h3v2H9zM17 21h3v3h-3zM23 22h3v2h-3zM27 22h2v4h-2zM9 26h4v3H9zM15 25h3v2h-3zM20 25h2v4h-2zM23 26h3v3h-3z"></path></svg></div><small>Mã ghép máy</small><b aria-label="4 8 2 0 1 7">482 017</b><div class="hh"><img src="/assets/icon3d/dong_ho_cat.webp" alt="">Mã dùng được 10 phút</div></div>
<p class="nho2">Gửi link sang máy của con</p>
<div class="share" aria-label="Chia sẻ link ghép máy">
<div role="button" tabindex="0"><span class="ic zalo">Zalo</span><p>Zalo</p></div>
<div role="button" tabindex="0"><span class="ic tin"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="#fff" d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.7 6.2L5 21l4-2.2c1 .3 2 .4 3 .4 5.5 0 10-3.6 10-8.1S17.5 3 12 3z"></path></svg></span><p>Tin nhắn</p></div>
<div role="button" tabindex="0"><span class="ic mes"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="#fff" d="M12 2.5C6.6 2.5 2.5 6.4 2.5 11.4c0 2.7 1.2 5 3.1 6.6V21l2.9-1.6c1.1.3 2.3.5 3.5.5 5.4 0 9.5-3.9 9.5-8.9S17.4 2.5 12 2.5zm1 11.8-2.4-2.6-4.7 2.6 5.2-5.5 2.5 2.6 4.6-2.6z"></path></svg></span><p>Messenger</p></div>
<div role="button" tabindex="0"><span class="ic chep"><img src="/assets/icon3d/lap.webp" alt=""></span><p>Sao chép link</p></div>
<div role="button" tabindex="0"><span class="ic khac"><i><b></b><b></b><b></b></i></span><p>Khác…</p></div>
</div>
<div class="gan" role="button" tabindex="0"><span class="bt"><img src="/assets/icon3d/camera.webp" alt=""></span><span class="t">Máy của con ở ngay đây?<small>Mở camera máy con, quét QR ở trên</small></span><svg viewBox="0 0 256 256"><path d="M184.49,136.49l-80,80a12,12,0,0,1-17-17L159,128,87.51,56.49a12,12,0,0,1,17-17l80,80A12,12,0,0,1,184.49,136.49Z"></path></svg></div>
<div class="day">
<p class="cho" role="status"><i></i>Gửi xong, máy con mở link là tự ghép</p>
<button class="nut" type="button"><span>Đã gửi, chờ máy của con</span></button>
<div class="lk" role="button" tabindex="0">Để sau</div>
</div>
</div></body></html>
