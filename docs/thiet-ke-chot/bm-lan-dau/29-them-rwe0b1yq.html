<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:8px;top:44px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.hoi{min-height:44px;padding:0 10px;display:flex;align-items:center;font-size:14px;font-weight:700;color:#0a5246}
.buoc{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.buoc i{width:28px;height:6px;border-radius:3px;background:#dddcd8}.buoc i.on{background:#0f6b5c}
.dau{position:absolute;left:16px;right:16px;top:98px;height:92px;display:flex;align-items:center;gap:12px;padding:0 18px 0 10px;border-radius:30px;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay);overflow:hidden}
.dau img{width:70px;height:70px;object-fit:contain;flex:none}
.dau h1{font-size:23px;line-height:28px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.dau p{margin-top:2px;font-size:13.5px;line-height:18px;font-weight:600;color:#3a403d;white-space:nowrap}
.nd{position:absolute;left:16px;right:16px;top:222px}
.o6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.o6 span{height:62px;border-radius:18px;background:#e6e5e1;box-shadow:var(--lom);display:grid;place-items:center;font-size:26px;font-weight:800}
.o6 span.dang{background:#f7f6f3;box-shadow:0 0 0 2.5px #0f6b5c,var(--clay)}
.lai{display:flex;justify-content:center;align-items:center;gap:6px;min-height:44px;margin-top:12px;font-size:14px;font-weight:600;color:#565c59}
.lai b{color:#0a5246;font-weight:800}
.day{position:absolute;left:16px;right:16px;bottom:22px}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
</style></head>
<body><div class="app">
<div class="top">
<div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-yywse9ag"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div>
<div class="hoi" role="button" tabindex="0" data-toi="bm2-ho-tro">Cần giúp?</div>
</div>
<div class="buoc" aria-label="Bước 2 trên 3: Nhập mã"><i class="on"></i><i class="on"></i><i></i></div>
<div class="dau"><img src="/assets/rob/so-tay.webp" alt=""><div><h1>Nhập mã 6 số</h1><p>Mã đã gửi tới 0912 345 678</p></div></div>
<div class="nd">
<div class="o6" aria-label="Nhập mã 6 số"><span>4</span><span>8</span><span>2</span><span class="dang"></span><span></span><span></span></div>
<p class="lai">Chưa nhận được? <b>Gửi lại sau 0:42</b></p>
</div>
<div class="day"><button class="nut" type="button" data-toi="them-6aomy24b"><span>Xác nhận mã</span></button></div>
</div></body></html>
