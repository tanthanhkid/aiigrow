.san .rob{position:absolute;right:0;bottom:-16px;width:160px;height:auto;z-index:2}
.bong{position:absolute;left:18px;top:30px;max-width:170px;padding:11px 16px;border-radius:22px;background:#fff;font-size:15px;line-height:20px;font-weight:700;z-index:3;box-shadow:0 6px 10px -6px rgba(28,32,30,.26),inset 0 -6px 10px -5px rgba(40,44,42,.12)}

.nd{position:absolute;left:16px;right:16px;top:378px}
.nhan{margin:0 6px 8px;font-size:14px;font-weight:700}
.nhan.sau{margin-top:18px}
.lom{display:flex;align-items:center;gap:8px;height:58px;padding:0 7px 0 20px;border-radius:29px;background:#e6e5e1;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 20px Inter,sans-serif;color:#0f1312;letter-spacing:4px}
.mat{flex:none;width:44px;height:44px;display:grid;place-items:center}.mat svg{width:22px;height:22px;fill:#565c59}
.goi{margin:6px 0 0 6px;font-size:12.5px;font-weight:700;color:#565c59}
.goi.ok{color:#0a5246}
.day{position:absolute;left:16px;right:16px;bottom:22px}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
