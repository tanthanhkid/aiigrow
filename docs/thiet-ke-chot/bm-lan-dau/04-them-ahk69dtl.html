<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.nd{position:absolute;left:16px;right:16px;top:96px;z-index:2}
.hero{position:relative;height:128px;border-radius:30px;background:#e3efeb;box-shadow:var(--clay)}
.hero::before{content:"";position:absolute;inset:0;border-radius:30px;background:radial-gradient(60% 34% at 50% 14%,rgba(255,255,255,.95),rgba(255,255,255,0))}
.bong{position:absolute;left:14px;top:24px;width:226px;background:#fff;border-radius:24px;padding:12px 16px;z-index:3;box-shadow:0 6px 10px -6px rgba(28,32,30,.26),inset 0 -6px 10px -5px rgba(40,44,42,.14)}
.bong::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-8px;width:16px;height:16px;background:#fff;border-radius:3px;transform:rotate(45deg)}
.bong h1{font-size:18px;line-height:23px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.bong p{margin-top:3px;font-size:13px;line-height:18px;color:#3a403d;white-space:nowrap}
.rob{position:absolute;right:0;bottom:-10px;width:104px;height:auto;z-index:2}
.nhan{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px 6px;font-size:14px;font-weight:700;white-space:nowrap}
.nhan.dau{margin-top:26px}
.nhan em{font-style:normal;font-size:12px;font-weight:600;color:#565c59;margin-right:6px}
.lom{display:flex;align-items:center;height:58px;padding:0 6px 0 20px;border-radius:29px;background:#e6e5e1;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;height:52px;border:0;outline:0;background:transparent;font:700 20px Inter,sans-serif;letter-spacing:.4px;color:#0f1312}
.lom input.mk{letter-spacing:4px}
.day{position:absolute;left:16px;right:16px;bottom:18px;z-index:3}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px Inter,sans-serif;white-space:nowrap;color:#fff;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
.nut.phu{color:#0f1312;background:#f7f6f3;box-shadow:var(--clay)}
.nut.phu::before{left:10px;right:10px;height:40%;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
.man{position:absolute;inset:0;z-index:5;background:rgba(15,19,18,.58)}
.bang{position:absolute;left:0;right:0;bottom:0;height:430px;z-index:6;border-radius:36px 36px 0 0;background:#f4f4f2;box-shadow:0 -14px 30px -12px rgba(15,19,18,.35),inset 0 1.5px 0 #fff}
.bang::before{content:"";position:absolute;left:18px;right:18px;top:3px;height:70px;border-radius:34px 34px 80px 80px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
.keo{position:absolute;left:50%;top:10px;margin-left:-22px;width:44px;height:5px;border-radius:5px;background:#c9ccc9}
.canh{position:absolute;left:16px;right:16px;top:26px;height:132px;border-radius:30px;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay);overflow:hidden}
.canh .rb{position:absolute;right:4px;bottom:-26px;width:142px;height:auto}
.so{position:absolute;left:18px;top:42px;padding:10px 16px;border-radius:20px;background:#f7f6f3;box-shadow:var(--clay);font-size:20px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chu{position:absolute;left:16px;right:16px;top:174px;text-align:center}
.chu h2{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px}
.chu p{margin-top:4px;font-size:14px;line-height:20px;color:#3a403d;white-space:nowrap}
.hd{position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:10px}
.lk{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0a5246;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="nd">
<div class="hero"><div class="bong"><h1>Tạo tài khoản Ba Mẹ</h1><p>Số điện thoại và mật khẩu là xong.</p></div><img class="rob" src="/assets/rob/so-tay.webp" alt=""></div>
<div class="nhan dau">Số điện thoại</div>
<div class="lom"><input type="tel" inputmode="numeric" aria-label="Số điện thoại" value="0912 *** 678"></div>
<div class="nhan">Mật khẩu <em>Ít nhất 8 ký tự</em></div>
<div class="lom"><input class="mk" type="password" aria-label="Mật khẩu" value="aiigrow26"></div>
</div>
<div class="day"><button class="nut" type="button"><span>Nhận mã xác thực</span></button></div>
<div class="man" data-toi="bm1-dang-ky" aria-label="Đóng bảng"></div>
<div class="bang" role="dialog" aria-label="Số đã có tài khoản">
<div class="keo"></div>
<div class="canh"><div class="so">0912 *** 678</div><img class="rb" src="/assets/rob/chi.webp" alt=""></div>
<div class="chu"><h2>Số này đã có tài khoản</h2><p>Đăng nhập để vào lại nhà mình nhé.</p></div>
<div class="hd">
<button class="nut" type="button" data-toi="bm1-dang-nhap"><span>Đăng nhập bằng số này</span></button>
<button class="nut phu" type="button" data-toi="them-2g3zpiie"><span>Quên mật khẩu</span></button>
<div class="lk" role="button" tabindex="0" data-toi="bm1-dang-ky">Dùng số khác</div>
</div>
</div>
</div></body></html>
