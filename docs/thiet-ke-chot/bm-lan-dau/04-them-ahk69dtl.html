<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--clay:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--nho:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:var(--ink)}
.nd{position:absolute;left:16px;right:16px;top:96px;z-index:2}
.hero{position:relative;height:128px;border-radius:30px;background:var(--n);box-shadow:var(--clay)}
.bong{position:absolute;left:14px;top:24px;width:226px;background:var(--n);border-radius:24px;padding:12px 16px;z-index:3;box-shadow:var(--nho)}
.bong h1{font-size:18px;line-height:23px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.bong p{margin-top:3px;font-size:13px;line-height:18px;color:#5b5248;white-space:nowrap}
.rob{position:absolute;right:0;bottom:-10px;width:104px;height:auto;z-index:2}
.nhan{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px 6px;font-size:14px;font-weight:700;white-space:nowrap}
.nhan.dau{margin-top:26px}
.nhan em{font-style:normal;font-size:12px;font-weight:600;color:#7c7166;margin-right:6px}
.lom{display:flex;align-items:center;height:58px;padding:0 6px 0 20px;border-radius:29px;background:#E3D9CB;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;height:52px;border:0;outline:0;background:transparent;font:700 20px 'Be Vietnam Pro',sans-serif;letter-spacing:.4px;color:var(--ink)}
.lom input.mk{letter-spacing:4px}
.day{position:absolute;left:16px;right:16px;bottom:18px;z-index:3}
.nut{width:100%;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;white-space:nowrap;color:var(--ink);background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nut.phu{background:var(--n);box-shadow:var(--nho)}
.man{position:absolute;inset:0;z-index:5;background:rgba(10,22,41,.5)}
.bang{position:absolute;left:0;right:0;bottom:0;height:430px;z-index:6;border-radius:36px 36px 0 0;background:var(--n);box-shadow:0 -14px 30px -12px rgba(10,22,41,.35),inset 0 1px 0 var(--hi)}
.keo{position:absolute;left:50%;top:10px;margin-left:-22px;width:44px;height:5px;border-radius:5px;background:#cfc3b3}
.canh{position:absolute;left:16px;right:16px;top:26px;height:132px;border-radius:30px;background:var(--n);box-shadow:var(--clay);overflow:hidden}
.canh .rb{position:absolute;right:4px;bottom:-26px;width:142px;height:auto}
.so{position:absolute;left:18px;top:42px;padding:10px 16px;border-radius:20px;background:var(--n);box-shadow:var(--nho);font-size:20px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chu{position:absolute;left:16px;right:16px;top:174px;text-align:center}
.chu h2{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px}
.chu p{margin-top:4px;font-size:14px;line-height:20px;color:#5b5248;white-space:nowrap}
.hd{position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:10px}
.lk{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="nd">
<div class="hero"><div class="bong"><h1>Tạo tài khoản Ba Mẹ</h1><p>Số điện thoại và mật khẩu là xong.</p></div><img class="rob" src="/assets/rob/so-tay.webp" alt=""></div>
<div class="nhan dau">Số điện thoại</div>
<div class="lom"><input type="tel" inputmode="numeric" aria-label="Số điện thoại" value="0912 *** 678"></div>
<div class="nhan">Mật khẩu <em>Ít nhất 8 ký tự</em></div>
<div class="lom"><input class="mk" type="password" aria-label="Mật khẩu" value="aiigrow26"></div>
</div>
<div class="day"><button class="nut" type="button"><span>Nhận mã xác thực</span></button></div>
<div class="man" data-toi="bm1-dang-ky" aria-label="Đóng bảng"></div>
<div class="bang" role="dialog" aria-label="Số đã có tài khoản">
<div class="keo"></div>
<div class="canh"><div class="so">0912 *** 678</div><img class="rb" src="/assets/rob/chi.webp" alt=""></div>
<div class="chu"><h2>Số này đã có tài khoản</h2><p>Đăng nhập để vào lại nhà mình nhé.</p></div>
<div class="hd">
<button class="nut" type="button" data-toi="bm1-dang-nhap"><span>Đăng nhập bằng số này</span></button>
<button class="nut phu" type="button" data-toi="them-2g3zpiie"><span>Quên mật khẩu</span></button>
<div class="lk" role="button" tabindex="0" data-toi="bm1-dang-ky">Dùng số khác</div>
</div>
</div>
</div>
</body></html>
