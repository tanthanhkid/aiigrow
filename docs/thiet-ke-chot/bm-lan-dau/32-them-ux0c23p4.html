<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.san{position:absolute;left:16px;right:16px;top:96px;height:380px;border-radius:36px;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay);overflow:hidden}
.san::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:70px;border-radius:34px 34px 80px 80px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0));z-index:1}
.san::after{content:"";position:absolute;left:50%;bottom:18px;width:220px;height:26px;margin-left:-110px;border-radius:50%;background:radial-gradient(rgba(28,32,30,.18),rgba(28,32,30,0) 70%)}
.san .rob{position:absolute;left:50%;bottom:4px;transform:translateX(-46%);width:230px;height:auto;z-index:2}
.moi{position:absolute;left:14px;right:14px;top:16px;z-index:3;display:flex;align-items:center;gap:10px;padding:12px;border-radius:24px;background:#fff;box-shadow:0 10px 16px -10px rgba(28,32,30,.3),inset 0 -6px 10px -5px rgba(40,44,42,.1)}
.moi .av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800;background:#0f6b5c;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.moi p{flex:1;min-width:0}.moi b{display:block;font-size:15.5px;line-height:20px;font-weight:800}.moi small{display:block;margin-top:2px;font-size:13px;line-height:17px;font-weight:600;color:#565c59}
.moi .con{display:flex;flex:none}.moi .con i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#fff;box-shadow:0 0 0 2.5px #fff}.moi .con i.b{background:#f5a957}.moi .con i.m{margin-left:-8px;background:#5b8fd6}
.chu{position:absolute;left:16px;right:16px;top:498px;text-align:center}
.chu h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.chu p{margin-top:6px;font-size:15px;line-height:21px;color:#3a403d}
.day{position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:30px;border:0;font:800 17px Inter,sans-serif;white-space:nowrap}
.nut.chinh{color:#fff;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut.chinh::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut .g{position:relative;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}
.nut b,.nut svg{position:relative}
.hai{display:flex;gap:10px}
.nut.phu{flex:1;min-width:0;color:#0f1312;background:#f7f6f3;box-shadow:var(--clay);font-size:16px}
.nut.phu::before{content:"";position:absolute;left:10px;right:10px;top:3px;height:40%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0))}
.ghi{min-height:32px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#565c59;white-space:nowrap}
.ghi b{margin:0 3px;color:#0a5246;font-weight:800}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-welcome"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="san"><div class="moi"><span class="av">L</span><p><b>Mẹ Lan mời bạn vào nhà</b><small>Cùng trông Bảo Anh, Bảo Minh</small></p><span class="con"><i class="b">B</i><i class="m">M</i></span></div><img class="rob" src="/assets/rob/chi.webp" alt="Rob chỉ lời mời"></div>
<div class="chu"><h1>Vào nhà cùng Mẹ Lan</h1><p>Chọn một cách để tạo tài khoản, chưa tới 1 phút.</p></div>
<div class="day">
<button class="nut chinh" type="button" data-toi="bm1-moi" aria-label="Tiếp tục với Google"><span class="g"><svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg></span><b>Tiếp tục với Google</b></button>
<div class="hai">
<button class="nut phu" type="button" data-toi="bm1-moi" aria-label="Tiếp tục với Facebook"><svg viewBox="0 0 24 24" width="22" height="22" fill="#1877f2"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.54-4.690 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"></path></svg><b>Facebook</b></button>
<button class="nut phu" type="button" data-toi="them-0zrwe8yz" aria-label="Đăng ký bằng số điện thoại"><svg viewBox="0 0 256 256" fill="#0f1312" width="22" height="22"><path d="M176,16H80A24,24,0,0,0,56,40V216a24,24,0,0,0,24,24h96a24,24,0,0,0,24-24V40A24,24,0,0,0,176,16ZM80,32h96a8,8,0,0,1,8,8v8H72V40A8,8,0,0,1,80,32Zm96,192H80a8,8,0,0,1-8-8v-8H184v8A8,8,0,0,1,176,224Z"></path></svg><b>Số điện thoại</b></button>
</div>
<p class="ghi">Tiếp tục là đồng ý<b>Điều khoản</b>và<b>Quyền riêng tư</b></p>
</div>
</div></body></html>
