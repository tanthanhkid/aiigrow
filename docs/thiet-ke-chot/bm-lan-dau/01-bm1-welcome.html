<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Fraunces:wght@700&amp;display=swap" rel="stylesheet"><style>:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:390px;height:844px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:var(--n)}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;padding:6px 4px 24px;display:flex;background:var(--n);box-shadow:0 -6px 12px -6px var(--lo);z-index:4}
.tab div{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:var(--ink);font-weight:700}.tab .on svg{background:var(--n);box-shadow:var(--sunk)}

.dt{position:relative;width:390px;height:844px;overflow:hidden;background:var(--n)}
.sb{position:absolute;left:0;right:0;top:0;height:44px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;z-index:2;font-size:16px;font-weight:700;color:var(--ink)}
.bg{position:absolute;left:0;top:0;width:390px;height:844px;object-fit:cover}
.mark{position:absolute;left:0;right:0;top:440px;text-align:center}
.mark b{display:block;font:700 56px/60px 'Fraunces',Georgia,serif;letter-spacing:-1px;color:var(--ink)}
.mark b span{color:#8a6a2b}
.mark p{margin-top:8px;font-size:18px;font-weight:400;color:var(--ink2)}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:6px;z-index:2}
.nut{position:relative;overflow:hidden;width:100%;min-height:58px;border:0;border-radius:28px;font:800 17px 'Be Vietnam Pro',sans-serif;white-space:nowrap;color:#FFFBF5;background:radial-gradient(60% 40% at 50% 105%,rgba(244,199,106,.22),rgba(0,0,0,0)),linear-gradient(#0A1629,#0A1629);box-shadow:4px 4px 10px rgba(120,98,70,.32),-4px -4px 10px #FFFBF5,inset 0 0 0 1px rgba(244,199,106,.35)}
.nut::before{content:"";position:absolute;inset:0;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 24%,rgba(255,255,255,0) 26%)}
.hang{display:grid;grid-template-columns:1fr 20px 1fr;align-items:center}
.hang .cham{justify-self:center;width:4px;height:4px;border-radius:4px;background:#b9ad9e}
.lk{font:800 14px 'Be Vietnam Pro';color:#0A1629;display:flex;align-items:center;min-height:44px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.lk.trai{justify-content:flex-end}.lk.phai{justify-content:flex-start}
</style></head>
