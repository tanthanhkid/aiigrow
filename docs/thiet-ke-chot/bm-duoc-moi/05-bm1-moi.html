<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.12),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',Inter,system-ui,sans-serif;color:#0A1629}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.san{position:absolute;left:16px;right:16px;top:60px;height:320px;border-radius:36px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629);box-shadow:0 18px 26px -14px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 -10px 16px -8px rgba(0,0,0,.35);overflow:hidden}
.san::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:60px;border-radius:34px 34px 80px 80px;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0))}
.nha{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:center;align-items:center}
.nha span{width:54px;height:54px;margin:0 -5px;border-radius:50%;display:grid;place-items:center;border:4px solid #14264a;font-size:21px;font-weight:800;color:#fff}
.l{background:#e98aa6}.a{background:#E8600C}.m{background:#1F48FF}.n{background:#9b2fc0}.k{background:#0f8a68}
.nha .ban{width:62px;height:62px;margin-left:8px;background:#F4C76A;color:#0A1629;font-size:24px;box-shadow:0 0 0 4px #14264a,0 0 0 7px #fff,0 10px 16px -8px rgba(0,0,0,.6)}
.rob{position:absolute;left:50%;bottom:-40px;width:190px;margin-left:-95px;height:auto}
.chu{position:absolute;left:16px;right:16px;top:400px;text-align:center}
.chu h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.chu p{margin-top:6px;font-size:15px;line-height:21px;color:#5a5a5a}
.lam{position:absolute;left:16px;right:16px;top:486px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lam div{height:112px;border-radius:24px;background:#fff;box-shadow:var(--clay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:800;line-height:18px;text-align:center;color:#0A1629}
.lam .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom)}
.lam img{width:30px;height:30px}
.day{position:absolute;left:16px;right:16px;bottom:22px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:56px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:15px;font-weight:800;color:#5a5a5a}
</style></head>
<body><div class="app">
<div class="san"><div class="nha"><span class="l">L</span><span class="a">A</span><span class="m">M</span><span class="n">N</span><span class="k">K</span><span class="ban">T</span></div><img class="rob" src="/assets/rob/chi.webp" alt=""></div>
<div class="chu"><h1>Mẹ Lan mời bạn vào nhà</h1><p>Cùng trông 4 bé nhà mình</p></div>
<div class="lam">
<div><span class="ic"><img src="/assets/icon3d/dongho.webp" alt=""></span>Xem con<br>dùng máy</div>
<div><span class="ic"><img src="/assets/icon3d/chuong.webp" alt=""></span>Duyệt khi<br>con xin</div>
<div><span class="ic"><img src="/assets/icon3d/khoa.webp" alt=""></span>Khoá máy<br>khi cần</div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0">Vào nhà cùng Mẹ Lan</span>
<span class="lk" role="button" tabindex="0">Không phải tôi</span>
</div>
</div></body></html>
