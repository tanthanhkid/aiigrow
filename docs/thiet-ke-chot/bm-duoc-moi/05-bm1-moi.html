<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:24px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink);font-size:22px}
.kim{background:var(--kim);color:#0A1629;font-weight:700;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;font-size:16px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutp{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.nutd{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#b42318;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.chev{flex:none;width:18px;height:18px;fill:var(--ink)}
.card{background:var(--n);box-shadow:var(--shL);border-radius:28px}
.sv{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.san{position:absolute;left:16px;right:16px;top:60px;height:320px;border-radius:36px;background:var(--ink);box-shadow:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);overflow:hidden}
.nha{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:center;align-items:center}
.nha span{width:54px;height:54px;margin:0 -5px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--ink);background:var(--n);font-size:21px;font-weight:800;color:var(--ink)}
.nha .ban{width:62px;height:62px;margin-left:8px;background:var(--kim);color:#0A1629;font-size:24px;box-shadow:0 0 0 3px var(--ink),0 0 0 5px #D9AE57}
.rob{position:absolute;left:50%;bottom:-40px;width:190px;margin-left:-95px;height:auto}
.chu{position:absolute;left:16px;right:16px;top:400px;text-align:center}
.chu h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.chu p{margin-top:6px;font-size:15px;line-height:21px;color:var(--ink2)}
.lam{position:absolute;left:16px;right:16px;top:486px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lam div{height:112px;border-radius:24px;background:var(--n);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;line-height:18px;text-align:center;color:#0A1629}
.lam .ic{width:48px;height:48px;font-size:26px}
.lam .ic svg{width:26px;height:26px}
.day{position:absolute;left:16px;right:16px;bottom:22px;display:flex;flex-direction:column;gap:6px}
.nut{height:56px;font-size:17px}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:15px;font-weight:700;color:#8a6a2b}
</style></head>
<body><div class="app">
<div class="san"><div class="nha"><span class="l">L</span><span class="a">A</span><span class="m">M</span><span class="n">N</span><span class="k">K</span><span class="ban">T</span></div><img class="rob" src="/assets/rob/chi.webp" alt=""></div>
<div class="chu"><h1>Mẹ Lan mời bạn vào nhà</h1><p>Cùng trông 4 bé nhà mình</p></div>
<div class="lam">
<div><span class="ic"><svg viewBox="0 0 24 24" class="sv"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg></span>Xem con<br>dùng máy</div>
<div><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></span>Duyệt khi<br>con xin</div>
<div><span class="ic"><svg viewBox="0 0 24 24" class="sv"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>Khoá máy<br>khi cần</div>
</div>
<div class="day">
<span class="nutk nut" role="button" tabindex="0">Vào nhà cùng Mẹ Lan</span>
<span class="lk" role="button" tabindex="0">Không phải tôi</span>
</div>
</div>
</body></html>
