<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(10,22,41,.26),0 4px 8px -5px rgba(10,22,41,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(10,22,41,.12);--lom:inset 0 5px 10px rgba(10,22,41,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:360px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0A1629}
.nd{position:absolute;left:16px;right:16px;top:104px;z-index:2;text-align:center}
.bt{width:96px;height:96px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--clay)}.bt img{width:56px;height:56px}
.h{margin-top:18px;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.5px}
.s{margin-top:6px;font-size:15px;line-height:21px;color:#3a3a3a}.s b{color:#0A1629}
.ma{display:flex;gap:8px;justify-content:center;margin-top:28px}
.ma i{width:48px;height:60px;border-radius:18px;background:#ebe2d7;box-shadow:var(--lom);display:grid;place-items:center;font:800 26px 'Be Vietnam Pro',sans-serif;font-style:normal}
.ma i.dang{background:#F2EBE3;box-shadow:0 0 0 3px #0A1629,var(--clay)}
.lai{display:inline-flex;align-items:center;gap:8px;margin-top:22px;min-height:44px;font-size:14px;font-weight:600;color:#5a5a5a}
.lai img{width:20px;height:20px}
.day{position:absolute;left:16px;right:16px;bottom:22px;z-index:3}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 14px 20px -10px rgba(10,22,41,.55),0 4px 8px -4px rgba(10,22,41,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--kimsh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}

html,body,.app{background:var(--n)!important}
.app::before{display:none!important}
body{color:#0A1629}
.hero{background:var(--n)!important;box-shadow:var(--shL)!important}
.hero::before{display:none!important}
.bong{background:var(--n)!important;box-shadow:var(--sh)!important}
.bong::after{background:var(--n)!important}
.bong p{color:#5b5248!important}
.nhan em{color:#7c7166!important}
.lom{background:var(--n)!important;box-shadow:var(--sunk)!important}
.lom input{color:#0A1629}
.mat svg{fill:#7c7166!important}
.nut{background:var(--kim)!important;color:#0A1629!important;font-weight:700!important;border-radius:16px!important;box-shadow:var(--kimsh)!important}
.nut::before{display:none!important}
.nut.phu{background:var(--n)!important;box-shadow:var(--sh)!important}
.ghi{color:#7c7166!important}
.lk{color:#8a6a2b!important;font-weight:600!important}

.bt{background:#0A1629!important;color:#F4C76A;box-shadow:var(--shL)!important}
.s{color:#5b5248!important}
.ma i{background:var(--n)!important;box-shadow:var(--sunk)!important}
.ma i.dang{background:var(--n)!important;box-shadow:0 0 0 2.5px #0A1629,var(--sunk)!important}
.lai{color:#5b5248!important}.lai svg{color:#0A1629}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-0zrwe8yz"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="nd">
<div class="bt"><svg class="sv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></div>
<h1 class="h">Nhập mã xác thực</h1>
<p class="s">Mã 6 số đã gửi tới <b>0987 654 321</b></p>
<div class="ma"><i>4</i><i>8</i><i>2</i><i>0</i><i class="dang"></i><i></i></div>
<div class="lai"><svg class="sv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M7 3h10M7 21h10M8 3c0 5 4 5 4 9s-4 4-4 9M16 3c0 5-4 5-4 9s4 4 4 9"></path></svg>Gửi lại mã sau 0:42</div>
</div>
<div class="day"><button class="nut" type="button" data-toi="bm1-moi"><span>Xác thực, vào nhà Mẹ Lan</span></button></div>
</div>
</body></html>
