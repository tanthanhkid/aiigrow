<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#7d8783,#5f6865)}
.mo{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfcec9}
.hinh{position:relative;width:104px;height:104px;margin:0 auto;border-radius:34px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay)}
.hinh img{width:64px;height:64px}
.hinh .tick{position:absolute;right:-8px;bottom:-6px;width:42px;height:42px}
h1{margin-top:16px;text-align:center;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:6px;text-align:center;font-size:15px;font-weight:600;color:#3a403d;line-height:21px}
.the{margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 10px;border-radius:24px;background:#f7f6f3;box-shadow:var(--clay)}
.ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:28px;height:28px}
.the p{flex:1;min-width:0;font-size:15.5px;font-weight:800}
.mang{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;font-weight:700;color:#0a5246}.mang i{width:8px;height:8px;border-radius:4px;background:#1aa37a;box-shadow:0 0 0 3px #cdeee2}
.day{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.thoi{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:700;color:#3a403d}
</style></head>
<body><div class="app">
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/laptop.webp" alt=""><img class="tick" src="/assets/icon3d/tick.webp" alt=""></div>
<h1>Bảo Anh đã mở máy bằng mã</h1>
<p class="phu-de">lúc 19:40 · 30 phút</p>
<div class="the"><span class="ic"><img src="/assets/icon3d/khoa.webp" alt=""></span><p>Laptop của Bảo Anh<span class="mang"><i></i>Có mạng lại · 19:52</span></p></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-may-m1"><img src="/assets/icon3d/laptop.webp" alt="">Xem máy</span>
<span class="thoi" role="button" tabindex="0" data-toi="bm2-trang-chu">Đóng</span>
</div>
</div>
</div></body></html>
