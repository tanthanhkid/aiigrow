<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#e3efeb,#f4f4f2 55%)}
.rob{position:absolute;left:50%;top:80px;width:160px;margin-left:-80px;height:auto}
h1{position:absolute;left:20px;right:20px;top:316px;text-align:center;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.phu{position:absolute;left:28px;right:28px;top:394px;text-align:center;font-size:15px;line-height:21px;font-weight:600;color:#3a403d}
.the{position:absolute;left:16px;right:16px;top:462px;padding:12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;min-height:52px}
.dong+.dong{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:26px;height:26px}
.dong p{flex:1;font-size:14.5px;font-weight:700;line-height:20px}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<img class="rob" src="/assets/rob/chi.webp" alt="">
<h1>Đã nhắn Bảo Anh<br>làm lại</h1>
<p class="phu">Con thấy lời nhắn ngay trên máy. Nộp lại xong, Ba Mẹ nhận thông báo để duyệt.</p>
<div class="the">
<div class="dong"><span class="ic"><img src="/assets/icon3d/tin.webp" alt=""></span><p>Lời nhắn đã tới máy của Bảo Anh</p></div>
<div class="dong"><span class="ic"><img src="/assets/icon3d/sao.webp" alt=""></span><p>Chưa cộng sao · ví vẫn 30 sao</p></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-nl1nwszs">Xem việc còn chờ duyệt</span>
<span class="lk" role="button" tabindex="0" data-toi="bm2-trang-chu">Về Trang chủ</span>
</div>
</div></body></html>
