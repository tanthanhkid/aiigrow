<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#fdf1d3,#f4f4f2 340px)}
.nen{position:absolute;left:16px;right:16px;top:100px;height:260px;border-radius:30px;background:linear-gradient(135deg,#d6e9e2,#eef4f1)}
.nen-t{position:absolute;left:20px;top:56px;font-size:22px;font-weight:800}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.5);z-index:2}
.bang{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 16px 26px;border-radius:32px 32px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:40px;height:5px;border-radius:3px;background:#d4d3cf;margin:0 auto 14px}
.dau{display:flex;align-items:center;gap:12px}
.dau img{flex:none;width:56px;height:auto}
.dau h2{font-size:20px;line-height:26px;font-weight:800;letter-spacing:-.3px}
.dau h2 small{display:block;font-size:13px;line-height:18px;font-weight:600;color:#565c59;letter-spacing:0}
.nhan{margin:18px 6px 8px;font-size:14px;font-weight:800;color:#3a403d}
.chip{display:flex;flex-wrap:wrap;gap:8px}
.chip span{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;background:#f7f6f3;box-shadow:var(--clay);font-size:15px;font-weight:700;white-space:nowrap}
.chip span.on{background:#0f6b5c;color:#fff;box-shadow:0 8px 14px -8px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35)}
.lom{display:flex;align-items:center;min-height:58px;padding:10px 20px;border-radius:24px;background:#e6e5e1;box-shadow:var(--lom);font-size:16px;font-weight:700;line-height:22px}
.ghi{display:flex;align-items:center;gap:8px;margin:12px 6px 0;font-size:13px;font-weight:700;color:#6e4300}
.ghi img{width:20px;height:20px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;margin-top:16px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:4px;font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body data-lk-sua=""><div class="app">
<p class="nen-t">Đọc sách 20 phút</p><div class="nen"></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-d40e3495"></div>
<div class="bang">
<div class="keo"></div>
<div class="dau"><img src="/assets/rob/chi.webp" alt=""><h2>Nhờ Bảo Anh đọc lại<small>Con chưa nhận sao, nộp ghi âm mới thì Ba Mẹ duyệt tiếp</small></h2></div>
<p class="nhan">Vì sao?</p>
<div class="chip"><span class="on" role="button" tabindex="0">Nghe chưa rõ</span><span role="button" tabindex="0">Chưa đủ 20 phút</span><span role="button" tabindex="0">Nhầm bài</span></div>
<p class="nhan">Nhắn con</p>
<div class="lom">Con đọc to hơn một chút nhé!</div>
<p class="ghi"><img src="/assets/icon3d/tim.webp" alt="">Nói nhẹ nhàng để con vui vẻ làm lại</p>
<span class="nut" role="button" tabindex="0" data-toi="them-4u3doee9"><img src="/assets/icon3d/gui.webp" alt="">Gửi lời nhắn cho Bảo Anh</span>
<span class="lk" role="button" tabindex="0" data-toi="them-d40e3495">Thôi, quay lại nghe ghi âm</span>
</div>
</div></body></html>
