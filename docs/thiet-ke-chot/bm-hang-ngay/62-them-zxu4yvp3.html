<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#dcebe6,#f4f4f2)}
.top{position:absolute;left:8px;top:44px;z-index:4}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.cuon{position:absolute;left:0;right:0;top:92px;bottom:0;overflow-y:auto;padding:0 16px 30px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.dau{display:flex;align-items:center;gap:8px}
.dau img{width:120px;height:auto}
.dau h1{font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.4px}
.ba{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.ba span{height:112px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#f7f6f3;box-shadow:var(--clay);font-size:14px;font-weight:800;text-align:center;line-height:18px}
.ba img{width:40px;height:40px}
.muc{margin:22px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.ds{padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;min-height:58px;font-size:15px;font-weight:700}
.dong+.dong{border-top:1.5px solid #ecebe7}
.dong p{flex:1}
.mui{flex:none;width:18px;height:18px;fill:#8a908d}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="cuon">
<div class="dau"><img src="/assets/rob/so-tay.webp" alt=""><h1>Ba Mẹ cần<br>giúp gì?</h1></div>
<div class="ba" style="grid-template-columns:1fr">
<span role="button" tabindex="0" data-toi="them-dmdjjhh1" style="height:84px;flex-direction:row;gap:12px;font-size:17px"><img src="/assets/icon3d/tin.webp" alt="">Nhắn tin AiiGrow</span>
</div>
<p class="muc">Ba Mẹ hay hỏi</p>
<div class="ds">
<div class="dong" role="button" tabindex="0" data-toi="bm2-may-m2"><p>Máy con báo «chưa bảo vệ» thì làm sao?</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="dong" role="button" tabindex="0" data-toi="them-1akngbxb"><p>Sao đổi ra phút chơi thế nào?</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="dong" role="button" tabindex="0" data-toi="them-5hzkl6p5"><p>Mời ông bà cùng trông con</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
<div class="dong" role="button" tabindex="0" data-toi="bm2-may-ds"><p>Ghép thêm máy cho con</p><svg class="mui" viewBox="0 0 256 256"><path d="M87.51,56.49a12,12,0,0,1,17-17l80,80a12,12,0,0,1,0,17l-80,80a12,12,0,0,1-17-17L159,128Z"></path></svg></div>
</div>
</div>
</div></body></html>
