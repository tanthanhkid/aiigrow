<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:8px;top:44px;height:48px;display:flex;align-items:center}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
h1{position:absolute;left:20px;right:20px;top:100px;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.5px}
.phu{position:absolute;left:20px;top:136px;font-size:15px;color:#3a403d}
.b{position:absolute;left:16px;right:16px;height:132px;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:30px;background:#f7f6f3;box-shadow:var(--clay)}
.hinh{position:relative;flex:none;width:108px;height:108px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1)}
.hinh img{width:68px;height:68px}
.so{position:absolute;left:-4px;top:-4px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0f6b5c;color:#fff;font-size:16px;font-weight:800;box-shadow:0 4px 8px -3px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35)}
.b p{font-size:17px;line-height:23px;font-weight:800}
.b p small{display:block;margin-top:4px;font-size:13px;line-height:18px;font-weight:600;color:#565c59}
.day{position:absolute;left:16px;right:16px;bottom:22px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-may-m2"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<h1>Sửa trên iPad của con</h1>
<p class="phu">Cầm iPad lên, làm theo 3 bước:</p>
<div class="b" style="top:176px"><div class="hinh"><img src="/assets/icon3d/tablet.webp" alt=""><span class="so">1</span></div><p>Mở «Cài đặt»<small>Biểu tượng bánh răng<br>màu xám trên iPad</small></p></div>
<div class="b" style="top:324px"><div class="hinh"><img src="/assets/icon3d/dongho.webp" alt=""><span class="so">2</span></div><p>Chạm «Thời gian<br>sử dụng»<small>Chọn tên Bảo Anh</small></p></div>
<div class="b" style="top:472px"><div class="hinh"><img src="/assets/icon3d/khoa.webp" alt=""><span class="so">3</span></div><p>Bật lại, nhập<br>mật mã<small>Mật mã Thời gian sử dụng<br>(Ba Mẹ đặt lúc cài)</small></p></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-may-ds">Đã làm xong, kiểm tra lại</span>
<span class="lk" role="button" tabindex="0" data-toi="them-zxu4yvp3">Làm không được? Hỏi AiiGrow</span>
</div>
</div></body></html>
