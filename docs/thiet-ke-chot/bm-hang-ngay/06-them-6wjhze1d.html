<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e8ddcf,#F2EBE3 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--sh)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.n-the.g{height:176px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)}
.n-the.c{height:128px;background:#fff}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cdc2b5}
.hinh{width:88px;height:88px;margin:0 auto;border-radius:30px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh)}
.hinh img{width:56px;height:56px}
h1{margin-top:14px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:6px;text-align:center;font-size:15px;line-height:21px;font-weight:500;color:#5a5a5a}
.chon{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chon span{height:76px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;box-shadow:var(--sh);font-size:28px;font-weight:800;line-height:30px}
.chon small{font-size:12.5px;font-weight:600;color:#5a5a5a;line-height:17px}
.chon .on{background:linear-gradient(#1b2b47,#0A1629);color:#fff;box-shadow:0 10px 16px -10px rgba(10,22,41,.7),inset 0 1.5px 0 rgba(255,255,255,.22)}
.chon .on small{color:#F4C76A}
.sao{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:#5a5a5a;white-space:nowrap}
.diem{flex:none;display:inline-flex;align-items:center;gap:3px;padding:3px 9px 3px 5px;border-radius:12px;background:#F4C76A;color:#0A1629;font-size:13px;font-weight:800}
.diem.no{background:#ffe1e1;color:#b81f1f}
.sao b{color:#b81f1f;font-weight:800}
.nhac{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;background:#ffe6d6;color:#b34a06;box-shadow:var(--sh)}
.nhac .ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff}
.nhac .ic img{width:26px;height:26px}
.nhac p{font-size:14px;line-height:19px;font-weight:800}
.nhac small{display:block;font-size:12.5px;font-weight:600}
.diem img{width:16px;height:16px}
.day{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut.phu{height:50px;color:#0A1629;background:#fff;box-shadow:var(--sh)}

/* ===== E Anh kim #442 ===== */
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--lom:var(--sunk);--bg:#ECE4D9;--card:#ECE4D9;--ink2:#5b5248;--btn:var(--kim);--btnInk:#0A1629;--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--gBtn:var(--kim);--hero:#ECE4D9;--topBg:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0));--hiBg:#0A1629;--hiSh:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);--badge:#0A1629;--flag:#D9AE57;--link:#8a6a2b;--icBg:#ECE4D9;--ring:#D9AE57;--line:rgba(120,98,70,.18);--tabBg:#ECE4D9;--tabInk:#7c7166}
svg{flex:none}
html,body,.app{background:#ECE4D9}
.app::before{background:#ECE4D9!important}
.nen{background:#ECE4D9;filter:none}
.n-top i,.n-the,.n-the.c{background:var(--n);box-shadow:var(--sh)}
.n-the.g{background:#0A1629}
.n-be i{background:var(--n)!important;box-shadow:var(--sunk)}
.mo{background:rgba(10,22,41,.35)}
.sheet{background:#ECE4D9;box-shadow:0 -8px 16px var(--lo)}
.keo{background:#bfb2a1}
.hinh{background:var(--n);box-shadow:var(--shL);color:#0A1629}
.hinh svg{width:44px;height:44px}
.hinh>svg{fill:none}
.ds,.ls,.xong,.hs,.de-y{background:var(--n);box-shadow:var(--shL)}
.ic{background:var(--n);box-shadow:var(--sunk);border-radius:50%;color:#0A1629}
.ic svg{width:22px;height:22px}
.may+.may,.lg+.lg,.viec+.viec,.de-y .lg+.lg{border-top:1px solid rgba(120,98,70,.18)}
.chk{background:#0A1629;box-shadow:none;border-radius:50%}.chk svg{fill:#F4C76A}
.bao span,.chon span{background:var(--n);box-shadow:var(--sunk);color:#0A1629}
.bao span.chon,.chon .on,.chon span.on{background:#0A1629;color:#F4C76A;box-shadow:0 0 0 2px #D9AE57}
.bao span.chon small,.chon .on small{color:#F4C76A}
.bao span small,.chon small{color:#5b5248}
.nut{background:var(--kim);color:#0A1629;border-radius:16px;font-weight:700;box-shadow:var(--btnSh)}
.nut::before,.nut::after{display:none}
.nut.phu,.hai .nut.phu,.de-y .nut.phu{background:var(--n);color:#0A1629;box-shadow:var(--sh)}
.nut svg{width:20px;height:20px}
.gio,.san{background:#0A1629;color:#F2EBE3;box-shadow:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35)}
.gio .nut{box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.diem{background:var(--kim);color:#0A1629}
.diem svg{width:15px;height:15px;fill:#0A1629}
.diem.no{background:var(--n);color:#A2412C;box-shadow:var(--sunk)}
.diem.no svg{fill:#A2412C}
.nhac{background:var(--n);color:#A2412C;box-shadow:var(--sunk)}
.nhac .ic{background:var(--n);box-shadow:var(--sh);color:#A2412C}
.sao b,.ok.no{color:#A2412C}
.ok{background:var(--n);box-shadow:var(--sunk);color:#0A1629}
.ok svg{width:26px;height:26px}
.ok.no{background:var(--n);box-shadow:var(--sunk)}
.ok .so{background:var(--n);box-shadow:var(--sh);color:#A2412C}
.tag{background:var(--n);color:#0A1629;box-shadow:var(--sunk)}
.tag.choi{background:var(--kim);box-shadow:none}
.muc em{background:#0A1629;color:#F4C76A}
.muc em.cam{background:#0A1629;color:#F4C76A}
.muc a,.di{color:#8a6a2b;font-weight:600}
.muc .t::before,.muc::before{background:#D9AE57}
.dong p small,.de-y .lg p small,.bao p,.dong b,.lg p small b.cam{color:#8a6a2b}
.tl{background:var(--kim);color:#0A1629;box-shadow:var(--btnSh)}
.chot{background:var(--kim);color:#0A1629;box-shadow:var(--btnSh)}
.ly.xam{color:#7c7166}
.cai{background:var(--n);box-shadow:var(--sh);color:#0A1629}.cai svg{width:22px;height:22px}
.chip{background:var(--n);color:#0A1629}.chip svg{width:20px;height:20px}
.chip i{background:#D9AE57;box-shadow:0 0 0 3px rgba(217,174,87,.35)}
.ma b{background:var(--n);box-shadow:inset 0 -3px 0 rgba(120,98,70,.2);color:#0A1629}
.doi svg{width:18px;height:18px}
.doi,.chu{color:#F4C76A}
.lui svg{fill:#0A1629}
.top{background:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0))}
.day{background:none}
/* hang tren cung dung chung */
.chuong{background:var(--n);box-shadow:var(--sh);color:#0A1629}.chuong svg{width:24px;height:24px}
.chuong em,.av em{background:#0A1629;color:#F4C76A}
.av,.av.a,.av.m,.av.n,.av.k{background:var(--n);color:#0A1629;box-shadow:var(--sunk)}
.be.on .av,.be.on .av.a{background:#0A1629;color:#F4C76A;box-shadow:0 0 0 2px #D9AE57}
.av i{background:#0A1629;color:#F4C76A;box-shadow:0 0 0 2px var(--n)}.av i svg{width:13px;height:13px}
.be.them .av{background:var(--n);box-shadow:var(--sh)}
.be small{color:#5b5248}
.so svg{width:28px;height:28px;color:#F4C76A;fill:#F4C76A}
.nhan{background:rgba(255,255,255,.12);color:#F2EBE3}.nhan svg{width:16px;height:16px;color:#F4C76A;fill:#F4C76A}
.quy{color:#F4C76A}
.gio .so{color:#F4C76A}
.gio .phut,.gio .quy.w{color:#F2EBE3}
.hs b,.di{color:#8a6a2b}
.lg time{color:#5b5248}
.tab{background:var(--n);box-shadow:0 -6px 12px -6px var(--lo)}
.tab div{color:#7c7166}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px;opacity:1;filter:none}
.tab .on{color:#0A1629;font-weight:700}.tab .on svg{background:var(--n);box-shadow:var(--sunk)}
.app>.bao{background:var(--n);box-shadow:var(--shL)}
.sheet .bao{background:none;box-shadow:none}
.hinh .nho{background:#0A1629;color:#F4C76A;box-shadow:0 0 0 2px var(--n)}.hinh .nho svg{width:18px;height:18px}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Hôm nay<i></i></div><div class="n-be"><i style="background:#E8600C"></i><i style="background:#1F48FF"></i><i style="background:#9b2fc0"></i><i style="background:#0f8a68"></i></div><div class="n-the g"></div><div class="n-the c"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg class="i-sao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></div>
<h1>Cho Bảo Anh vay sao</h1>
<p class="phu-de">= 30 phút chơi hoặc đổi quà<br>Sao nhiệm vụ của con sẽ trả nợ trước</p>
<div class="chon">
<span role="button" tabindex="0">10<small>sao</small></span>
<span role="button" tabindex="0">15<small>sao</small></span>
<span class="on" role="button" tabindex="0">30<small>sao</small></span>
</div>
<p class="sao">Đang có<span class="diem no"><svg class="i-sao" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>−20 sao</span>· vay xong <b>sẽ nợ 50 sao</b></p>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Cho Bảo Anh vay 30 sao</span>
<span class="nut phu" role="button" tabindex="0" data-toi="bm2-trang-chu">Thôi</span>
</div>
</div>
</div></body></html>
