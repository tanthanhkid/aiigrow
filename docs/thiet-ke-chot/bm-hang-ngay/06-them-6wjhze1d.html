<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e8ddcf,#F2EBE3 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--sh)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.n-the.g{height:176px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)}
.n-the.c{height:128px;background:#fff}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cdc2b5}
.hinh{width:88px;height:88px;margin:0 auto;border-radius:30px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh)}
.hinh img{width:56px;height:56px}
h1{margin-top:14px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:6px;text-align:center;font-size:15px;line-height:21px;font-weight:500;color:#5a5a5a}
.chon{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chon span{height:76px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;box-shadow:var(--sh);font-size:28px;font-weight:800;line-height:30px}
.chon small{font-size:12.5px;font-weight:600;color:#5a5a5a;line-height:17px}
.chon .on{background:linear-gradient(#1b2b47,#0A1629);color:#fff;box-shadow:0 10px 16px -10px rgba(10,22,41,.7),inset 0 1.5px 0 rgba(255,255,255,.22)}
.chon .on small{color:#F4C76A}
.sao{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;color:#5a5a5a;white-space:nowrap}
.diem{flex:none;display:inline-flex;align-items:center;gap:3px;padding:3px 9px 3px 5px;border-radius:12px;background:#F4C76A;color:#0A1629;font-size:13px;font-weight:800}
.diem.no{background:#ffe1e1;color:#b81f1f}
.sao b{color:#b81f1f;font-weight:800}
.nhac{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;background:#ffe6d6;color:#b34a06;box-shadow:var(--sh)}
.nhac .ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff}
.nhac .ic img{width:26px;height:26px}
.nhac p{font-size:14px;line-height:19px;font-weight:800}
.nhac small{display:block;font-size:12.5px;font-weight:600}
.diem img{width:16px;height:16px}
.day{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut.phu{height:50px;color:#0A1629;background:#fff;box-shadow:var(--sh)}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Hôm nay<i></i></div><div class="n-be"><i style="background:#E8600C"></i><i style="background:#1F48FF"></i><i style="background:#9b2fc0"></i><i style="background:#0f8a68"></i></div><div class="n-the g"></div><div class="n-the c"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/sao.webp" alt=""></div>
<h1>Cho Bảo Anh vay sao</h1>
<p class="phu-de">= 30 phút chơi hoặc đổi quà<br>Sao nhiệm vụ của con sẽ trả nợ trước</p>
<div class="chon">
<span role="button" tabindex="0">10<small>sao</small></span>
<span role="button" tabindex="0">15<small>sao</small></span>
<span class="on" role="button" tabindex="0">30<small>sao</small></span>
</div>
<p class="sao">Đang có<span class="diem no"><img src="/assets/icon3d/sao.webp" alt="">−20 sao</span>· vay xong <b>sẽ nợ 50 sao</b></p>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Cho Bảo Anh vay 30 sao</span>
<span class="nut phu" role="button" tabindex="0" data-toi="bm2-trang-chu">Thôi</span>
</div>
</div>
</div></body></html>
