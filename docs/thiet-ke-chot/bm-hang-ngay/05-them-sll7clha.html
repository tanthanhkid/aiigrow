<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e3efeb,#f4f4f2 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#f7f6f3;box-shadow:var(--clay)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.n-the.g{height:176px;background:linear-gradient(#d6e9e2,#eef4f1)}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.34)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 12px;border-radius:3px;background:#cfcec9}
.hinh{width:76px;height:76px;margin:0 auto;border-radius:26px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay)}
.hinh img{width:48px;height:48px}
h1{margin-top:12px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.ds{margin-top:14px;padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.may{display:flex;align-items:center;gap:12px;min-height:60px}
.may+.may{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.may p{flex:1;min-width:0;font-size:15px;font-weight:800}.may p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.may p small b{color:#1aa37a;font-weight:800}
.chk{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#0f6b5c;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3)}.chk svg{width:16px;height:16px;fill:#fff}
.muc{margin:16px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.bao{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bao span{display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;border-radius:22px;background:#ecebe7;box-shadow:var(--lom);font-size:16px;font-weight:800;white-space:nowrap}
.bao span small{font-size:12.5px;font-weight:700;color:#565c59;margin-top:2px}
.bao span.chon{background:#0f6b5c;color:#fff;box-shadow:0 10px 16px -10px rgba(10,82,70,.7),inset 0 1.5px 0 rgba(255,255,255,.35)}
.bao span.chon small{color:#dcebe6}
.day{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:22px;height:22px}
.nut.phu{height:50px;color:#0f1312;background:#fff;box-shadow:var(--clay)}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Hôm nay<i></i></div><div class="n-be"><i style="background:#f08a3c"></i><i style="background:#5b7fd6"></i><i style="background:#d86a8f"></i><i style="background:#3f9a86"></i></div><div class="n-the g"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/khoa.webp" alt=""></div>
<h1>Khoá máy Bảo Anh?</h1>
<div class="ds">
<div class="may"><span class="ic"><img src="/assets/icon3d/laptop.webp" alt=""></span><p>Laptop<small><b>● Roblox</b> · từ 19:02</small></p><span class="chk"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></span></div>
<div class="may"><span class="ic"><img src="/assets/icon3d/tablet.webp" alt=""></span><p>iPad<small>Máy ảnh 3′ · 18:40</small></p><span class="chk"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></span></div>
</div>
<p class="muc">Khoá bao lâu?</p>
<div class="bao">
<span class="chon" role="button" tabindex="0">30 phút<small>tới 20:10</small></span>
<span role="button" tabindex="0">1 giờ<small>tới 20:40</small></span>
<span role="button" tabindex="0">Sáng mai<small>tới 6:30</small></span>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-0kwhgpq6"><img src="/assets/icon3d/khoa.webp" alt="">Khoá 2 máy tới 20:10</span>
<span class="nut phu" role="button" tabindex="0" data-toi="bm2-trang-chu">Thôi, để con chơi tiếp</span>
</div>
</div>
</div></body></html>
