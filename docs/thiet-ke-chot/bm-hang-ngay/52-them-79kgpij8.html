<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.thoi{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;font-weight:700;color:#b3261e}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;gap:4px;z-index:3}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.cuon{position:absolute;left:0;right:0;top:96px;bottom:118px;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.nhan{margin:14px 6px 6px;font-size:14px;font-weight:700;color:#3a403d}
.nhan:first-child{margin-top:4px}
.lom{display:flex;align-items:center;height:58px;padding:0 20px;border-radius:29px;background:#e6e5e1;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 19px Inter,sans-serif;color:#0f1312}
.lom small{font-size:14px;font-weight:700;color:#565c59}
.hinh{display:flex;gap:10px}
.hinh span{flex:1;height:64px;border-radius:20px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay)}
.hinh span img{width:40px;height:40px}
.hinh .on{background:#fbecc0;box-shadow:0 0 0 3px #0f6b5c,var(--clay)}
.chon{display:flex;gap:8px;flex-wrap:wrap}
.chon span{min-width:64px;height:46px;padding:0 16px;border-radius:23px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay);font-size:15px;font-weight:800;color:#3a403d;white-space:nowrap}
.chon .on{background:#0f6b5c;color:#fff;box-shadow:0 8px 14px -8px rgba(15,107,92,.7),inset 0 1.5px 0 rgba(255,255,255,.3)}
.day{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 22px;background:#f4f4f2;box-shadow:0 -12px 18px -12px rgba(28,32,30,.25);z-index:4;display:flex;flex-direction:column;gap:2px}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-473f52w6"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Sửa quà</h1></div>
<div class="cuon">
<p class="nhan">Tên quà</p><div class="lom"><input type="text" aria-label="Tên quà" value="Đi ăn kem"></div>
<p class="nhan">Hình quà</p><div class="hinh"><span class="on"><img src="/assets/icon3d/coc.webp" alt=""></span><span><img src="/assets/icon3d/lich.webp" alt=""></span><span><img src="/assets/icon3d/game.webp" alt=""></span><span><img src="/assets/icon3d/dongho.webp" alt=""></span></div>
<p class="nhan">Cần bao nhiêu sao?</p><div class="lom"><input type="text" aria-label="Số sao" value="50"><small>sao</small></div>
<div class="chon" style="margin-top:8px"><span>30</span><span class="on">50</span><span>80</span><span>100</span></div>
<p class="nhan">Con đổi được mấy lần?</p><div class="chon"><span class="on">Không giới hạn</span><span>Tối đa 1 lần mỗi tuần</span></div>
<p class="nhan">Áp cho</p><div class="chon"><span class="on">Bảo Anh</span><span class="on">Bảo Minh</span></div>
</div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="them-473f52w6">Lưu quà Đi ăn kem</span><span class="thoi" role="button" tabindex="0" data-toi="them-t49meex8">Xoá quà này</span></div>
</div></body></html>
