<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#ffe7a6,#fdf4dc 45%,#f4f4f2)}
.rob{position:absolute;left:50%;top:60px;width:200px;margin-left:-100px;height:auto}
.phao{position:absolute;width:56px;height:56px}
h1{position:absolute;left:20px;right:20px;top:282px;text-align:center;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.vi{position:absolute;left:16px;right:16px;top:368px;display:flex;align-items:center;justify-content:center;gap:10px}
.o{display:flex;align-items:center;gap:6px;height:52px;padding:0 16px 0 10px;border-radius:26px;background:#fff;box-shadow:var(--clay);font-size:20px;font-weight:800;color:#6e4300;white-space:nowrap}
.o.cu{background:#ecebe7;box-shadow:var(--lom);color:#565c59;font-size:17px;height:44px}
.o img{width:28px;height:28px}
.mui{font-size:22px;font-weight:800;color:#0a5246}
.doi{position:absolute;left:0;right:0;top:428px;text-align:center;font-size:14px;font-weight:700;color:#3a403d}
.the{position:absolute;left:16px;right:16px;top:470px;padding:6px 12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;height:58px}
.dong+.dong{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:26px;height:26px}
.dong p{flex:1;min-width:0;font-size:15px;font-weight:800}.dong p small{display:block;font-size:12px;font-weight:600;color:#565c59}
.sao{flex:none;padding:4px 10px;border-radius:12px;background:#fbecc0;color:#6e4300;font-size:13px;font-weight:800}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<img class="phao" style="left:34px;top:96px" src="/assets/icon3d/phao_hoa.webp" alt="">
<img class="phao" style="right:34px;top:150px" src="/assets/icon3d/lap_lanh.webp" alt="">
<img class="rob" src="/assets/rob/xong.webp" alt="">
<h1>Bảo Anh nhận<br>20 sao hôm nay!</h1>
<div class="vi"><span class="o cu"><img src="/assets/icon3d/sao.webp" alt="">30</span><span class="mui">→</span><span class="o"><img src="/assets/icon3d/sao.webp" alt="">50 sao</span></div>
<p class="doi">= 50 phút chơi để con đổi</p>
<div class="the">
<div class="dong"><span class="ic"><img src="/assets/icon3d/lau.webp" alt=""></span><p>Dọn phòng<small>Đã gửi «Giỏi lắm con!»</small></p><span class="sao">+10 sao</span></div>
<div class="dong"><span class="ic"><img src="/assets/icon3d/sach.webp" alt=""></span><p>Đọc sách 20 phút<small>Đã gửi «Con đọc hay lắm!»</small></p><span class="sao">+10 sao</span></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Xong, về Trang chủ</span>
<span class="lk" role="button" tabindex="0" data-toi="them-oypre8gc">Xem việc chờ duyệt</span>
</div>
</div></body></html>
