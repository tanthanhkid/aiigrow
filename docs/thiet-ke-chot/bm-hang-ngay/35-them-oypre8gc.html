<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#fdf1d3,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.rob{position:absolute;left:50%;top:130px;width:210px;margin-left:-105px;height:auto}
h2{position:absolute;left:20px;right:20px;top:368px;text-align:center;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.phu{position:absolute;left:32px;right:32px;top:412px;text-align:center;font-size:15px;line-height:21px;font-weight:600;color:#3a403d}
.vi{position:absolute;left:50%;top:478px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 18px 10px 12px;border-radius:22px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:800;color:#6e4300;white-space:nowrap}
.vi img{width:28px;height:28px}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-e91jg28j"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Chờ duyệt</h1></div>
<img class="rob" src="/assets/rob/xong.webp" alt="">
<h2>Duyệt hết rồi!</h2>
<p class="phu">Không còn việc nào chờ Ba Mẹ. Con nộp việc mới, Rob sẽ báo ngay.</p>
<div class="vi"><img src="/assets/icon3d/sao.webp" alt="">Bảo Anh có 50 sao = 50 phút chơi</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-1jii7k19"><img src="/assets/icon3d/sao.webp" alt="">Giao việc mới cho Bảo Anh</span>
<span class="lk" role="button" tabindex="0" data-toi="bm2-trang-chu">Về Trang chủ</span>
</div>
</div></body></html>
