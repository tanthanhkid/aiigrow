<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#7d8783,#5f6865)}
.mo{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 26px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfcec9}
.hinh{width:110px;height:110px;margin:0 auto;border-radius:34px;display:grid;place-items:center;background:linear-gradient(#ffe39a,#fbecc0);box-shadow:var(--clay)}
.hinh img{width:72px;height:72px}
h1{margin-top:14px;text-align:center;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.4px}
.phu{margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:15px;line-height:21px;color:#3a403d;font-weight:600}
.phu b{display:flex;align-items:center;gap:3px;padding:4px 10px 4px 5px;border-radius:12px;background:#fbecc0;color:#6e4300;font-weight:800}
.phu b img{width:18px;height:18px}
.the{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:22px;background:#dcebe6;font-size:14px;font-weight:700;color:#0a5246;line-height:19px}
.the img{flex:none;width:40px;height:auto}
.day{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.nut{display:flex;align-items:center;justify-content:center;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.hai{display:flex;gap:8px}
.thoi{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:24px;font-size:15px;font-weight:700;color:#3a403d;white-space:nowrap}
.thoi.huy{color:#b42318}
</style></head>
<body><div class="app">
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-e91jg28j"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/chen.webp" alt=""></div>
<h1>Đã trao «Chọn món bữa tối»<br>cho Bảo Anh chưa?</h1>
<p class="phu">Con chọn hôm nay · đang giữ <b><img src="/assets/icon3d/sao.webp" alt="">50 sao</b></p>
<div class="the"><img src="/assets/rob/xong.webp" alt="">Bấm «Đã trao» thì mới trừ 50 sao, Rob báo con và chúc mừng con.</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-e91jg28j">Đã trao, trừ 50 sao</span>
<div class="hai"><span class="thoi" role="button" tabindex="0" data-toi="them-e91jg28j">Chưa, để tối mai</span><span class="thoi huy" role="button" tabindex="0" data-toi="them-e91jg28j">Huỷ &amp; hoàn sao</span></div>
</div>
</div>
</div></body></html>
