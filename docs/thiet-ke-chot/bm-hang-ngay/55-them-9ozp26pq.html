<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#fbe3ea,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.av{position:absolute;left:50%;top:110px;margin-left:-48px;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:#3fae8c;color:#fff;font-size:38px;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 10px 16px -8px rgba(0,0,0,.35)}
.nhan{position:absolute;left:24px;font-size:14px;font-weight:800;color:#3a403d}
.o{position:absolute;left:16px;right:16px;top:262px;height:58px;padding:0 18px;border-radius:22px;background:#ecebe7;box-shadow:var(--lom);display:flex;align-items:center;font-size:17px;font-weight:700}
.o::after{content:"";width:2px;height:24px;margin-left:2px;background:#0f6b5c}
.tuoi{position:absolute;left:16px;right:16px;top:368px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tuoi span{height:52px;border-radius:18px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay);font-size:16px;font-weight:800}
.tuoi .on{background:#0f6b5c;color:#fff}
.mau{position:absolute;left:16px;right:16px;top:470px;display:flex;justify-content:space-between}
.mau span{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.mau .on{box-shadow:0 0 0 3px #f4f4f2,0 0 0 6px #0f6b5c}
.goi{position:absolute;left:16px;right:16px;top:548px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:20px;background:#dcebe6;font-size:13.5px;font-weight:700;color:#0a5246;line-height:19px}
.goi img{flex:none;width:40px;height:auto}
.day{position:absolute;left:16px;right:16px;bottom:24px}
.nut{display:flex;align-items:center;justify-content:center;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-h60stad7"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Thêm con</h1></div>
<div class="av">K</div>
<p class="nhan" style="top:236px">Tên gọi của con</p>
<div class="o">Khang</div>
<p class="nhan" style="top:342px">Con mấy tuổi?</p>
<div class="tuoi"><span role="button" tabindex="0">4–5</span><span role="button" tabindex="0">6–7</span><span class="on" role="button" tabindex="0">8–9</span><span role="button" tabindex="0">10–12</span><span role="button" tabindex="0">13+</span></div>
<p class="nhan" style="top:444px">Màu của con</p>
<div class="mau"><span class="on" style="background:#3fae8c"></span><span style="background:#f08a3c"></span><span style="background:#5b7fd6"></span><span style="background:#e98aa6"></span><span style="background:#9b7bd8"></span><span style="background:#e2b23c"></span></div>
<div class="goi"><img src="/assets/rob/chi.webp" alt="">Rob cài sẵn giờ chơi, bộ nhiệm vụ và chặn app theo tuổi. Ba Mẹ sửa sau được.</div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="bm2-ho-so">Tạo hồ sơ cho Khang</span></div>
</div></body></html>
