<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.nut.do{background:linear-gradient(#d2453b,#a8231b);box-shadow:0 14px 20px -10px rgba(168,35,27,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.thoi{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:700;color:#3a403d}
.ic{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:28px;height:28px}
.mui{flex:none;width:18px;height:18px;fill:#8a908d}
.app{background:linear-gradient(#7d8783,#5f6865)}
.mo{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfcec9}
.hinh{width:96px;height:96px;margin:0 auto;border-radius:32px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay)}
.hinh.canh{background:linear-gradient(#f9dcc0,#fdeedd)}
.hinh img{width:60px;height:60px}
.hinh svg{width:52px;height:52px;fill:#0f6b5c}
h1{margin-top:14px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:4px;text-align:center;font-size:15px;line-height:21px;color:#3a403d}
.ds{margin-top:16px;padding:4px 12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.mat{display:flex;align-items:center;gap:12px;min-height:56px;font-size:14.5px;font-weight:700;color:#3a403d}
.mat+.mat{border-top:1.5px solid #ecebe7}
.mat .ic{width:40px;height:40px}.mat .ic img{width:26px;height:26px}
.day{margin-top:18px;display:flex;flex-direction:column;gap:6px}
</style></head>
<body><div class="app">
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></div>
<h1>Đã cho Bảo Anh mở<br>YouTube 30 phút</h1>
<p class="phu-de">Tính vào giờ chơi, từ 19:30 tới 20:00.</p>
<div class="ds"><div class="mat"><span class="ic"><img src="/assets/icon3d/tin.webp" alt=""></span>Đã báo cho Bảo Anh trên Laptop</div></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Về Hôm nay</span>
<span class="thoi" role="button" tabindex="0" data-toi="them-a4nqjrmp">Hoàn tác</span>
</div>
</div>
</div></body></html>
