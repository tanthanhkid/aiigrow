<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#fbe3df,#f4f4f2)}
.lui{position:absolute;left:8px;top:44px;width:44px;height:44px;display:grid;place-items:center;z-index:3}.lui svg{width:24px;height:24px;fill:#0a5246}
.hero{position:absolute;left:16px;right:16px;top:110px;height:300px;border-radius:36px;background:radial-gradient(90% 70% at 50% 30%,#fff3f1,#f6d6d1);box-shadow:var(--clay);text-align:center;overflow:hidden}
.hero img{position:absolute;left:50%;margin-left:-70px;top:14px;width:140px}
.hero h1{position:absolute;left:0;right:0;bottom:58px;font-size:23px;font-weight:800;letter-spacing:-.4px}
.hero p{position:absolute;left:24px;right:24px;bottom:16px;font-size:14px;line-height:20px;font-weight:700;color:#6a3a35}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#d2453b,#a8231b);box-shadow:0 14px 20px -10px rgba(168,35,27,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.thoi{display:flex;align-items:center;justify-content:center;min-height:48px;font-size:16px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-473f52w6"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div>
<div class="hero"><img src="/assets/rob/chi.webp" alt=""><h1>Xoá quà Đi ăn kem?</h1><p>Con sẽ không thấy quà này trên máy nữa. Sao con đã có không bị mất.</p></div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="them-473f52w6">Xoá quà Đi ăn kem</span><span class="thoi" role="button" tabindex="0" data-toi="them-473f52w6">Giữ lại quà</span></div>
</div></body></html>
