<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.nut.do{background:linear-gradient(#d2453b,#a8231b);box-shadow:0 14px 20px -10px rgba(168,35,27,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.thoi{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:700;color:#3a403d}
.ic{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:28px;height:28px}
.mui{flex:none;width:18px;height:18px;fill:#8a908d}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;gap:4px;z-index:3}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cuon{position:absolute;left:0;right:0;top:96px;bottom:112px;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.muc{margin:18px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.muc:first-child{margin-top:4px}
.ds{padding:4px 12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;min-height:64px}
.dong+.dong{border-top:1.5px solid #ecebe7}
.dong p{flex:1;min-width:0;font-size:15.5px;font-weight:800}
.dong p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.dong.do p{color:#b3261e}
.nhan{margin:14px 6px 6px;font-size:14px;font-weight:700;color:#3a403d}
.lom{display:flex;align-items:center;height:58px;padding:0 20px;border-radius:29px;background:#e6e5e1;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 19px Inter,sans-serif;color:#0f1312}
.chon{display:flex;gap:8px;flex-wrap:wrap}
.chon span{min-width:64px;height:46px;padding:0 16px;border-radius:23px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay);font-size:15px;font-weight:800;color:#3a403d}
.chon .on{background:#0f6b5c;color:#fff;box-shadow:0 8px 14px -8px rgba(15,107,92,.7),inset 0 1.5px 0 rgba(255,255,255,.3)}
.goi{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:22px;background:#fbecc0;font-size:13.5px;line-height:19px;font-weight:700;color:#6e4300}
.goi img{flex:none;width:44px;height:44px}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:4px}
.day .thoi{min-height:40px}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-may-m1"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Đổi tên máy</h1></div>
<div class="cuon">
<div style="text-align:center;margin-top:8px"><img src="/assets/icon3d/laptop.webp" alt="" style="width:110px;height:110px"></div><p class="nhan">Tên máy</p><div class="lom"><input type="text" aria-label="Tên máy" value="Laptop của Bảo Anh"></div><div class="goi"><img src="/assets/rob/chi.webp" alt="">Tên này hiện trên app của Ba Mẹ và trên màn khoá của con.</div>
</div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="bm2-may-m1">Lưu tên máy</span></div>
</div></body></html>
