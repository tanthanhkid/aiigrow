<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:8px;top:44px;height:48px;display:flex;align-items:center}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.san{position:absolute;left:16px;right:16px;top:96px;height:220px;border-radius:36px;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay);overflow:hidden;text-align:center}
.san .may{width:120px;height:120px;margin:22px auto 0;display:block}
.huy{position:absolute;left:50%;top:96px;margin-left:30px;width:52px;height:52px}
.san h1{margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-.4px}
.san p{margin-top:2px;font-size:14.5px;font-weight:700;color:#0a5246}
.o{position:absolute;top:332px;width:166px;height:104px;padding:14px 16px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.o img{width:32px;height:32px}
.o b{display:block;margin-top:6px;font-size:22px;font-weight:800;white-space:nowrap}
.o small{font-size:12.5px;font-weight:700;color:#565c59}
.hang{position:absolute;left:16px;right:16px;height:68px;display:flex;align-items:center;gap:12px;padding:0 16px 0 10px;border-radius:24px;background:#f7f6f3;box-shadow:var(--clay)}
.ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:28px;height:28px}
.hang p{flex:1;min-width:0;font-size:15.5px;font-weight:800;white-space:nowrap}
.hang p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.hang b{font-size:14px;font-weight:800;color:#0a5246;white-space:nowrap}
.hang.xin{background:#fbecc0}.hang.xin .ic{background:#f6dc95}.hang.xin b{color:#6e4300}
.day{position:absolute;left:16px;right:16px;bottom:22px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.phu2{position:absolute;left:16px;right:16px;top:620px;display:flex;gap:10px}.phu2 span{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;background:#f7f6f3;box-shadow:var(--clay);font-size:14.5px;font-weight:800;color:#0a5246}.phu2 img{width:22px;height:22px}.phu2 .do{color:#b3261e}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-may-ds"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="san"><img class="may" src="/assets/icon3d/laptop.webp" alt=""><img class="huy" src="/assets/icon3d/khien.webp" alt=""><h1>Laptop của Bảo Anh</h1><p>✓ Rob đang trông máy này</p></div>
<div class="o" style="left:16px" role="button" tabindex="0" data-toi="them-c95l1cwc"><img src="/assets/icon3d/dongho.webp" alt=""><b>40 phút</b><small>dùng trên máy này</small></div>
<div class="o" style="right:16px" role="button" tabindex="0" data-toi="them-c95l1cwc"><img src="/assets/icon3d/game.webp" alt=""><b>Roblox</b><small>đang mở</small></div>
<div class="hang" style="top:452px" role="button" tabindex="0" data-toi="them-8h2msmht"><span class="ic"><img src="/assets/icon3d/khoa.webp" alt=""></span><p>Chỉ app Ba Mẹ cho phép<small>4 app được dùng</small></p><b>›</b></div>
<div class="hang xin" style="top:532px" role="button" tabindex="0" data-toi="them-a4nqjrmp"><span class="ic"><img src="/assets/icon3d/web.webp" alt=""></span><p>Con xin mở YouTube<small>30 phút · lúc 19:20</small></p><b>Xem ›</b></div>
<div class="phu2"><span role="button" tabindex="0" data-toi="them-tw6apkag"><img src="/assets/icon3d/but.webp" alt="">Đổi tên máy</span><span class="do" role="button" tabindex="0" data-toi="them-v4ovqk42">Gỡ máy này</span></div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="them-sll7clha"><img src="/assets/icon3d/khoa.webp" alt="">Khoá mọi máy của Bảo Anh ngay</span></div>
</div></body></html>
