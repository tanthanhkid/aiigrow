*{box-sizing:border-box;margin:0;padding:0}
html,body{width:375px;height:812px;overflow:hidden;background:#0A1629}
body{font-family:'Be Vietnam Pro',-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.k{position:relative;width:375px;height:812px;overflow:hidden;background:radial-gradient(120% 70% at 30% 0%,#3a5a94 0%,#1d3158 38%,#0A1629 72%,#050c18 100%)}
.sb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 30px;color:#fff;font:700 15px/1 'Be Vietnam Pro',sans-serif}
.sb svg{height:12px;fill:#fff;margin-left:5px}
.khoa{position:absolute;left:0;right:0;top:58px;text-align:center;color:#fff}
.khoa svg{width:18px;height:18px;fill:#fff;opacity:.9}
.ngay{margin-top:6px;font:600 18px/22px 'Be Vietnam Pro',sans-serif;opacity:.92}
.gio{font:800 86px/92px 'Be Vietnam Pro',sans-serif;letter-spacing:-2px;text-shadow:0 2px 12px rgba(0,0,20,.35)}
.tb{position:absolute;left:12px;right:12px;border-radius:26px;padding:14px 16px 15px;background:linear-gradient(180deg,rgba(255,255,255,.97) 0,rgba(250,246,241,.95) 45%,rgba(242,235,227,.94) 100%);box-shadow:0 18px 30px -14px rgba(0,5,20,.6),0 4px 10px rgba(0,5,20,.2),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -5px 10px -6px rgba(10,22,41,.25);cursor:pointer}
.tb .dau{display:flex;align-items:center;gap:8px;font:600 13px/1 'Be Vietnam Pro',sans-serif;color:#5a5a5a}
.tb .app{width:24px;height:24px;border-radius:7px;background:#0A1629;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tb .app img{width:24px;height:24px;object-fit:cover}
.tb .dau b{flex:1;font-weight:700;color:#0A1629;letter-spacing:.2px}
.tb .than{display:flex;gap:12px;margin-top:10px;align-items:flex-start}
.tb .ic{flex:none;width:44px;height:44px;border-radius:22px;background:#ffe6d6;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -4px 6px -3px rgba(179,74,6,.25)}
.tb .ic img{width:30px;height:30px}
.tb h3{font:800 16px/21px 'Be Vietnam Pro',sans-serif;color:#0A1629}
.tb p{margin-top:3px;font:500 14px/19px 'Be Vietnam Pro',sans-serif;color:#5a5a5a}
.tb p em{font-style:normal;font-weight:800;color:#b34a06}
.tb.cu{transform:scale(.96);opacity:.93}
.nhom{position:absolute;left:0;right:0;top:446px;text-align:center;font:700 13px/1 'Be Vietnam Pro',sans-serif;color:rgba(255,255,255,.85)}
.goc{position:absolute;bottom:44px;width:50px;height:50px;border-radius:25px;background:rgba(10,22,41,.4);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.25)}
.goc svg{width:22px;height:22px;fill:#fff}
.vach{position:absolute;left:50%;bottom:9px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff}

/* ===== E Anh kim #442 ===== */
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--lom:var(--sunk);--bg:#ECE4D9;--card:#ECE4D9;--ink2:#5b5248;--btn:var(--kim);--btnInk:#0A1629;--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--gBtn:var(--kim);--hero:#ECE4D9;--topBg:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0));--hiBg:#0A1629;--hiSh:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);--badge:#0A1629;--flag:#D9AE57;--link:#8a6a2b;--icBg:#ECE4D9;--ring:#D9AE57;--line:rgba(120,98,70,.18);--tabBg:#ECE4D9;--tabInk:#7c7166}
svg{flex:none}
html,body,.app{background:#ECE4D9}
.app::before{background:#ECE4D9!important}
.nen{background:#ECE4D9;filter:none}
.n-top i,.n-the,.n-the.c{background:var(--n);box-shadow:var(--sh)}

.n-be i{background:var(--n)!important;box-shadow:var(--sunk)}
.mo{background:rgba(10,22,41,.35)}
.sheet{background:#ECE4D9;box-shadow:0 -8px 16px var(--lo)}
.keo{background:#bfb2a1}

.ic{background:var(--n);box-shadow:var(--sunk);border-radius:50%;color:#0A1629}

.chk{background:#0A1629;box-shadow:none;border-radius:50%}.chk svg{fill:#F4C76A}

.nut{background:var(--kim);color:#0A1629;border-radius:16px;font-weight:700;box-shadow:var(--btnSh)}

.muc em{background:#0A1629;color:#F4C76A}

.ly.xam{color:#7c7166}
.cai{background:var(--n);box-shadow:var(--sh);color:#0A1629}.cai svg{width:22px;height:22px}

.doi svg{width:18px;height:18px}
.doi,.chu{color:#F4C76A}

.app>.bao{background:var(--n);box-shadow:var(--shL)}

.tb{background:#ECE4D9;box-shadow:8px 8px 16px rgba(0,5,20,.45),-4px -4px 10px rgba(255,251,245,.12)}

.khoa .gio{background:none;box-shadow:none;color:#fff;border-radius:0}
.tb .app{background:#0A1629}
.tb.cu{background:#ECE4D9}
