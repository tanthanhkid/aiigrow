<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#fbe3e0,#f4f4f2 50%)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.hinh{position:absolute;left:50%;top:150px;width:150px;height:150px;margin-left:-75px;border-radius:48px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay)}
.hinh img{width:96px;height:96px}
.hinh .x{position:absolute;right:-8px;top:-8px;width:52px;height:52px;border-radius:26px;display:grid;place-items:center;background:#fff;box-shadow:var(--clay)}.hinh .x img{width:30px;height:30px}
h1{position:absolute;left:20px;right:20px;top:338px;text-align:center;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.6px}
.the{position:absolute;left:16px;right:16px;top:398px;padding:6px 14px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;min-height:56px;font-size:15px;font-weight:700;line-height:20px}
.dong+.dong{border-top:1.5px solid #ecebe7}
.dong img{flex:none;width:28px;height:28px}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#d2453b,#a8231b);box-shadow:0 14px 20px -10px rgba(168,35,27,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-ncq0jtzo"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="hinh"><img src="/assets/icon3d/lau.webp" alt=""><span class="x"><img src="/assets/icon3d/x.webp" alt=""></span></div>
<h1>Xoá việc «Dọn phòng»?</h1>
<div class="the">
<div class="dong"><img src="/assets/icon3d/tablet.webp" alt="">Bảo Anh không thấy việc này nữa</div>
<div class="dong"><img src="/assets/icon3d/sao.webp" alt="">30 sao con đang có vẫn giữ nguyên</div>
<div class="dong"><img src="/assets/icon3d/lich.webp" alt="">Bộ Tự lập còn 4 việc</div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-e91jg28j">Xoá «Dọn phòng»</span>
<span class="lk" role="button" tabindex="0" data-toi="them-ncq0jtzo">Giữ lại việc này</span>
</div>
</div></body></html>
