<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#e3efeb 0,#f4f4f2 300px,#f4f4f2 100%)}
.top{height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.bao{display:flex;align-items:center;gap:14px;margin:4px 16px 0;padding:16px;border-radius:28px;background:#f9e7d2;box-shadow:var(--clay)}
.hinh{position:relative;flex:none;width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:#f3d6b8;box-shadow:var(--lom)}
.hinh>img{width:46px;height:46px}
.hinh .nho{position:absolute;right:-8px;bottom:-8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--clay)}.hinh .nho img{width:22px;height:22px}
.bao h2{font-size:18px;line-height:23px;font-weight:800;letter-spacing:-.2px}
.bao p{margin-top:5px;font-size:13px;font-weight:700;color:#8a3c0c}
.muc{margin:22px 22px 8px;font-size:15px;font-weight:800;color:#3a403d}
.ds{margin:0 16px;padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.lg{display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 0}
.lg+.lg{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:19px}.lg p small{display:block;margin-top:2px;font-size:12.5px;line-height:17px;font-weight:600;color:#565c59}
.day{display:flex;flex-direction:column;gap:10px;margin:24px 16px 0}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:22px;height:22px}
.nut.phu{height:50px;color:#0f1312;background:#fff;box-shadow:var(--clay)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-0xf9hrgn"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>iPad mất liên lạc</h1></div>
<div class="bao"><span class="hinh"><img src="/assets/icon3d/tablet.webp" alt=""><span class="nho"><img src="/assets/icon3d/wifi.webp" alt=""></span></span><div><h2>iPad của Bảo Anh im hơn 1 ngày</h2><p>Lần cuối: Thứ Hai 2/11, 18:05</p></div></div>
<p class="muc">Thường do</p>
<div class="ds">
<div class="lg"><span class="ic"><img src="/assets/icon3d/tia.webp" alt=""></span><p>iPad hết pin hoặc tắt máy<small>Sạc rồi mở lại là xong</small></p></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/wifi.webp" alt=""></span><p>Tắt Wi-Fi, bật chế độ máy bay<small>Grow vẫn chặn, nhưng chưa gửi được giờ</small></p></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/x.webp" alt=""></span><p>Cấu hình AiiGrow bị gỡ<small>Phải cài lại cùng con</small></p></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-slv33bgc"><img src="/assets/icon3d/tablet.webp" alt="">Kiểm tra iPad cùng con</span>
<span class="nut phu" role="button" tabindex="0" data-toi="bm2-may-m2">Xem iPad</span>
</div>
</div></body></html>
