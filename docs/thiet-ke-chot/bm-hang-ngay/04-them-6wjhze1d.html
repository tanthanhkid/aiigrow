<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#7d8783,#5f6865)}
.mo{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfcec9}
.hinh{width:96px;height:96px;margin:0 auto;border-radius:32px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay)}
.hinh img{width:60px;height:60px}
h1{margin-top:14px;text-align:center;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:4px;text-align:center;font-size:15px;color:#3a403d}
.chon{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chon span{height:84px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7f6f3;box-shadow:var(--clay);font-size:30px;font-weight:800;line-height:32px}
.chon small{font-size:13px;font-weight:700;color:#565c59;line-height:18px}
.chon .on{background:#0f6b5c;color:#fff;box-shadow:0 0 0 3px #dcebe6,0 10px 16px -8px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35)}
.chon .on small{color:#dcebe6}
.sao{margin-top:14px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:22px;background:#fbecc0}
.sao img{width:32px;height:32px}
.sao p{font-size:14px;font-weight:700;color:#6e4300;line-height:19px}
.day{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.thoi{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:700;color:#3a403d}
</style></head>
<body><div class="app">
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/dongho.webp" alt=""></div>
<h1>Cho Bảo Anh thêm giờ</h1>
<p class="phu-de">Chỉ tính cho hôm nay.</p>
<div class="chon">
<span role="button" tabindex="0">15<small>phút</small></span>
<span class="on" role="button" tabindex="0">30<small>phút</small></span>
<span role="button" tabindex="0">60<small>phút</small></span>
</div>
<div class="sao"><img src="/assets/icon3d/sao.webp" alt=""><p>Con đang có 30 sao, tự đổi được<br>30 phút chơi mà không cần xin.</p></div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu">Cho thêm 30 phút ngay</span>
<span class="thoi" role="button" tabindex="0" data-toi="bm2-trang-chu">Thôi</span>
</div>
</div>
</div></body></html>
