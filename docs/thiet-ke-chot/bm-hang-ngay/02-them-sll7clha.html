<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:linear-gradient(#7d8783,#5f6865)}
.mo{position:absolute;inset:0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 24px;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfcec9}
.hinh{width:96px;height:96px;margin:0 auto;border-radius:32px;display:grid;place-items:center;background:linear-gradient(#d6e9e2,#eef4f1);box-shadow:var(--clay)}
.hinh img{width:60px;height:60px}
h1{margin-top:14px;text-align:center;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:4px;text-align:center;font-size:15px;color:#3a403d}
.ds{margin-top:16px;padding:6px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.may{display:flex;align-items:center;gap:12px;height:62px;padding:0 10px 0 8px}
.may+.may{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:30px;height:30px}
.may p{flex:1;font-size:16px;font-weight:800}.may p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.chk{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#0f6b5c}.chk svg{width:16px;height:16px;fill:#fff}
.day{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:24px;height:24px}
.thoi{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:700;color:#3a403d}
</style></head>
<body><div class="app">
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-trang-chu"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/khoa.webp" alt=""></div>
<h1>Khoá máy Bảo Anh ngay?</h1>
<p class="phu-de">Máy hiện màn khoá tới khi Ba Mẹ mở.</p>
<div class="ds">
<div class="may"><span class="ic"><img src="/assets/icon3d/laptop.webp" alt=""></span><p>Laptop<small>Đang chơi Roblox</small></p><span class="chk"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></span></div>
<div class="may"><span class="ic"><img src="/assets/icon3d/tablet.webp" alt=""></span><p>iPad<small>Hôm nay 12 phút</small></p><span class="chk"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></span></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-trang-chu"><img src="/assets/icon3d/khoa.webp" alt="">Khoá 2 máy của Bảo Anh</span>
<span class="thoi" role="button" tabindex="0" data-toi="bm2-trang-chu">Thôi, để con chơi tiếp</span>
</div>
</div>
</div></body></html>
