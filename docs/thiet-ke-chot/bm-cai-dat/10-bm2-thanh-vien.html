<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:24px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink);font-size:22px}
.kim{background:var(--kim);color:#0A1629;font-weight:700;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;font-size:16px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutp{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.nutd{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#b42318;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.chev{flex:none;width:18px;height:18px;fill:var(--ink)}
.card{background:var(--n);box-shadow:var(--shL);border-radius:28px}
.sv{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.nd{position:absolute;left:16px;right:16px;top:104px}
.ho{display:flex;align-items:center;gap:14px;padding:16px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.av{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink);font-size:28px;font-weight:800}
.ho p{font-size:17px;font-weight:800}
.ho p small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--ink2)}
.chip{display:inline-flex;margin-top:6px;padding:4px 10px;border-radius:11px;background:var(--n);box-shadow:var(--sunk);color:#0A1629;font-size:12.5px;font-weight:800}
.muc{margin:20px 6px 8px}
.ds{padding:4px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.lg{display:flex;align-items:center;gap:12px;min-height:64px}
.lg+.lg{border-top:1px solid rgba(120,98,70,.18)}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800}
.lg p small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2)}
.cac{display:flex}
.cac i{width:26px;height:26px;margin-left:-6px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--n);background:var(--n);box-shadow:var(--sunk);font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink)}
.cac i:first-child{margin-left:0}
.bo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;height:50px;border-radius:16px;background:var(--n);box-shadow:var(--sh);font-size:15px;font-weight:700;color:#b42318;white-space:nowrap}
.bo svg{width:22px;height:22px}
.ghi{margin:10px 8px 0;text-align:center;font-size:12.5px;font-weight:400;color:var(--ink2)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Bà Hoa</h1></div>
<div class="nd">
<div class="ho"><div class="av">H</div><p>Bà Hoa<small>Vào nhà từ 20/10 · Mẹ Lan mời</small><span class="chip">Làm được như Ba Mẹ</span></p></div>
<p class="muc">Bà Hoa trong nhà</p>
<div class="ds">
<div class="lg"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></span><p>Số điện thoại<small>0903 222 111</small></p></div>
<div class="lg"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2.3.7 3.5 2.6 3.5 5.6"></path></svg></span><p>Cùng trông<small>Cả 4 con</small></p><span class="cac"><i class="a">B</i><i class="m">M</i><i class="n">N</i><i class="k">K</i></span></div>
<div class="lg"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></span><p>7 ngày qua<small>Cho vay 3 lần · 45 sao</small></p></div>
</div>
<span class="bo" role="button" tabindex="0"><svg viewBox="0 0 24 24" class="sv"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Mời Bà Hoa rời nhà</span>
<p class="ghi">Bà Hoa sẽ không xem, không cho vay sao được nữa.</p>
</div>
</div>
</body></html>
