<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#fbe3ea,#f4f4f2)}
.top{position:absolute;left:8px;top:44px}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.ho{position:absolute;left:0;right:0;top:100px;text-align:center}
.av{width:88px;height:88px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:#c08a5b;color:#fff;font-size:36px;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 10px 16px -8px rgba(0,0,0,.35)}
.ho h1{margin-top:10px;font-size:24px;font-weight:800}
.ho p{font-size:14px;font-weight:600;color:#565c59}
.muc{position:absolute;left:22px;top:282px;font-size:15px;font-weight:800;color:#3a403d}
.q{position:absolute;left:16px;right:16px;display:flex;align-items:center;gap:12px;height:96px;padding:0 16px 0 12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.q.on{box-shadow:0 0 0 3px #0f6b5c,var(--clay)}
.ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:36px;height:36px}
.q p{flex:1;font-size:17px;font-weight:800}.q p small{display:block;margin-top:2px;font-size:13px;font-weight:600;color:#565c59;line-height:18px}
.r{flex:none;width:26px;height:26px;border-radius:50%;background:#ecebe7;box-shadow:var(--lom)}
.q.on .r{background:#0f6b5c;box-shadow:inset 0 0 0 7px #0f6b5c,inset 0 0 0 14px #fff}
.day{position:absolute;left:16px;right:16px;bottom:24px;display:flex;flex-direction:column;gap:6px}
.nut{display:flex;align-items:center;justify-content:center;height:58px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.bo{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:800;color:#a14b00}
.tt{position:absolute;left:16px;right:16px;top:312px;padding:4px 12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}.tt .d{display:flex;align-items:center;gap:12px;min-height:66px}.tt .d+.d{border-top:1.5px solid #ecebe7}.tt .d p{flex:1;font-size:15.5px;font-weight:800}.tt .d p small{display:block;font-size:13px;font-weight:600;color:#565c59}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="ho"><div class="av">H</div><h1>Bà Hoa</h1><p>Vào nhà từ 20/10</p></div>
<p class="muc">Bà Hoa trong nhà</p>
<div class="tt"><div class="d"><span class="ic"><img src="/assets/icon3d/dt.webp" alt=""></span><p>Số điện thoại<small>0903 222 111</small></p></div><div class="d"><span class="ic"><img src="/assets/icon3d/lich.webp" alt=""></span><p>Vào nhà<small>20/10 · Mẹ Lan mời</small></p></div><div class="d"><span class="ic"><img src="/assets/icon3d/nguoi.webp" alt=""></span><p>Cùng trông<small>Bảo Anh, Bảo Minh</small></p></div></div>
<div class="day">
<span class="nut" role="button" tabindex="0">Xong, về Cả nhà</span>
<span class="bo" role="button" tabindex="0">Mời Bà Hoa rời nhà</span>
</div>
</div></body></html>
