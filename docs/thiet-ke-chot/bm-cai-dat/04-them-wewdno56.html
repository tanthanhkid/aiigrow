html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}

.chu{position:absolute;left:16px;right:16px;top:352px;text-align:center}

.nhan{position:absolute;left:22px;right:14px;top:442px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;font-size:13px;font-weight:800;color:#3a403d}

.tb{position:absolute;left:16px;right:16px;top:488px;padding:14px;border-radius:24px;background:#2b302e;color:#fff;box-shadow:0 14px 24px -12px rgba(0,0,0,.5)}

.tb .lg img{width:16px;height:16px}

.tb b{display:block;margin-top:8px;font-size:15.5px}

.cho{position:absolute;left:50%;top:612px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:#f9e7d2;font-size:14px;font-weight:800;color:#8a3c0c;white-space:nowrap;box-shadow:var(--clay)}
.cho i{width:8px;height:8px;border-radius:4px;background:#e2660f;box-shadow:0 0 0 4px rgba(226,102,15,.2)}
.day{position:absolute;left:16px;right:16px;bottom:22px;display:flex;flex-direction:column;gap:6px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:56px;border-radius:30px;font-size:17px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:15px;font-weight:800;color:#565c59}
