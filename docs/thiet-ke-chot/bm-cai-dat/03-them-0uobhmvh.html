<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:24px}
.muc{display:flex;align-items:center;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#E3D9CB;box-shadow:inset 4px 4px 8px rgba(120,98,70,.28),inset -4px -4px 8px #FFFBF5;color:var(--ink);font-size:22px}
.kim{background:var(--kim);color:#0A1629;font-weight:700;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:16px;font-size:16px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nutp{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#0A1629;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.nutd{display:flex;align-items:center;justify-content:center;height:46px;border-radius:16px;font-size:15px;font-weight:700;color:#b42318;white-space:nowrap;background:var(--n);box-shadow:var(--sh)}
.chev{flex:none;width:18px;height:18px;fill:var(--ink)}
.card{background:var(--n);box-shadow:var(--shL);border-radius:28px}
.sv{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.nd{position:absolute;left:16px;right:16px;top:104px}
.san{position:relative;height:112px;border-radius:28px;background:var(--ink);box-shadow:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);overflow:hidden}
.nha{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:center;align-items:center}
.nha span{width:50px;height:50px;margin:0 -5px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--ink);background:var(--n);font-size:19px;font-weight:800;color:var(--ink)}
.nha .moi{margin-left:8px;background:var(--ink);border:2px dashed #F4C76A}
.nha .moi svg{width:20px;height:20px;fill:#F4C76A}
.san p{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13.5px;font-weight:700;color:#F4C76A}
.cach{margin-top:18px;display:flex;gap:4px;padding:4px;border-radius:24px;background:var(--n);box-shadow:var(--sunk)}
.cach span{flex:1;height:40px;border-radius:20px;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--ink3)}
.cach .on{background:var(--ink);color:#F4C76A;font-weight:700}
.lom{margin-top:12px;display:flex;align-items:center;height:56px;padding:0 20px;border-radius:28px;background:var(--n);box-shadow:var(--sunk)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 20px 'Be Vietnam Pro',sans-serif;color:#0A1629;letter-spacing:.3px}
.goi{display:flex;justify-content:flex-end}
.goi span{min-height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#8a6a2b}
.quyen{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:28px;background:var(--n);box-shadow:var(--sh)}
.quyen p{font-size:15px;font-weight:800}
.quyen p small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2);line-height:17px}
.day{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.nut{gap:8px}.nut svg{width:22px;height:22px}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:14px;font-weight:400;color:var(--ink2);white-space:nowrap}
.lk b{margin-left:4px;color:#8a6a2b;font-weight:600}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-99ji705p"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Mời người nhà</h1></div>
<div class="nd">
<div class="san"><div class="nha"><span class="l">L</span><span class="a">A</span><span class="m">M</span><span class="n">N</span><span class="k">K</span><span class="moi"><svg viewBox="0 0 24 24"><path d="M10.5 4.5a1.5 1.5 0 0 1 3 0v6h6a1.5 1.5 0 0 1 0 3h-6v6a1.5 1.5 0 0 1-3 0v-6h-6a1.5 1.5 0 0 1 0-3h6Z"></path></svg></span></div><p>Cùng trông 4 con với Mẹ Lan</p></div>
<div class="cach" role="tablist" aria-label="Mời bằng"><span class="on" role="tab" aria-selected="true" tabindex="0">Số điện thoại</span><span role="tab" aria-selected="false" tabindex="0">Email</span></div>
<div class="lom"><input type="tel" inputmode="tel" aria-label="Số điện thoại người được mời" value="0909 876 543"></div>
<div class="goi"><span role="button" tabindex="0" data-toi="them-wewdno56">Chọn từ danh bạ ›</span></div>
<div class="quyen"><span class="ic"><svg viewBox="0 0 24 24" class="sv"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg></span><p>Ba Tuấn làm được như bạn<small>Cho giờ, duyệt việc, đổi cài đặt</small></p></div>
<div class="day">
<span class="nutk nut" role="button" tabindex="0" data-toi="them-wewdno56"><svg viewBox="0 0 24 24" class="sv"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"></path></svg>Gửi lời mời cho Ba Tuấn</span>
<span class="lk" role="button" tabindex="0" data-toi="them-mflye65x">Ba Tuấn chưa có app?<b>Xem cách gửi link</b></span>
</div>
</div>
</div>
</body></html>
