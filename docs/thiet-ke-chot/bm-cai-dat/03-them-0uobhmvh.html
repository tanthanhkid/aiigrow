<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.12),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',Inter,system-ui,sans-serif;color:#0A1629}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.nd{position:absolute;left:16px;right:16px;top:104px}
.san{position:relative;height:112px;border-radius:28px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629);box-shadow:0 18px 26px -14px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 -10px 16px -8px rgba(0,0,0,.35);overflow:hidden}
.san::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:36px;border-radius:26px 26px 60px 60px;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0))}
.nha{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:center;align-items:center}
.nha span{width:50px;height:50px;margin:0 -5px;border-radius:50%;display:grid;place-items:center;border:4px solid #14264a;font-size:19px;font-weight:800;color:#fff}
.l{background:#e98aa6}.a{background:#E8600C}.m{background:#1F48FF}.n{background:#9b2fc0}.k{background:#0f8a68}
.nha .moi{margin-left:8px;background:#fff;border:3px dashed #F4C76A}
.nha .moi svg{width:20px;height:20px;fill:#0A1629}
.san p{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13.5px;font-weight:800;color:#F4C76A}
.cach{margin-top:18px;display:flex;gap:4px;padding:4px;border-radius:24px;background:#e8ddcf;box-shadow:var(--lom)}
.cach span{flex:1;height:40px;border-radius:20px;display:grid;place-items:center;font-size:15px;font-weight:800;color:#5a5a5a}
.cach .on{background:#fff;color:#0A1629;box-shadow:var(--clay)}
.lom{margin-top:12px;display:flex;align-items:center;height:56px;padding:0 20px;border-radius:28px;background:#fff;box-shadow:var(--clay)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 20px 'Be Vietnam Pro',Inter,sans-serif;color:#0A1629;letter-spacing:.3px}
.goi{display:flex;justify-content:flex-end}
.goi span{min-height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:800;color:#0A1629}
.quyen{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:28px;background:#fff;box-shadow:var(--clay)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.quyen p{font-size:15px;font-weight:800}
.quyen p small{display:block;font-size:12.5px;font-weight:500;color:#5a5a5a;line-height:17px}
.day{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut img{width:22px;height:22px}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:14px;font-weight:600;color:#5a5a5a;white-space:nowrap}
.lk b{margin-left:4px;color:#0A1629;font-weight:800}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Mời người nhà</h1></div>
<div class="nd">
<div class="san"><div class="nha"><span class="l">L</span><span class="a">B</span><span class="m">M</span><span class="n">N</span><span class="k">K</span><span class="moi"><svg viewBox="0 0 24 24"><path d="M10.5 4.5a1.5 1.5 0 0 1 3 0v6h6a1.5 1.5 0 0 1 0 3h-6v6a1.5 1.5 0 0 1-3 0v-6h-6a1.5 1.5 0 0 1 0-3h6Z"></path></svg></span></div><p>Cùng trông 4 con với Mẹ Lan</p></div>
<div class="cach" role="tablist" aria-label="Mời bằng"><span class="on" role="tab" aria-selected="true" tabindex="0">Số điện thoại</span><span role="tab" aria-selected="false" tabindex="0">Email</span></div>
<div class="lom"><input type="tel" inputmode="tel" aria-label="Số điện thoại người được mời" value="0909 876 543"></div>
<div class="goi"><span role="button" tabindex="0">Chọn từ danh bạ ›</span></div>
<div class="quyen"><span class="ic"><img src="/assets/icon3d/khien.webp" alt=""></span><p>Ba Tuấn làm được như bạn<small>Cho giờ, duyệt việc, đổi cài đặt</small></p></div>
<div class="day">
<span class="nut" role="button" tabindex="0"><img src="/assets/icon3d/gui.webp" alt="">Gửi lời mời cho Ba Tuấn</span>
<span class="lk" role="button" tabindex="0">Ba Tuấn chưa có app?<b>Xem cách gửi link</b></span>
</div>
</div>
</div></body></html>
