<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.muc{margin:6px 6px 10px;font-size:15px;font-weight:800;color:#3a403d}
.b{display:flex;align-items:center;gap:14px;padding:12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.b+.b{margin-top:12px}
.hinh{position:relative;flex:none;width:96px;height:96px;border-radius:22px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}
.hinh img{width:60px;height:60px}
.so{position:absolute;left:-4px;top:-4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0f6b5c;color:#fff;font-size:15px;font-weight:800;box-shadow:0 4px 8px -3px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35)}
.b p{flex:1;font-size:16px;line-height:22px;font-weight:800}
.b p small{display:block;margin-top:4px;font-size:13px;line-height:18px;font-weight:600;color:#565c59}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:52px;margin-top:20px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.lk{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:6px;font-size:14.5px;font-weight:800;color:#0a5246}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-may-m2"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Sửa trên iPad của con</h1></div>
<div class="cuon">
<p class="muc">Cầm iPad lên, làm theo 3 bước</p>
<div class="b"><div class="hinh"><img src="/assets/icon3d/banhrang.webp" alt=""><span class="so">1</span></div><p>Mở «Cài đặt»<small>Biểu tượng bánh răng màu xám trên iPad</small></p></div>
<div class="b"><div class="hinh"><img src="/assets/icon3d/dong_ho_cat.webp" alt=""><span class="so">2</span></div><p>Chạm «Thời gian<br>sử dụng»<small>Chọn tên Bảo Anh</small></p></div>
<div class="b"><div class="hinh"><img src="/assets/icon3d/khoa.webp" alt=""><span class="so">3</span></div><p>Bật lại, nhập mật mã<small>Mật mã Thời gian sử dụng<br>(Ba Mẹ đặt lúc cài)</small></p></div>
<span class="nut" role="button" tabindex="0" data-toi="bm2-may-ds">Đã làm xong, kiểm tra lại</span>
<span class="lk" role="button" tabindex="0" data-toi="them-zxu4yvp3">Làm không được? Hỏi AiiGrow</span>
</div>
</div></body></html>
