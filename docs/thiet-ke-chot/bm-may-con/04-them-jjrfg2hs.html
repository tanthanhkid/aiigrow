<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.12),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.nen{position:absolute;inset:-12px;background:linear-gradient(#e8ddcf,#F2EBE3 340px);filter:blur(6px)}
.n-top{display:flex;align-items:center;justify-content:space-between;padding:58px 32px 0;font-size:28px;font-weight:800}
.n-top i{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--clay)}
.n-be{display:flex;gap:14px;padding:18px 28px 0}.n-be i{width:56px;height:56px;border-radius:50%}
.n-the{margin:14px 28px 0;height:150px;border-radius:28px;background:#fff;box-shadow:var(--clay)}
.n-the.g{height:176px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 12px;border-radius:3px;background:#d9cdbd}
.hinh{width:76px;height:76px;margin:0 auto;border-radius:26px;display:grid;place-items:center;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629);box-shadow:var(--clay)}
.hinh img{width:48px;height:48px}
h1{margin-top:12px;text-align:center;font-size:23px;line-height:29px;font-weight:800;letter-spacing:-.4px}
.ds{margin-top:14px;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--clay)}
.may{display:flex;align-items:center;gap:12px;min-height:60px}
.may+.may{border-top:1.5px solid #efe7dd}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.may p{flex:1;min-width:0;font-size:15px;font-weight:800}.may p small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.may p small b{color:#0A1629;font-weight:800}
.chk{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#0A1629;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3)}.chk svg{width:16px;height:16px;fill:#fff}
.muc{margin:16px 6px 8px;font-size:15px;font-weight:800;color:#0A1629}
.bao{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bao span{display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;border-radius:22px;background:#F2EBE3;box-shadow:var(--lom);font-size:16px;font-weight:800;white-space:nowrap}
.bao span small{font-size:12.5px;font-weight:700;color:#5a5a5a;margin-top:2px}
.bao span.chon{background:linear-gradient(#1b2b47,#0A1629);color:#fff;box-shadow:0 10px 16px -10px rgba(10,22,41,.7),inset 0 1.5px 0 rgba(255,255,255,.22)}
.bao span.chon small{color:#F4C76A}
.day{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:28px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut img{width:22px;height:22px}
.nut.phu{height:50px;color:#0A1629;background:#fff;box-shadow:var(--clay)}
.phu2{margin:4px 10px 0;text-align:center;font-size:13px;line-height:18px;font-weight:600;color:#5a5a5a}
.may p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true"><div class="n-top">Máy cả nhà<i></i></div><div class="n-be"><i style="background:#E8600C"></i><i style="background:#1F48FF"></i></div><div class="n-the g"></div><div class="n-the"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-1016dwpz"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/nguoi.webp" alt=""></div>
<h1>Đổi người trên máy</h1><p class="phu2">Bé khác muốn dùng Máy cả nhà thì làm 3 bước trên máy đó.</p>
<div class="ds">
<div class="may"><span class="ic"><img src="/assets/icon3d/may_tinh.webp" alt=""></span><p>1. Bấm tên bé ở góc màn hình<small>Bảo Minh đang dùng · chạm «Đổi người»</small></p></div>
<div class="may"><span class="ic"><img src="/assets/icon3d/nguoi.webp" alt=""></span><p>2. Bé kia chọn tên, nhập PIN<small>PIN 4 số do Ba Mẹ đặt</small></p></div>
<div class="may"><span class="ic"><img src="/assets/icon3d/sao.webp" alt=""></span><p>3. Phút của bé trước dừng ngay<small>Sao trừ đúng bé đang chơi</small></p></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="them-1016dwpz">Xong</span>
</div>
</div>
</div></body></html>
