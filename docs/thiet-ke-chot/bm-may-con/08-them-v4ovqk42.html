<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.12),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.sau{position:absolute;inset:0;filter:blur(6px);background:linear-gradient(#e8ddcf,#F2EBE3 300px)}
.sau .t{position:absolute;left:24px;top:58px;width:200px;height:24px;border-radius:8px;background:#d9cdbd}
.sau .k{position:absolute;left:16px;right:16px;border-radius:28px;background:#fff;box-shadow:var(--clay)}
.sau .k.n{background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)}
.sau .k.c{background:#fff}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#d9cdbd}
.hinh{width:88px;height:88px;margin:0 auto;border-radius:28px;display:grid;place-items:center;background:#fff;box-shadow:var(--clay)}
.hinh img{width:58px;height:58px}
h1{margin-top:14px;text-align:center;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin:6px auto 0;max-width:300px;text-align:center;font-size:14.5px;line-height:21px;color:#5a5a5a}
.ds{margin-top:16px;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--clay)}
.mat{display:flex;align-items:center;gap:12px;min-height:58px}
.mat+.mat{border-top:1.5px solid #efe7dd}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.mat p{flex:1;min-width:0;font-size:14.5px;font-weight:800}
.mat p small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.day{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut.phu{height:48px;font-size:15px;color:#0A1629;background:#fff;box-shadow:var(--clay)}
</style></head>
<body><div class="app">
<div class="sau" aria-hidden="true"><span class="t"></span><span class="k n" style="top:104px;height:116px"></span><span class="k" style="top:232px;left:16px;right:196px;height:104px"></span><span class="k" style="top:232px;left:196px;height:104px"></span><span class="k c" style="top:350px;height:66px"></span><span class="k" style="top:460px;height:132px"></span></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-may-m1"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/laptop.webp" alt=""></div>
<h1>Gỡ Máy cả nhà?</h1>
<p class="phu-de">Grow thôi trông máy này. Các bé dùng Máy cả nhà sẽ không bị trừ sao, không theo danh sách App &amp; web.</p>
<div class="ds">
<div class="mat"><span class="ic"><img src="/assets/icon3d/lich.webp" alt=""></span><p>Báo cáo cũ vẫn giữ<small>Lịch sử dùng máy không mất</small></p></div>
<div class="mat"><span class="ic"><img src="/assets/icon3d/lap.webp" alt=""></span><p>Ghép lại lúc nào cũng được<small>Bằng mã 6 số như lần đầu</small></p></div>
</div>
<div class="day">
<span class="nut" role="button" tabindex="0" data-toi="bm2-may-ds">Gỡ Máy cả nhà khỏi AiiGrow</span>
<span class="nut phu" role="button" tabindex="0" data-toi="bm2-may-m1">Giữ máy này</span>
</div>
</div>
</div></body></html>
