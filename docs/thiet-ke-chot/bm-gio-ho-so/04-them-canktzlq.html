<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.sau{position:absolute;inset:0;filter:blur(6px);background:linear-gradient(#e8ddcf,#F2EBE3 300px)}
.sau .h{position:absolute;left:20px;top:56px;font-size:28px;font-weight:800}
.sau .av{position:absolute;top:120px;width:60px;height:60px;border-radius:50%}
.sau .k{position:absolute;left:16px;right:16px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;border-radius:34px 34px 0 0;background:#F2EBE3;box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cdc3b8}
.hinh{width:84px;height:84px;margin:0 auto;border-radius:30px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh)}
.hinh img{width:52px;height:52px}
h1{margin-top:12px;text-align:center;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px}
.phu-de{margin-top:4px;text-align:center;font-size:14.5px;line-height:20px;color:#5a5a5a}
.ds{margin-top:14px;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.lg{display:flex;align-items:center;gap:10px;min-height:60px}
.lg+.lg{border-top:1px solid #efe7dd}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800}
.lg p small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3}.ic img{width:24px;height:24px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:52px;margin-top:18px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#c8392f,#a11f17);box-shadow:0 12px 18px -10px rgba(161,31,23,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.nut.phu{height:48px;margin-top:10px;color:#0A1629;background:#fff;box-shadow:var(--sh)}
</style></head>
<body><div class="app">
<div class="sau" aria-hidden="true"><p class="h">Hồ sơ</p><span class="av" style="left:20px;background:#E8600C"></span><span class="av" style="left:92px;background:#1F48FF"></span><span class="av" style="left:164px;background:#9b2fc0"></span><span class="av" style="left:236px;background:#0f8a68"></span><span class="k" style="top:208px;height:150px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629)"></span><span class="k" style="top:376px;height:200px"></span></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="bm2-ho-so"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/nguoi.webp" alt=""></div>
<h1>Xoá hồ sơ Bảo Anh?</h1>
<p class="phu-de">Xoá rồi không lấy lại được.</p>
<div class="ds">
<div class="lg"><span class="ic"><img src="/assets/icon3d/laptop.webp" alt=""></span><p>Gỡ Grow khỏi 2 máy<small>Laptop và iPad của Bảo Anh</small></p></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/sao.webp" alt=""></span><p>Mất 30 sao<small>Cả quà đang chờ trao</small></p></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/lich.webp" alt=""></span><p>Mất báo cáo và cài đặt<small>Nhiệm vụ, phút chơi đã đặt</small></p></div>
</div>
<span class="nut" role="button" tabindex="0" data-toi="them-h60stad7">Xoá hồ sơ Bảo Anh</span>
<span class="nut phu" role="button" tabindex="0" data-toi="bm2-ho-so">Giữ lại</span>
</div>
</div></body></html>
