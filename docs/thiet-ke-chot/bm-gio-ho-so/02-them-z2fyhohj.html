<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.12),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:3}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0A1629}
.tde{font-size:17px;font-weight:800;margin-right:auto;margin-left:6px}
.the{position:absolute;left:16px;right:16px;top:100px;height:196px;border-radius:34px;background:radial-gradient(90% 70% at 85% 10%,#1d3158,#0A1629);box-shadow:0 18px 26px -14px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.18),inset 0 -10px 16px -8px rgba(0,0,0,.35);overflow:hidden}
.the .khoa{position:absolute;right:18px;top:18px;width:88px;height:auto}
.avt{position:absolute;left:20px;top:24px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:#E8600C;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 10px 16px -8px rgba(0,0,0,.45);font-size:36px;font-weight:800;color:#fff}
.ten{position:absolute;left:22px;bottom:24px}
.ten b{display:block;font-size:26px;line-height:30px;font-weight:800;letter-spacing:-.5px;color:#fff}
.ten span{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:12px;background:#F4C76A;font-size:13px;font-weight:800;color:#0A1629}
.nd{position:absolute;left:16px;right:16px;top:322px}
.nhan{margin:0 0 10px 6px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.o4{display:flex;gap:12px;justify-content:space-between}
.o4 i{flex:1;height:72px;border-radius:24px;background:#F2EBE3;box-shadow:var(--lom);display:grid;place-items:center;font:800 30px 'Be Vietnam Pro',sans-serif;font-style:normal;color:#0A1629}
.goi{margin-top:22px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:20px;background:#fbf0d6;font-size:13.5px;font-weight:700;color:#0A1629;line-height:19px}.goi img{flex:none;width:40px;height:auto}
.day{position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:2px;z-index:3}
.nut{position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut span{position:relative}
</style></head>
<body><div class="app">
<div class="top">
<div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ho-so"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div>
<div class="tde">PIN vào máy</div>
</div>
<div class="the">
<div class="avt">B</div>
<div class="ten"><b>PIN của Bảo Anh</b><span>Đặt lần cuối 06/11</span></div>
<img class="khoa" src="/assets/icon3d/khoa.webp" alt="">
</div>
<div class="nd">
<div class="nhan">PIN đang dùng</div>
<div class="o4"><i>2</i><i>5</i><i>8</i><i>1</i></div>


<div class="goi"><img src="/assets/rob/chi.webp" alt="">Lưu xong, Bảo Anh dùng PIN mới trên mọi máy.</div>
</div>
<div class="day">
<button class="nut" type="button" data-toi="bm2-ho-so"><span>Lưu PIN mới</span></button>
</div>
</div></body></html>
