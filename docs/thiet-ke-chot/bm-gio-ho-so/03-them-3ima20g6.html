<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.tom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o{padding:14px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.o .d{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;color:#3a403d}
.o .d img{width:22px;height:22px}
.o strong{display:block;margin-top:6px;font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.8px}
.muc{display:flex;align-items:center;gap:6px;margin:20px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.muc em{font-style:normal;padding:2px 8px;border-radius:10px;font-size:12px;background:#ecebe7;color:#3a403d}
.ngay{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ngay span{height:44px;border-radius:16px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom);font-size:13.5px;font-weight:800;color:#565c59}
.ngay .on{background:#0f6b5c;color:#fff;box-shadow:0 8px 14px -8px rgba(15,107,92,.7),inset 0 1.5px 0 rgba(255,255,255,.3)}
.ls{padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.tag{flex:none;padding:4px 9px;border-radius:11px;font-size:12.5px;font-weight:800;white-space:nowrap;background:#ecebe7;color:#3a403d}
.goi{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px 10px 10px;border-radius:24px;background:#f9e7d2;box-shadow:var(--clay);font-size:13px;line-height:18px;font-weight:700;color:#8a3c0c}
.goi img{flex:none;width:48px;height:48px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:52px;margin-top:18px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-gio"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Giờ học của Bảo Anh</h1></div>
<div class="cuon">
<div class="tom">
<div class="o" role="button" tabindex="0"><span class="d"><img src="/assets/icon3d/sach.webp" alt="">Bắt đầu</span><strong>17:00</strong></div>
<div class="o" role="button" tabindex="0"><span class="d"><img src="/assets/icon3d/dongho.webp" alt="">Kết thúc</span><strong>18:00</strong></div>
</div>
<p class="muc">Áp cho các ngày</p>
<div class="ngay"><span class="on">T2</span><span class="on">T3</span><span class="on">T4</span><span class="on">T5</span><span class="on">T6</span><span>T7</span><span>CN</span></div>
<p class="muc">Trong giờ học, máy chỉ mở<em>2</em></p>
<div class="ls">
<div class="lg"><span class="ic"><img src="/assets/icon3d/may_tinh.webp" alt=""></span><p>Học với AiiRob<small>Laptop</small></p><span class="tag">Học</span></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/sach.webp" alt=""></span><p>Từ điển<small>Laptop</small></p><span class="tag">Học</span></div>
</div>
<div class="goi"><img src="/assets/rob/chi.webp" alt="">Roblox, Máy ảnh tạm khoá 17:00 – 18:00. Giờ học không trừ giờ chơi.</div>
<span class="nut" role="button" tabindex="0" data-toi="bm2-gio">Lưu giờ học 17:00 – 18:00</span>
</div>
</div></body></html>
