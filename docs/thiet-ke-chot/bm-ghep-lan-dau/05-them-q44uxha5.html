<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;padding:6px 4px 24px;display:flex;background:var(--n);box-shadow:0 -6px 12px -6px var(--lo);z-index:4}
.tab div{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:var(--ink);font-weight:700}.tab .on svg{background:var(--n);box-shadow:var(--sunk)}

.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}.lui svg{width:24px;height:24px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.muc{display:flex;align-items:center;gap:8px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc:first-child{margin-top:4px}
.muc i{width:18px;height:18px;border-radius:9px}
.muc small{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc .v{background:#D9AE57}.muc .x{background:#0A1629}
.ds{padding:4px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg,.chon+.lg{border-top:1px solid rgba(120,98,70,.18)}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink)}.ic svg{width:22px;height:22px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg p small{display:block;margin-top:1px;font-size:12.5px;font-weight:400;color:var(--ink2)}
.mui{flex:none;font-size:20px;font-weight:700;color:var(--ink3);padding:0 2px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;color:#0A1629;font-size:16px;font-weight:700;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}

.top{left:0;right:auto;height:92px;padding:44px 8px 0;position:absolute;z-index:5}
.san{position:absolute;left:16px;right:16px;top:100px;height:260px;border-radius:32px;background:var(--n);box-shadow:var(--shL);overflow:hidden;text-align:center}
.san img.rob{position:absolute;left:50%;margin-left:-80px;top:10px;width:160px}
.san .ic{position:absolute;left:50%;margin-left:38px;top:22px;width:56px;height:56px;box-shadow:var(--sh);background:var(--n)}.san .ic svg{width:28px;height:28px}
.san h1{position:absolute;left:0;right:0;bottom:44px;font-size:23px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.san p{position:absolute;left:0;right:0;bottom:18px;font-size:14px;font-weight:600;color:#8a6a2b}
.the{position:absolute;left:16px;right:16px;top:384px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;background:var(--n);box-shadow:var(--sh);font-size:15px;font-weight:800}
.bt{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink)}.bt svg{width:24px;height:24px}
.the small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2);margin-top:2px}
.day{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;background:var(--n);box-shadow:0 -6px 12px -6px var(--lo);z-index:6}
.day .nut{width:100%;height:58px;border-radius:16px;font-size:17px;font-weight:700;margin:0}
.lk{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#8a6a2b;white-space:nowrap}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-ob-ghep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></div></div>
<div class="san"><img class="rob" src="/assets/rob/cho.webp" alt=""><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"></path></svg></span><h1>Mã đã hết hạn</h1><p>Mã chỉ dùng được 10 phút</p></div>
<div class="the"><span class="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg></span><span>Mã cũ đã bị huỷ<small>Máy Bảo Anh chưa bị ghép nhầm</small></span></div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="bm1-ob-ghep"><span>Lấy mã mới cho Bảo Anh</span></span><span class="lk" role="button" tabindex="0" data-toi="bm2-trang-chu">Để sau, vào trang chủ</span></div>
</div></body></html>
