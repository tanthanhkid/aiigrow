<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--nho:0 6px 10px -6px rgba(28,32,30,.26),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.14)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(#f9e7d2,#f4f4f2)}
.top{position:absolute;left:8px;top:44px;height:48px;display:flex;align-items:center;z-index:5}
.lui{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.san{position:absolute;left:16px;right:16px;top:100px;height:240px;border-radius:36px;background:radial-gradient(90% 70% at 50% 30%,#fdf3e6,#f1d9bd);box-shadow:var(--clay);overflow:hidden;text-align:center}
.san img.rob{position:absolute;left:50%;margin-left:-80px;top:6px;width:160px}
.san img.ic{position:absolute;left:50%;margin-left:30px;top:18px;width:60px}
.san h1{position:absolute;left:0;right:0;bottom:42px;font-size:23px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.san p{position:absolute;left:0;right:0;bottom:16px;font-size:14px;font-weight:700;color:#8a3c0c}
.ds{position:absolute;left:16px;right:16px;top:360px}
.ds b{display:block;margin:0 6px 8px;font-size:14px;font-weight:800;color:#3a403d}
.d{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:24px;background:#f7f6f3;box-shadow:var(--clay);font-size:15px;font-weight:800;margin-bottom:10px}
.bt{width:44px;height:44px;border-radius:22px;flex:none;display:grid;place-items:center;background:#dcebe6;box-shadow:var(--nho)}.bt img{width:28px;height:28px}
.day{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;background:#f4f4f2;box-shadow:0 -12px 18px -12px rgba(28,32,30,.25);z-index:6}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;display:flex;align-items:center;justify-content:center;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
.lk{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#0a5246;white-space:nowrap}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-ob-ghep"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="san"><img class="rob" src="/assets/rob/nghi.webp" alt=""><img class="ic" src="/assets/icon3d/canh_bao.webp" alt=""><h1>Chưa thấy máy của con</h1><p>Đã chờ 5 phút, máy chưa trả lời</p></div>
<div class="ds"><b>Thử một trong 3 việc</b>
<div class="d"><span class="bt"><img src="/assets/icon3d/wifi.webp" alt=""></span>Máy con có mạng chưa?</div>
<div class="d"><span class="bt"><img src="/assets/icon3d/tai.webp" alt=""></span>Đã cài AiiGrow chưa?</div>
<div class="d"><span class="bt"><img src="/assets/icon3d/dau_hoi.webp" alt=""></span>Mã nhập đúng chưa?</div></div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="bm1-ob-ghep"><span>Thử lại, chờ máy con</span></span><span class="lk" role="button" tabindex="0" data-toi="them-zxu4yvp3">Hỏi AiiGrow</span></div>
</div></body></html>
