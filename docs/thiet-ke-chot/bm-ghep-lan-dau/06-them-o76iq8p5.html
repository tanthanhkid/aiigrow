<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--nho:0 6px 10px -6px rgba(28,32,30,.26),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.14);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ecebe7;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:360px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;z-index:5}
.top h1{flex:1;margin-left:4px;font-size:21px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:22px}.lui svg{width:24px;height:24px;fill:#0a5246}
.cuon{position:absolute;left:0;right:0;top:96px;bottom:0;overflow:hidden;padding:0 16px}
.nho{margin:18px 6px 8px;font-size:13px;font-weight:700;color:#565c59}
.ai{display:flex;gap:10px}
.ai div{flex:1;height:104px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:800;white-space:nowrap}
.ai div.on{background:#dcebe6;box-shadow:0 0 0 2.5px #0f6b5c,var(--clay);color:#0a5246}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.av.b{background:#f5a957}.av.m{background:#5b8fd6}.av.c{background:#ecebe7;box-shadow:var(--lom);color:#0a5246;font-size:26px}
.chon{display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px 14px 14px 12px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay)}
.chon.on{background:#dcebe6;box-shadow:0 0 0 2.5px #0f6b5c,var(--clay);flex-wrap:wrap;row-gap:10px}
.ra{flex:none;width:26px;height:26px;border-radius:50%;background:#0f6b5c;display:grid;place-items:center}.ra svg{width:15px;height:15px;fill:#fff}
.ra.trong{background:#e6e5e1;box-shadow:var(--lom)}
.chon p{flex:1;min-width:0;font-size:16px;font-weight:800;white-space:nowrap}.chon p small{display:block;margin-top:3px;font-size:13px;font-weight:600;color:#3a403d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{width:44px;height:44px;border-radius:22px;flex:none;display:grid;place-items:center;background:#fff;box-shadow:var(--nho)}.bt img{width:28px;height:28px}
.tom{display:flex;gap:6px;width:100%}
.tom span{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:14px;background:rgba(255,255,255,.8);font-size:12.5px;font-weight:800;color:#0a5246;white-space:nowrap}.tom img{width:18px;height:18px}
.tu2{display:flex;align-items:center;gap:10px;margin:18px 6px 0;font-size:13.5px;font-weight:600;color:#3a403d}.tu2 img{width:26px;height:26px}
.rob{display:block;width:150px;margin:14px auto 0}
.day{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 16px;background:#f4f4f2;box-shadow:0 -12px 18px -12px rgba(28,32,30,.25);z-index:6}
.nut{width:100%;position:relative;overflow:hidden;height:58px;border-radius:30px;border:0;display:flex;align-items:center;justify-content:center;font:800 17px Inter,sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 14px 20px -10px rgba(18,22,21,.55),0 4px 8px -4px rgba(18,22,21,.35),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Ghép thêm máy</h1></div>
<div class="cuon">
<p class="nho" style="margin-top:8px">Máy mới của ai?</p>
<div class="ai" role="radiogroup">
<div class="on" role="radio" aria-checked="true"><span class="av b">B</span>Bảo Anh</div>
<div role="radio" aria-checked="false"><span class="av m">M</span>Bảo Minh</div>
<div role="button" tabindex="0"><span class="av c">+</span>Thêm con</div>
</div>
<p class="nho">Cài cho máy mới</p>
<div class="chon on" role="radio" aria-checked="true"><span class="ra"><svg viewBox="0 0 256 256"><path d="M104,208a12,12,0,0,1-8.49-3.51l-56-56a12,12,0,0,1,17-17L104,179l89.51-89.52a12,12,0,0,1,17,17l-98,98A12,12,0,0,1,104,208Z"></path></svg></span><p>Giống Laptop của Bảo Anh<small>Y như máy trước · nên chọn</small></p>
<div class="tom"><span><img src="/assets/icon3d/dongho.webp" alt="">60 phút</span><span><img src="/assets/icon3d/khoa.webp" alt="">4 app</span><span><img src="/assets/icon3d/trang_ngu.webp" alt="">Ngủ 21:30 – 6:30</span></div></div>
<div class="chon" role="radio" aria-checked="false"><span class="ra trong"></span><span class="bt"><img src="/assets/icon3d/banhrang.webp" alt=""></span><p>Cài riêng cho máy này<small>Chỉnh sau khi ghép xong</small></p></div>
<p class="tu2"><img src="/assets/icon3d/lap_lanh.webp" alt="">Không cần chọn loại máy, trang tải tự nhận.</p>
<img class="rob" src="/assets/rob/chi.webp" alt="">
</div>
<div class="day"><button class="nut" type="button"><span>Lấy mã ghép máy mới cho Bảo Anh</span></button></div>
</div></body></html>
