<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;padding:6px 4px 24px;display:flex;background:var(--n);box-shadow:0 -6px 12px -6px var(--lo);z-index:4}
.tab div{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:var(--ink);font-weight:700}.tab .on svg{background:var(--n);box-shadow:var(--sunk)}

.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}.lui svg{width:24px;height:24px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.muc{display:flex;align-items:center;gap:8px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc:first-child{margin-top:4px}
.muc i{width:18px;height:18px;border-radius:9px}
.muc small{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc .v{background:#D9AE57}.muc .x{background:#0A1629}
.ds{padding:4px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg,.chon+.lg{border-top:1px solid rgba(120,98,70,.18)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#E3D9CB;box-shadow:inset 4px 4px 8px rgba(120,98,70,.28),inset -4px -4px 8px #FFFBF5;color:var(--ink)}.ic svg{width:22px;height:22px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg p small{display:block;margin-top:1px;font-size:12.5px;font-weight:400;color:var(--ink2)}
.mui{flex:none;font-size:20px;font-weight:700;color:var(--ink3);padding:0 2px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;color:#0A1629;font-size:16px;font-weight:700;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}

.hd{display:flex;align-items:center;gap:14px;padding:4px 4px 0}
.hd .to{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sh);color:var(--ink)}.hd .to svg{width:36px;height:36px}
.hd h2{font-size:24px;font-weight:800}
.hd small{display:block;margin-top:2px;font-size:13.5px;font-weight:400;color:var(--ink2)}
.hoi{display:flex;align-items:center;margin:22px 6px 10px;font-size:15px;font-weight:800;color:var(--ink)}
.hoi::before{content:"";width:9px;height:13px;margin-right:7px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.den{display:flex;flex-direction:column;gap:10px}
.o{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:24px;background:var(--n);box-shadow:var(--sh)}
.bong{flex:none;width:48px;height:48px;border-radius:50%;opacity:.8}
.o.x .bong{background:#0A1629}.o.v .bong{background:var(--kim)}
.o p{flex:1;min-width:0;font-size:16px;font-weight:800}
.o p small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--ink2);line-height:1.35}
.tick{flex:none;width:26px;height:26px;border-radius:13px;box-shadow:var(--sunk);background:var(--n)}
.o.on .bong{opacity:1}
.o.on .tick{background:var(--kim);box-shadow:none;display:grid;place-items:center;color:#0A1629}.tick svg{width:16px;height:16px;stroke-width:2.2}
.o.on{background:var(--ink);color:#F2EBE3;box-shadow:0 0 0 2px #D9AE57}.o.on p small{color:#e3d9cc}
.cuon .nut{margin-top:22px}
.bo{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;margin-top:12px;border-radius:16px;background:var(--n);box-shadow:var(--sh);font-size:15px;font-weight:700;color:#b42318;white-space:nowrap}
.bo svg{width:20px;height:20px}
.goi{margin-top:8px;text-align:center;font-size:12.5px;font-weight:400;color:var(--ink2)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></div><h1>Web của Bảo Anh</h1></div>
<div class="cuon">
<div class="hd"><span class="to"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m10 9 5 3-5 3z"></path></svg></span><div><h2>youtube.com</h2><small>Hôm nay đã vào 18 phút · Laptop</small></div></div>
<p class="hoi">youtube.com có tính phút không?</p>
<div class="den" role="radiogroup" aria-label="Loại">
<div class="o v on" role="radio" aria-checked="true" tabindex="0"><span class="bong"></span><p>Tính phút<small>Trả bằng sao · 1 sao = 1 phút</small></p><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"></path></svg></span></div>
<div class="o x" role="radio" aria-checked="false" tabindex="0"><span class="bong"></span><p>Không tính phút<small>Vào thoải mái</small></p><span class="tick"></span></div>
</div>
<div class="nut" role="button" tabindex="0" data-toi="bm2-web">Lưu: youtube.com tính phút</div>
<div class="bo" role="button" tabindex="0" data-toi="bm2-web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>Bỏ youtube.com khỏi danh sách</div>
<p class="goi">Bỏ rồi thì con xin lại được.</p>
</div>
</div></body></html>
