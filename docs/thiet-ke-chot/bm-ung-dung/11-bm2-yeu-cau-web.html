<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
*{box-sizing:border-box;margin:0;padding:0}
svg{width:1em;height:1em;flex:none}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;padding:6px 4px 24px;display:flex;background:var(--n);box-shadow:0 -6px 12px -6px var(--lo);z-index:4}
.tab div{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink3);white-space:nowrap}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:var(--ink);font-weight:700}.tab .on svg{background:var(--n);box-shadow:var(--sunk)}

.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}.lui svg{width:24px;height:24px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.muc{display:flex;align-items:center;gap:8px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc:first-child{margin-top:4px}
.muc i{width:18px;height:18px;border-radius:9px}
.muc small{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink2)}
.muc .v{background:#D9AE57}.muc .x{background:#0A1629}
.ds{padding:4px 12px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg,.chon+.lg{border-top:1px solid rgba(120,98,70,.18)}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#E3D9CB;box-shadow:inset 4px 4px 8px rgba(120,98,70,.28),inset -4px -4px 8px #FFFBF5;color:var(--ink)}.ic svg{width:22px;height:22px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg p small{display:block;margin-top:1px;font-size:12.5px;font-weight:400;color:var(--ink2)}
.mui{flex:none;font-size:20px;font-weight:700;color:var(--ink3);padding:0 2px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;color:#0A1629;font-size:16px;font-weight:700;white-space:nowrap;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}

.cuon{padding:4px 16px 40px}
.hd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:28px;background:var(--n);box-shadow:var(--shL)}
.hd .to{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--sunk);color:var(--ink)}.hd .to svg{width:30px;height:30px}
.hd p{flex:1;min-width:0;font-size:20px;font-weight:800;white-space:nowrap}.hd p small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2)}
.cho{flex:none;align-self:flex-start;padding:4px 9px;border-radius:11px;background:var(--ink);color:#F4C76A;font-size:12.5px;font-weight:800;white-space:nowrap}
.rob{display:flex;align-items:center;gap:6px;margin-top:12px}.rob img{flex:none;width:88px;height:88px;object-fit:contain}
.bong{flex:1;min-width:0;padding:12px 14px;border-radius:24px;background:var(--n);box-shadow:var(--sh);font-size:15px;font-weight:700;line-height:20px}
.bong small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2);margin-bottom:2px}
.muc{margin:18px 6px 8px}
.muc::before{content:"";width:9px;height:13px;background:#D9AE57;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.chon{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-radius:20px;font-size:16px;font-weight:800;white-space:nowrap}
.chon+.chon{margin-top:10px}
.chon small{display:block;font-size:12.5px;font-weight:400}
.bi{flex:none;width:30px;height:30px;border-radius:15px}
.bi.v{background:var(--kim)}.bi.x{background:#0A1629}
.chon svg{flex:none;width:30px;height:30px}
.chon.chinh{color:#F2EBE3;background:var(--ink);box-shadow:var(--sh),0 0 0 2px #D9AE57}
.chon.chinh small{color:#e3d9cc}
.chon.phu{background:var(--n);box-shadow:var(--sh)}
.chon.phu small{color:var(--ink2)}
.chon.qua{background:var(--n);box-shadow:var(--sunk);color:var(--ink)}
.chon.qua small{color:var(--ink2)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg></div><h1>Con xin mở</h1></div>
<div class="cuon">
<div class="hd"><span class="to"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></svg></span><p>YouTube<small>Bảo Anh xin · 19:20 · Laptop</small></p><span class="cho">Chờ 20′</span></div>
<div class="rob"><img src="/assets/rob/hoc.webp" alt=""><div class="bong"><small>Bảo Anh nhắn</small>«Con xem video hướng dẫn vẽ ạ»</div></div>
<p class="muc">Thêm YouTube cho Bảo Anh?</p>
<div class="chon chinh" role="button" tabindex="0" data-toi="them-1ypcydle"><span class="bi v"></span><span>Tính phút<small>Thêm vào danh sách · trả bằng sao</small></span></div>
<div class="chon phu" role="button" tabindex="0" data-toi="them-1ypcydle"><span class="bi x"></span><span>Không tính phút<small>Thêm vào danh sách · vào thoải mái</small></span></div>
<div class="chon qua" role="button" tabindex="0" data-toi="them-hppe9qh6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg><span>Bỏ qua<small>Không ghi gì · con xin lại được</small></span></div>
</div>
</div></body></html>
