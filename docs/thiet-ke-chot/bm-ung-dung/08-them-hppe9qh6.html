<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.mid{position:absolute;left:16px;right:16px;top:130px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mid img.r{width:200px;height:200px;object-fit:contain}
.mid h1{margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:30px}
.tin{margin-top:18px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:24px;background:#f7f6f3;box-shadow:var(--clay);text-align:left}
.tin .ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#dcebe6;box-shadow:var(--lom)}.tin .ic img{width:28px;height:28px}
.tin p{flex:1;font-size:14.5px;font-weight:800;line-height:19px}.tin p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 16px 26px}
.nut{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:24px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 50%),linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -8px rgba(18,22,21,.5),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -4px 6px rgba(0,0,0,.35)}
.hoan{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:24px;background:#f7f6f3;color:#0a5246;font-size:15px;font-weight:800;white-space:nowrap;box-shadow:var(--clay)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="mid"><img class="r" src="/assets/rob/xong.webp" alt=""><h1>Đã không cho mở YouTube</h1>
<div class="tin"><span class="ic"><img src="/assets/icon3d/gui.webp" alt=""></span><p>Đã báo cho Bảo Anh<small>«Ba Mẹ chưa cho mở lúc này» · 19:31</small></p></div>
</div>
<div class="bar"><div class="nut" role="button" tabindex="0" data-toi="bm2-ung-dung-may">Xong, về App trên Laptop</div><div class="hoan" role="button" tabindex="0" data-toi="bm2-yeu-cau-web">Hoàn tác, xem lại yêu cầu</div></div>
</div></body></html>
