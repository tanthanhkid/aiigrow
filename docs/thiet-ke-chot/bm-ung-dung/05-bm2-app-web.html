<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.14),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:0 16px 40px;scrollbar-width:none}
.hd{display:flex;align-items:center;gap:14px;padding:4px 4px 0}
.hd .to{flex:none;width:72px;height:72px;border-radius:26px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh)}.hd .to img{width:46px;height:46px}
.hd h2{font-size:24px;font-weight:800}
.hd small{display:block;margin-top:2px;font-size:13.5px;font-weight:600;color:#5a5a5a}
.hoi{display:flex;align-items:center;margin:22px 6px 10px;font-size:15px;font-weight:800;color:#0A1629}
.hoi::before{content:"";width:9px;height:13px;margin-right:7px;background:#0A1629;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.den{display:flex;flex-direction:column;gap:10px}
.o{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:26px;background:#fff;box-shadow:var(--sh)}
.bong{flex:none;width:48px;height:48px;border-radius:50%;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -8px 12px -4px rgba(0,0,0,.25),0 8px 14px -8px rgba(0,0,0,.4);opacity:.35}
.x .bong{background:#7ED957}.v .bong{background:#FF751F}
.o p{flex:1;min-width:0;font-size:16px;font-weight:800}
.o p small{display:block;margin-top:2px;font-size:13px;font-weight:600;color:#5a5a5a;line-height:1.35}
.tick{flex:none;width:26px;height:26px;border-radius:13px;box-shadow:var(--lom);background:#F2EBE3}
.o.on .bong{opacity:1}
.o.on .tick{background:#0A1629;box-shadow:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.v.on{background:#ffeadb;box-shadow:0 0 0 3px #FF751F,var(--sh)}
.nut{display:flex;align-items:center;justify-content:center;height:52px;margin-top:22px;border-radius:26px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.bo{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;margin-top:12px;border-radius:24px;background:#fff;box-shadow:var(--sh);font-size:15px;font-weight:800;color:#b81f1f;white-space:nowrap}
.bo img{width:22px;height:22px}
.goi{margin-top:8px;text-align:center;font-size:12.5px;font-weight:600;color:#5a5a5a}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-g7g1cel5"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>App của Bảo Anh</h1></div>
<div class="cuon">
<div class="hd"><span class="to"><img src="/assets/icon3d/game.webp" alt=""></span><div><h2>Roblox</h2><small>Hôm nay đã chơi 39 phút · Laptop</small></div></div>
<p class="hoi">Roblox có tính phút không?</p>
<div class="den" role="radiogroup" aria-label="Loại">
<div class="o v on" role="radio" aria-checked="true" tabindex="0"><span class="bong"></span><p>Tính phút<small>Trả bằng sao · 1 sao = 1 phút</small></p><span class="tick">✓</span></div>
<div class="o x" role="radio" aria-checked="false" tabindex="0"><span class="bong"></span><p>Không tính phút<small>Vào thoải mái</small></p><span class="tick"></span></div>
</div>
<div class="nut" role="button" tabindex="0" data-toi="them-g7g1cel5">Lưu: Roblox tính phút</div>
<div class="bo" role="button" tabindex="0" data-toi="them-g7g1cel5"><img src="/assets/icon3d/tru.webp" alt="">Bỏ Roblox khỏi danh sách</div>
<p class="goi">Bỏ rồi thì con xin lại được.</p>
</div>
</div></body></html>
