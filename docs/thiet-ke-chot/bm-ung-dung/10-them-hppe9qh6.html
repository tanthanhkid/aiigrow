<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.14),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.mid{position:absolute;left:16px;right:16px;top:110px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mid img.r{width:190px;height:190px;object-fit:contain}
.mid h1{margin-top:4px;font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:30px;white-space:nowrap}
.ds{margin-top:18px;width:100%;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--sh);text-align:left}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg{border-top:1.5px solid #efe7dd}
.ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom)}.ic img{width:24px;height:24px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800}.lg p small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.nut{width:100%;display:flex;align-items:center;justify-content:center;height:52px;margin-top:22px;border-radius:26px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut.phu{height:48px;margin-top:10px;color:#0A1629;background:#fff;box-shadow:var(--sh);font-size:15px}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div></div>
<div class="mid"><img class="r" src="/assets/rob/cho.webp" alt="Grow"><h1>Đã bỏ qua YouTube</h1>
<div class="ds">
<div class="lg"><span class="ic"><img src="/assets/icon3d/gui.webp" alt=""></span><p>Đã báo Bảo Anh trên Laptop<small>«Ba Mẹ chưa cho lúc này» · 19:41</small></p></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/tro_lai.webp" alt=""></span><p>Không ghi gì vào danh sách<small>Con xin lại được bất cứ lúc nào</small></p></div>
</div>
<div class="nut" role="button" tabindex="0" data-toi="bm2-ung-dung-may">Xong</div>
<div class="nut phu" role="button" tabindex="0" data-toi="bm2-yeu-cau-web">Hoàn tác, xem lại lời xin</div>
</div>
</div></body></html>
