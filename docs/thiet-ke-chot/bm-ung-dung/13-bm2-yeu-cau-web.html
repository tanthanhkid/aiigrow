<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.hd .to{flex:none;width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.hd .to img{width:36px;height:36px}
.hd p{flex:1;min-width:0;font-size:20px;font-weight:800;white-space:nowrap}.hd p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.cho{flex:none;align-self:flex-start;padding:4px 9px;border-radius:11px;background:#f9e7d2;color:#8a3c0c;font-size:12.5px;font-weight:800;white-space:nowrap}
.rob{display:flex;align-items:center;gap:6px;margin-top:12px}.rob img{flex:none;width:88px;height:88px;object-fit:contain}
.bong{flex:1;min-width:0;padding:12px 14px;border-radius:24px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:700;line-height:20px;text-wrap:balance}
.bong small{display:block;font-size:12.5px;font-weight:600;color:#565c59;margin-bottom:2px}
.muc{margin:18px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.chon{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 16px;border-radius:28px;font-size:16px;font-weight:800;white-space:nowrap}
.chon+.chon{margin-top:10px}
.chon img{flex:none;width:28px;height:28px}
.chon small{display:block;font-size:12.5px;font-weight:600}
.chon.chinh{color:#fff;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.chon.chinh small{color:#cfd6d3}
.chon.phu{background:#fff;box-shadow:var(--clay)}
.chon.phu small{color:#565c59}
.chon.khong{color:#b42318;background:#fff;box-shadow:var(--clay)}
.chon.khong small{color:#565c59}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Con xin mở</h1></div>
<div class="cuon">
<div class="hd"><span class="to"><img src="/assets/icon3d/web.webp" alt=""></span><p>YouTube<small>Bảo Anh xin 30 phút · 19:20 · Laptop</small></p><span class="cho">Chờ 20′</span></div>
<div class="rob"><img src="/assets/rob/hoc.webp" alt=""><div class="bong"><small>Bảo Anh nhắn</small>«Con xem video hướng dẫn vẽ ạ»</div></div>
<p class="muc">Ba Mẹ trả lời</p>
<div class="chon chinh" role="button" tabindex="0" data-toi="them-1ypcydle"><img src="/assets/icon3d/dong_ho_cat.webp" alt=""><span>Cho 30 phút YouTube<small>Không tính giờ</small></span></div>
<div class="chon phu" role="button" tabindex="0" data-toi="them-1ypcydle"><img src="/assets/icon3d/tick.webp" alt=""><span>Cho mở, tính giờ<small>Trừ vào giờ chơi</small></span></div>
<div class="chon khong" role="button" tabindex="0" data-toi="them-hppe9qh6"><img src="/assets/icon3d/x.webp" alt=""><span>Không cho<small>Grow báo cho Bảo Anh ngay</small></span></div>
</div>
</div></body></html>
