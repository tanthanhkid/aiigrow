<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sh:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--lom:inset 0 5px 10px rgba(10,22,41,.14),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.mid{position:absolute;left:16px;right:16px;top:104px}
.rob{display:flex;align-items:center;gap:6px}.rob img{flex:none;width:112px;height:112px;object-fit:contain}
.bong{flex:1;min-width:0;padding:12px 14px;border-radius:24px;background:#fff;box-shadow:var(--sh);font-size:15px;font-weight:800;line-height:20px}
.bong small{display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:#5a5a5a;line-height:17px}
.ds{margin-top:16px;padding:4px 12px;border-radius:28px;background:#fff;box-shadow:var(--sh)}
.lg{display:flex;align-items:center;gap:10px;min-height:66px}
.lg+.lg{border-top:1.5px solid #efe7dd}
.ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom)}.ic img{width:26px;height:26px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lg p small{display:block;font-size:12px;font-weight:600;color:#5a5a5a}
.them{flex:none;display:flex;align-items:center;height:40px;padding:0 12px;border-radius:20px;background:linear-gradient(#1b2b47,#0A1629);color:#fff;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 10px 16px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut{display:flex;align-items:center;justify-content:center;height:52px;margin-top:22px;border-radius:26px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Lời xin đã bỏ qua</h1></div>
<div class="mid">
<div class="rob"><img src="/assets/rob/cho.webp" alt="Grow"><div class="bong">Bỏ qua là chưa thêm, không ghi gì.<small>Con xin lại, hoặc Ba Mẹ bấm «Thêm luôn» để cho ngay.</small></div></div>
<div class="ds">
<div class="lg"><span class="ic"><img src="/assets/icon3d/game.webp" alt=""></span><p>Minecraft<small>Bảo Anh · hôm qua 20:05</small></p><span class="them" role="button" tabindex="0" data-toi="them-vw103x88">Thêm luôn</span></div>
<div class="lg"><span class="ic"><img src="/assets/icon3d/web.webp" alt=""></span><p>tiktok.com<small>Bảo Anh · 12/11 17:40</small></p><span class="them" role="button" tabindex="0" data-toi="them-yzl99l3y">Thêm luôn</span></div>
</div>
<div class="nut" role="button" tabindex="0" data-toi="bm2-ung-dung-may">Xong, về App &amp; web</div>
</div>
</div></body></html>
