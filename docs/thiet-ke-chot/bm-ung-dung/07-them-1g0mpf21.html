<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.mid{position:absolute;left:16px;right:16px;top:110px;display:flex;flex-direction:column;align-items:center}
.mid img.r{width:150px;height:150px;object-fit:contain}
.bong{margin-top:4px;padding:12px 16px;border-radius:22px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:800;line-height:20px;text-align:center}
.ds{margin-top:18px;width:100%;padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;min-height:68px}
.dong+.dong{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:32px;height:32px}
.dong p{flex:1;font-size:16px;font-weight:800}
.tg{flex:none;padding:4px 10px;border-radius:11px;background:#dcebe6;color:#0a5246;font-size:12px;font-weight:800;white-space:nowrap}
.gc{margin-top:12px;font-size:12.5px;font-weight:600;color:#565c59;text-align:center}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 16px 26px}
.nut{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:24px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 50%),linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -8px rgba(18,22,21,.5),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -4px 6px rgba(0,0,0,.35)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Luôn chặn</h1></div>
<div class="mid"><img class="r" src="/assets/rob/canh-trong.webp" alt=""><div class="bong">Rob luôn chặn 3 thứ này trên mọi máy của con</div>
<div class="ds">
<div class="dong"><span class="ic"><img src="/assets/icon3d/mat.webp" alt=""></span><p>Web người lớn</p><span class="tg">Luôn chặn</span></div>
<div class="dong"><span class="ic"><img src="/assets/icon3d/xu.webp" alt=""></span><p>Cờ bạc</p><span class="tg">Luôn chặn</span></div>
<div class="dong"><span class="ic"><img src="/assets/icon3d/khien.webp" alt=""></span><p>Bạo lực</p><span class="tg">Luôn chặn</span></div>
</div>
<p class="gc">Không tắt được, kể cả Ba Mẹ.</p>
</div>
<div class="bar"><div class="nut" role="button" tabindex="0" data-toi="bm2-ung-dung-may">Xong, về App trên Laptop</div></div>
</div></body></html>
