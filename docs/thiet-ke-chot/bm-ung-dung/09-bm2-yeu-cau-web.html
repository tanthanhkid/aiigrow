<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 24px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.hd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.hd .to{flex:none;width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.hd .to img{width:38px;height:38px}
.hd b{display:block;font-size:20px;font-weight:800}.hd small{font-size:12.5px;font-weight:600;color:#565c59}
.rob{display:flex;align-items:center;gap:8px;margin-top:10px}.rob img{flex:none;width:84px;height:84px;object-fit:contain}
.bong{flex:1;padding:12px 14px;border-radius:22px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:700;line-height:20px}
.bong small{display:block;font-size:12px;font-weight:600;color:#565c59;margin-bottom:2px}
.ba{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ba div{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:26px;font-size:16px;font-weight:800;line-height:19px}
.ba img{flex:none;width:32px;height:32px}
.ba small{display:block;font-size:12px;font-weight:600;opacity:.85}
.ba .x{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0) 50%),#0f6b5c;color:#fff;box-shadow:var(--clay)}
.ba .c{background:#fbecc0;color:#6e4300;box-shadow:var(--clay)}
.ba .d{background:#f7f6f3;color:#b42318;box-shadow:var(--clay)}
.gc{margin:10px 6px 0;text-align:center;font-size:12.5px;font-weight:600;color:#565c59}
</style></head>
<body data-lk-sua=""><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Con xin mở</h1></div>
<div class="cuon">
<div class="hd"><span class="to"><img src="/assets/icon3d/web.webp" alt=""></span><div><b>YouTube</b><small>Bảo Anh xin lúc 19:20 · 30 phút</small></div></div>
<div class="rob"><img src="/assets/rob/hoc.webp" alt=""><div class="bong"><small>Bảo Anh nhắn</small>«Con xem video hướng dẫn vẽ ạ»</div></div>
<div class="ba">
<div class="x" role="button" tabindex="0" data-toi="them-1ypcydle"><img src="/assets/icon3d/tick.webp" alt=""><span>Cho mở, tính vào 18 phút còn lại<small>Hôm nay đã chơi 42/60 phút</small></span></div>
<div class="c" role="button" tabindex="0" data-toi="them-1ypcydle"><img src="/assets/icon3d/dong_ho_cat.webp" alt=""><span>Cho thêm 30 phút hôm nay<small>Không trừ vào 18 phút còn lại</small></span></div>
<div class="d" role="button" tabindex="0" data-toi="them-hppe9qh6"><img src="/assets/icon3d/x.webp" alt=""><span>Không cho<small>Báo cho Bảo Anh ngay</small></span></div>
</div>
<p class="gc">Hôm nay Bảo Anh đã chơi 42/60 phút</p>
</div>
</div></body></html>
