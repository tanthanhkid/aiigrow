<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 8px 0;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 120px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.hd{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.hd .to{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay)}.hd .to img{width:56px;height:56px}
.hd b{margin-top:10px;font-size:22px;font-weight:800}.hd small{font-size:13px;font-weight:600;color:#565c59}
.ds{margin-top:14px;padding:4px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.dong{display:flex;align-items:center;gap:12px;min-height:66px}
.dong+.dong{border-top:1.5px solid #ecebe7}
.ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.ic img{width:28px;height:28px}
.dong p{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:19px}.dong p small{display:block;font-size:12.5px;font-weight:600;color:#565c59}
.gat{flex:none;width:52px;height:32px;border-radius:16px;background:#0f6b5c;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.gat::after{content:"";position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 14px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;font-size:14px;font-weight:800;background:#ecebe7;color:#3a403d;box-shadow:var(--lom)}
.chip.on{background:#0f6b5c;color:#fff;box-shadow:var(--clay)}
.step{display:flex;align-items:center;gap:8px}.step span{width:44px;height:44px;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:var(--clay)}.step b{min-width:74px;text-align:center;font-size:16px;font-weight:800}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 16px 26px;background:linear-gradient(rgba(244,244,242,0),#f4f4f2 28%)}
.nut{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:24px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.05) 46%,rgba(255,255,255,0) 50%),linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -8px rgba(18,22,21,.5),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -4px 6px rgba(0,0,0,.35)}
.cam{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:24px;background:#f9e7d2;color:#8a3c0c;font-size:15px;font-weight:800;white-space:nowrap;box-shadow:var(--clay)}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm2-ung-dung-may"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Roblox</h1></div>
<div class="cuon">
<div class="hd"><div class="to"><img src="/assets/icon3d/game.webp" alt=""></div><b>Roblox</b><small>Bảo Anh chơi 30 phút hôm nay</small></div>
<div class="ds">
<div class="dong"><span class="ic"><img src="/assets/icon3d/dongho.webp" alt=""></span><p>Tính vào giờ chơi<small>Tổng hôm nay 42/60 phút</small></p><span class="gat" role="button" tabindex="0" aria-label="Tính vào giờ chơi, đang bật"></span></div>
<div class="dong"><span class="ic"><img src="/assets/icon3d/dong_ho_cat.webp" alt=""></span><p>Tối đa mỗi ngày<small>Roblox chỉ chơi được tới mức này</small></p><div class="step"><span role="button" tabindex="0" aria-label="Giảm">−</span><b>60 phút</b><span role="button" tabindex="0" aria-label="Tăng">+</span></div></div>
</div>
<p style="margin:18px 6px 6px;font-size:15px;font-weight:800;color:#3a403d">Áp cho</p>
<div class="chips"><span class="chip on" role="button" tabindex="0">Bảo Anh ✓</span><span class="chip" role="button" tabindex="0">Bảo Minh</span></div>
</div>
<div class="bar"><div class="nut" role="button" tabindex="0" data-toi="bm2-ung-dung-may">Lưu cho Roblox của Bảo Anh</div><div class="cam" role="button" tabindex="0" data-toi="them-f6uevhi9">Không cho dùng app này</div></div>
</div></body></html>
