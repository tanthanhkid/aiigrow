:root{--xanh:#2f9e5f;--xanh-n:#e8f5ed;--xanh-d:#1f6e42;--chu:#1f2a37;--chu2:#5f6b7a;--chu3:#9aa3ae;--nen:#fbf8f2;--vien:#ece7dc;--tron:'Nunito','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}

.v{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:2px 16px 14px;overflow:hidden}
.v>*{flex:none}.gian{flex:1!important}
.dau{display:flex;align-items:center;gap:10px;min-height:52px}

.lui svg{width:20px;height:20px;fill:var(--chu)}
.rob{display:block;object-fit:contain;flex:none}
.noi{position:relative;border-radius:22px;padding:12px 16px;background:#fff;text-align:center;font-weight:800;font-size:18px;line-height:24px;color:var(--chu);border:1px solid var(--vien);box-shadow:0 2px 6px rgba(30,30,20,.06);margin:0 10px}
.noi:after{content:'';position:absolute;left:50%;top:-9px;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.the{border-radius:24px;padding:16px;background:#fff;border:1px solid var(--vien);box-shadow:0 2px 8px rgba(30,30,20,.06)}
.hang{display:flex;align-items:center;gap:12px}.hang .c{flex:1;min-width:0}
.ic3{width:56px;height:56px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;background:#f6f3ec}
.ic3 img{width:40px;height:40px}
.t1{font-weight:800;font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:14px;line-height:19px;color:var(--chu2);font-weight:700;margin-top:1px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:26px;font-weight:800;font-size:17px;line-height:1;white-space:nowrap;cursor:pointer;color:var(--chu);background:#fff;border:1px solid var(--vien);box-shadow:0 2px 6px rgba(30,30,20,.08)}
.b img{width:26px;height:26px}
.b.la{background:var(--xanh);color:#fff;border:0;box-shadow:0 3px 8px rgba(47,158,95,.28)}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;font-weight:800;font-size:15px;color:var(--chu2);cursor:pointer;white-space:nowrap}
.thu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.thu .tt{width:100%;text-align:center;font-weight:900;font-size:11px;letter-spacing:.5px;color:#b8611a}
.thu span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;border:1.5px dashed #f0a868;background:#fff6ec;color:#8a3c0c;font-weight:800;font-size:13px;white-space:nowrap;cursor:pointer}
