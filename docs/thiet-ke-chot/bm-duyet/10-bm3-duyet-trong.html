<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiiGrow — Chờ duyệt trống</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--n:0 6px 10px -6px rgba(28,32,30,.26),0 2px 3px -1px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.14);
--lom:inset 0 4px 8px rgba(40,44,42,.13),inset 0 -1.5px 0 rgba(255,255,255,.95)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.dt{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2;display:flex;flex-direction:column}
.dt:before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e6ece9,#f4f4f2)}
.sb{position:relative;flex:none;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;font-weight:700;font-size:15px}
.dau{position:relative;flex:none;padding:8px 20px 4px}
.dau h1{font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.5px}
.dau p{font-size:14px;line-height:20px;color:#565c59}
.loc{position:relative;flex:none;display:flex;gap:8px;padding:8px 16px 4px}
.loc div{min-height:44px;padding:0 14px;border-radius:22px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap;background:#ecebe7;color:#3a403d;box-shadow:var(--lom)}
.loc .on{background:#0f1312;color:#fff;box-shadow:0 8px 14px -8px rgba(15,19,18,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.loc em{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.22)}
.loc div:not(.on) em{background:#fff;color:#565c59}
.giua{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 30px;text-align:center}
.rob{width:160px;height:160px;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(28,32,30,.16))}
.giua h2{margin-top:10px;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.3px}
.giua p{margin-top:6px;font-size:14.5px;line-height:21px;color:#3a403d}
.tt{margin-top:16px;padding:8px 14px;border-radius:16px;background:#fbecc0;color:#6e4300;font-size:13.5px;font-weight:800;white-space:nowrap;box-shadow:var(--n)}
.nut{margin-top:20px;min-height:52px;padding:0 24px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;color:#fff;white-space:nowrap;
background:linear-gradient(#2e3533,#121615);box-shadow:0 10px 16px -8px rgba(15,19,18,.5),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 5px rgba(0,0,0,.4)}
.xem{margin-top:6px;min-height:44px;padding:0 12px;display:flex;align-items:center;font-size:15px;font-weight:800;color:#0a5246;cursor:pointer}
.tab{position:relative;flex:none;display:flex;height:84px;padding:6px 8px 26px;background:#f7f6f3;box-shadow:0 -1px 0 #e6e5e1,0 -10px 20px -14px rgba(28,32,30,.3)}
.tab div{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:#7a7f7c}
.tab svg{width:24px;height:24px;fill:#9a9e9b}
.tab .on{color:#0a5246}.tab .on svg{fill:#0f6b5c}
</style></head>
<body>
<div class="dt">
  <div class="sb"><span>19:40</span><span>●●● 5G</span></div>
  <div class="dau"><h1>Chờ duyệt</h1><p>Cả nhà không còn việc chờ</p></div>
  <div class="loc" role="tablist" aria-label="Lọc theo con">
    <div class="on" role="tab" tabindex="0" aria-selected="true">Cả nhà<em>0</em></div>
    <div role="tab" tabindex="0" aria-selected="false">Bảo Anh<em>0</em></div>
    <div role="tab" tabindex="0" aria-selected="false">Bảo Minh<em>0</em></div>
  </div>
  <div class="giua">
    <img class="rob" src="/assets/rob/chi.webp" alt="">
    <h2>Ba Mẹ duyệt xong hết rồi!</h2>
    <p>Khi Bảo Anh hoặc Bảo Minh nộp nhiệm vụ, xin thêm giờ hay xin app mới, AiiGrow báo Ba Mẹ ngay.</p>
    <div class="tt">Ví Bảo Anh · 160 điểm</div>
    <div class="nut" role="button" tabindex="0" data-toi="bm3-nv-giao">+ Giao một nhiệm vụ</div>
    <div class="xem" role="button" tabindex="0" data-toi="bm3-duyet-thong-bao">Xem việc đã xử lý</div>
  </div>
  <div class="tab">
    <div role="button" tabindex="0" data-toi="bm2-trang-chu"><svg viewBox="0 0 256 256"><path d="M128 32 32 112v112h64v-64h64v64h64V112Z"></path></svg>Trang chủ</div>
    <div class="on" role="button" tabindex="0"><svg viewBox="0 0 256 256"><path d="M128 24a104 104 0 1 0 104 104A104 104 0 0 0 128 24Zm-16 152-48-48 17-17 31 31 63-63 17 17Z"></path></svg>Chờ duyệt</div>
    <div role="button" tabindex="0" data-toi="bm3-nv-qua"><svg viewBox="0 0 256 256"><path d="M128 20l31 66 72 8-54 49 15 71-64-37-64 37 15-71-54-49 72-8Z"></path></svg>Nhiệm vụ</div>
    <div role="button" tabindex="0" data-toi="bm2-gia-dinh"><svg viewBox="0 0 256 256"><path d="M96 128a44 44 0 1 0-44-44 44 44 0 0 0 44 44Zm72 0a36 36 0 1 0-36-36 36 36 0 0 0 36 36ZM16 216c0-40 36-64 80-64s80 24 80 64Zm164 0c0-24-8-44-24-58 52-4 84 20 84 58Z"></path></svg>Gia đình</div>
  </div>
</div>
</body></html>
