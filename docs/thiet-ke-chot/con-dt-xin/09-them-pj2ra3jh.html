<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--noi:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--noi2:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:375px;height:812px;overflow:hidden;background:var(--n)}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.si{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.k{position:relative;width:375px;height:812px;overflow:hidden;display:flex;flex-direction:column;background:var(--n)}
.sb{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:600 15px/1 -apple-system,'SF Pro Text','Segoe UI',sans-serif}.sb svg{height:12px;fill:currentColor;margin-left:6px}
.v{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:2px 16px 14px;overflow:hidden}.v>*{flex:none}
.dau{display:flex;align-items:center;gap:10px}.c{flex:1;min-width:0}
.tl{font-weight:800;font-size:26px;line-height:32px;letter-spacing:-.4px;white-space:nowrap}.phu{font-size:14.5px;line-height:20px;color:var(--ink3)}
.the{position:relative;padding:16px;border-radius:24px;background:var(--n);box-shadow:var(--noi2)}
.the.navy{background:#0A1629;color:#F2EBE3;box-shadow:8px 8px 18px var(--lo),-6px -6px 14px var(--hi),inset 0 0 0 1px rgba(244,199,106,.35)}
.hang{display:flex;align-items:center;gap:12px}
.b{display:flex;align-items:center;justify-content:center;gap:9px;height:48px;border-radius:16px;font-weight:700;font-size:15.5px;white-space:nowrap;cursor:pointer;color:var(--ink);background:var(--n);box-shadow:var(--noi)}.b .si{width:20px;height:20px}
.b.kim{background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.the.navy .b.kim{box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.the.navy .b.vien{background:rgba(255,255,255,.07);color:#F2EBE3;box-shadow:inset 0 0 0 1.5px rgba(244,199,106,.55)}
.vong{position:relative;width:104px;height:104px;border-radius:50%;flex:none;background:conic-gradient(#F4C76A 0 30%,rgba(255,255,255,.1) 30% 100%)}.vong:before{content:'';position:absolute;inset:10px;border-radius:50%;background:#0A1629}
.vong>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.vong b{font-size:42px;line-height:44px;font-weight:800;background:var(--kim);-webkit-background-clip:text;background-clip:text;color:transparent}.vong small{font-weight:600;font-size:13px;color:rgba(242,235,227,.8)}
.ic3{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--n);box-shadow:var(--lom)}.ic3 .si{width:26px;height:26px}
.hh2{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.tab{flex:none;margin:0 12px 14px;height:72px;border-radius:26px;display:flex;gap:4px;padding:7px;background:var(--n);box-shadow:var(--noi2)}
.tab div{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-weight:500;font-size:12px;color:#8a8075;cursor:pointer;white-space:nowrap}.tab div .si{width:24px;height:24px}
.tab div.dang{box-shadow:var(--lom);color:var(--ink);font-weight:700}.tab div.dang .si{color:#9C7428}
.tab i{position:absolute;right:10px;top:4px;min-width:20px;height:20px;border-radius:10px;background:var(--kim);color:var(--ink);font:700 11px/20px 'Be Vietnam Pro',system-ui,sans-serif;font-style:normal;text-align:center}
.chip-be{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 4px;border-radius:19px;background:var(--n);box-shadow:var(--noi);font-weight:700;font-size:15px;white-space:nowrap}.chip-be .si{width:14px;height:14px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0A1629;color:#F4C76A;font-weight:800;font-size:14px}
.lui{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--n);box-shadow:var(--noi)}.lui .si{width:22px;height:22px}
.tabx{height:46px;padding:5px;border-radius:16px;box-shadow:var(--lom);display:flex;gap:6px}.tabx a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;font-size:14.5px;color:#6d6359;cursor:pointer}.tabx a.on{background:#0A1629;color:#F4C76A;font-weight:700}.tabx .si{width:18px;height:18px}
.nho{font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:-6px}
.ds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.app{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:14px;box-shadow:var(--lom);font-weight:600;font-size:14.5px}.app.on{box-shadow:var(--noi),inset 0 0 0 1.5px #D9AE57;font-weight:700}
.app i{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:800 12px/1 -apple-system,'Segoe UI',sans-serif;font-style:normal;color:#fff}.app .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#0A1629;color:#F4C76A}.app .chk .si{width:14px;height:14px;stroke-width:2.4}
.o{height:48px;border-radius:14px;box-shadow:var(--lom);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px}.o .si{width:18px;height:18px;color:var(--ink3)}.o b{font-weight:600}.o .con{width:1.5px;height:20px;background:var(--ink);margin-left:-8px}
.goiy{font-size:12.5px;line-height:17px;color:var(--ink3);margin-top:-6px}
.chip{display:flex;gap:8px;flex-wrap:wrap}.chip span{height:30px;padding:0 12px;border-radius:15px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;box-shadow:var(--lom);color:var(--ink2)}.chip .si{width:15px;height:15px}
.day{position:absolute;left:16px;right:16px;bottom:30px}</style></head><body><div class="k"><div class="sb"><span>19:30</span><span><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5" width="3" height="7" rx="1"></rect><rect x="10" y="2" width="3" height="10" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"></rect><rect x="2" y="2" width="15" height="8" rx="1.6"></rect><rect x="23.5" y="4" width="2" height="4" rx="1"></rect></svg></span></div><div class="v" style="gap:16px"><div class="dau" style="gap:12px"><a class="lui" data-toi="them-us1kc173"><svg class="si" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></a><div class="tl" style="font-size:23px">Xin thêm app / web</div></div>
<div class="phu" style="margin-top:-6px">Chọn app trên điện thoại hoặc gõ địa chỉ trang web</div><div class="tabx"><a class="on" data-toi="them-pj2ra3jh"><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>App trên máy</a><a class="" data-toi="them-euz1k35r"><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 3.6 5.7 3.6 9s-1.1 6.3-3.6 9c-2.5-2.7-3.6-5.7-3.6-9S9.5 5.7 12 3z"></path></svg>Trang web</a></div><div class="nho">App trên điện thoại</div><div class="ds"><div class="app on"><i style="background:#e1251b">▶</i>YouTube<span class="chk"><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M6.5 12.5l3.6 3.6 7.4-8"></path></svg></span></div><div class="app"><i style="background:#d9d9d9;color:#222">◆</i>Roblox</div><div class="app"><i style="background:#5b8d3a">M</i>Minecraft</div><div class="app"><i style="background:#f7a823">S</i>Scratch</div><div class="app"><i style="background:#0068ff">Z</i>Zalo</div><div class="app"><i style="background:#111">C</i>CapCut</div></div><div class="o" style="color:#9a8f83"><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M4 5h16v11H9l-5 4z"></path></svg>Nhắn Ba Mẹ: con xem video vẽ tranh ạ</div>
<div class="nho">Ba Mẹ sẽ chọn nhóm</div><div class="chip"><span><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"></path></svg>Tính phút · 1 sao = 1 phút</span><span><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8.5 12.2l2.4 2.4 4.8-5"></path></svg>Không tính phút</span></div></div>
<div class="day"><div class="b kim" style="height:52px;font-size:16px" data-toi="cdt-yeu-cau"><svg class="si " viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M21 3L10 14M21 3l-7 18-4-8-8-4z"></path></svg>Xin Ba Mẹ thêm YouTube</div></div></div></body></html>
