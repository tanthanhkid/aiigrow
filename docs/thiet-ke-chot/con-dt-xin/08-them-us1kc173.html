<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=375"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--noi:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--noi2:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:375px;height:812px;overflow:hidden;background:var(--n)}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.si{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.the{position:relative;padding:16px;border-radius:24px;background:var(--n);box-shadow:var(--noi2)}

.hang{display:flex;align-items:center;gap:12px}

.ic3{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--n);box-shadow:var(--lom)}.ic3 .si{width:26px;height:26px}
.hh2{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi)}
.tab{flex:none;margin:0 12px 14px;height:72px;border-radius:26px;display:flex;gap:4px;padding:7px;background:var(--n);box-shadow:var(--noi2)}
.tab div{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-weight:500;font-size:12px;color:#8a8075;cursor:pointer;white-space:nowrap}.tab div .si{width:24px;height:24px}
.tab div.dang{box-shadow:var(--lom);color:var(--ink);font-weight:700}.tab div.dang .si{color:#9C7428}
.tab i{position:absolute;right:10px;top:4px;min-width:20px;height:20px;border-radius:10px;background:var(--kim);color:var(--ink);font:700 11px/20px 'Be Vietnam Pro',system-ui,sans-serif;font-style:normal;text-align:center}
.chip-be{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 4px;border-radius:19px;background:var(--n);box-shadow:var(--noi);font-weight:700;font-size:15px;white-space:nowrap}.chip-be .si{width:14px;height:14px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#0A1629;color:#F4C76A;font-weight:800;font-size:14px}
