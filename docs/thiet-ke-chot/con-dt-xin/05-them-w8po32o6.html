:root{--xanh:#2f9e5f;--xanh-n:#e8f5ed;--xanh-d:#1f6e42;--vang:#f5b82e;--vang-n:#fff5d9;--vang-d:#8a5a00;--chu:#1f2a37;--chu2:#5f6b7a;--chu3:#9aa3ae;--nen:#fbf8f2;--vien:#ece7dc;--tron:'Nunito','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}

.b{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 22px;border-radius:26px;font-weight:800;font-size:17px;line-height:1;white-space:nowrap;cursor:pointer;color:var(--chu);background:#fff;border:1px solid var(--vien);box-shadow:0 2px 6px rgba(30,30,20,.08)}
.b img{width:26px;height:26px}
.b.la{background:var(--xanh);color:#fff;border:0;box-shadow:0 3px 8px rgba(47,158,95,.28)}
.nhan{font-weight:800;font-size:14px;color:var(--chu2);text-align:center}
.lua{display:flex;gap:8px}
.lua span{flex:1;min-height:48px;padding:6px 10px;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:15px;line-height:19px;color:var(--chu);background:#fff;border:1px solid var(--vien)}
.lua span.chon{background:var(--xanh);color:#fff;border-color:var(--xanh)}
