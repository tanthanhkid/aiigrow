<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--nho:0 6px 10px -6px rgba(28,32,30,.26),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(40,44,42,.14);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.sau{position:absolute;inset:0;filter:blur(6px);background:linear-gradient(#e3efeb,#f4f4f2 300px)}
.sau .t{position:absolute;left:24px;top:58px;width:220px;height:24px;border-radius:8px;background:#c9d6d2}
.sau .k{position:absolute;left:16px;right:16px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.sau .k.n{background:#d6e9e2}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.38);z-index:6}
.bang{position:absolute;left:0;right:0;bottom:0;height:560px;padding:10px 16px 0;border-radius:34px 34px 0 0;background:#f4f4f2;box-shadow:0 -14px 30px -10px rgba(15,19,18,.35),inset 0 1.5px 0 #fff;z-index:7}
.keo{width:44px;height:5px;margin:0 auto 12px;border-radius:3px;background:#c9c8c3}
.dau2{display:flex;align-items:center;gap:10px}
.dau2 .ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}
.dau2 img{width:26px;height:26px}
.dau2 b{font-size:20px;font-weight:800;white-space:nowrap}
.tab2{display:flex;gap:4px;margin-top:14px;padding:5px;border-radius:24px;background:#ecebe7;box-shadow:var(--lom)}
.tab2 div{flex:1;height:56px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#565c59}
.tab2 small{font-size:12px;font-weight:700}
.tab2 b{font-size:20px;font-weight:800}
.tab2 div.on{background:#f7f6f3;box-shadow:var(--nho);color:#0a5246}
.banh{position:relative;display:flex;justify-content:center;gap:56px;height:200px;margin-top:14px;border-radius:26px;background:#f7f6f3;box-shadow:var(--clay);overflow:hidden}
.banh::before{content:"";position:absolute;left:12px;right:12px;top:80px;height:40px;border-radius:14px;background:#dcebe6}
.banh::after{content:"";position:absolute;inset:0;background:linear-gradient(#f7f6f3,rgba(247,246,243,0) 38%,rgba(247,246,243,0) 62%,#f7f6f3)}
.banh .hai{position:absolute;left:50%;top:80px;line-height:40px;font-size:26px;font-weight:800;transform:translateX(-50%);z-index:1}
.cot{position:relative;display:flex;flex-direction:column;align-items:center;width:56px}
.cot span{height:40px;line-height:40px;font-size:22px;font-weight:600;color:#565c59}
.cot span.giua{font-size:26px;font-weight:800;color:#0f1312}
.muc{margin:16px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.ngay{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ngay span{height:44px;display:grid;place-items:center;border-radius:16px;background:#0f6b5c;color:#fff;font-size:13.5px;font-weight:800;box-shadow:0 8px 14px -8px rgba(15,107,92,.7),inset 0 1.5px 0 rgba(255,255,255,.3)}
.day{position:absolute;left:16px;right:16px;bottom:24px}
.nut{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
</style></head>
<body><div class="app">
<div class="sau" aria-hidden="true"><span class="t"></span><span class="k n" style="top:104px;height:268px"></span><span class="k" style="top:420px;height:150px"></span></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng"></div>
<div class="bang" role="dialog" aria-label="Chọn giờ ngủ">
<div class="keo"></div>
<div class="dau2"><span class="ic"><img src="/assets/icon3d/trang_ngu.webp" alt=""></span><b>Giờ ngủ của Bảo Anh</b></div>
<div class="tab2"><div class="on" role="tab" aria-selected="true"><small>Máy khoá lúc</small><b>21:30</b></div><div role="tab" aria-selected="false"><small>Mở lại lúc</small><b>6:30</b></div></div>
<div class="banh" aria-label="Chọn giờ: 21 giờ 30">
<span class="hai">:</span>
<div class="cot"><span>19</span><span>20</span><span class="giua">21</span><span>22</span><span>23</span></div>
<div class="cot"><span>20</span><span>25</span><span class="giua">30</span><span>35</span><span>40</span></div>
</div>
<p class="muc">Áp dụng các ngày</p>
<div class="ngay"><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>
<div class="day"><span class="nut" role="button" tabindex="0">Lưu giờ ngủ 21:30 – 6:30</span></div>
</div>
</div></body></html>
