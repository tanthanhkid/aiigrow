<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08);--nho:0 6px 10px -6px rgba(10,22,41,.3),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(10,22,41,.1);--lom:inset 0 5px 10px rgba(10,22,41,.14),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.nut{position:relative;width:100%;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.03))}
.nut span{position:relative}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.c6-day{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 22px;z-index:5;background:#F2EBE3;box-shadow:0 -12px 18px -12px rgba(10,22,41,.25)}
.a-top{position:absolute;left:8px;right:16px;top:44px;height:52px;display:flex;align-items:center;gap:4px;z-index:3}
.a-top .lui{color:#0A1629}
.q-hinh{position:absolute;left:16px;right:16px;top:140px;height:154px;border-radius:30px;background:linear-gradient(#fff,#fbf0d6);box-shadow:var(--clay);display:grid;place-items:center;font-size:92px}
.q-ten{position:absolute;left:20px;right:20px;top:312px}
.q-ten h2{font-size:22px;font-weight:800;letter-spacing:-.4px}
.q-ten p{margin-top:4px;font-size:13.5px;line-height:19px;font-weight:600;color:#5a5a5a}
.q-2{position:absolute;left:16px;right:16px;top:392px;display:flex;gap:10px}
.q-2 div{flex:1;border-radius:22px;background:#fff;box-shadow:var(--nho);padding:12px}
.q-2 small{display:block;font-size:12px;font-weight:800;color:#5a5a5a}
.q-2 b{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:20px;font-weight:800}
.q-2 b img{width:20px;height:20px}
.q-dk{position:absolute;left:16px;right:16px;top:486px;border-radius:22px;background:#fff;box-shadow:var(--nho);padding:4px 14px}
.q-dk p{display:flex;gap:10px;padding:10px 0;font-size:13.5px;line-height:18px;font-weight:700}
.q-dk p+p{border-top:1px solid #efe7dd}
.q-sl{position:absolute;left:20px;right:20px;top:636px;display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:800}
.q-sl span{display:flex;align-items:center;gap:14px}
.q-sl i{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--nho);display:grid;place-items:center;font-style:normal;font-size:20px;color:#0A1629}
.buoc{display:flex;gap:8px}
.buoc i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e8ddcf;box-shadow:var(--lom)}
.buoc i img{width:20px;height:20px;opacity:.45}
.buoc i.xong{background:#fbf0d6}
.buoc i.xong img{opacity:1}
.buoc i.on{background:#0A1629;box-shadow:0 0 0 2.5px #F4C76A,0 6px 12px rgba(10,22,41,.3)}
.buoc i.on img{opacity:1}
.k9h{position:absolute;left:20px;right:20px;top:98px;font-size:24px;line-height:30px;font-weight:800;letter-spacing:-.5px;z-index:3}

:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--clay:var(--shL);--nho:var(--sh);--lom:var(--sunk)}
html,body,.app{background:var(--n)}
.app::before{display:none}
svg{flex:none}
.nut{height:56px;border-radius:16px;overflow:visible;color:#0A1629;font-weight:700;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nut::before{display:none}
.c6-day{background:var(--n);box-shadow:0 -6px 12px rgba(120,98,70,.18)}
.buoc i{background:var(--n);box-shadow:var(--sunk);color:#7c7166}
.buoc i svg{width:20px;height:20px}
.buoc i.xong{background:#0A1629;color:#F4C76A;box-shadow:none}
.buoc i.xong svg[fill="#E2B354"]{fill:#F4C76A;stroke:#F4C76A}
.buoc i.on{background:var(--kim);color:#0A1629;box-shadow:0 0 0 1.5px #0A1629}
.mi{display:inline-grid;place-items:center;flex:none}.mi svg{width:1em;height:1em}
.q-hinh{background:var(--n);box-shadow:var(--shL);color:#0A1629;font-size:92px}.q-hinh svg{width:92px;height:92px;stroke-width:1.1}
.q-ten p,.t-an,.x-chu p,.t-tom small{color:#5b5248}
.q-2 div,.q-dk,.q-sl i,.t-tom,.t-pt div,.x-the{background:var(--n);box-shadow:var(--sh)}
.q-2 b{font-size:19px}.q-2 b svg{width:20px;height:20px}
.q-2 b .mi{font-size:20px;color:#0A1629}
.q-2 small{color:#5b5248}
.q-dk{box-shadow:var(--sh)}
.q-dk p{align-items:center;font-weight:600;padding:6px 0;font-size:13px;line-height:17px}.q-dk{top:480px}
.q-dk p .mi{font-size:18px;color:#0A1629;width:26px;height:26px;border-radius:50%;box-shadow:var(--sunk);flex:none}
.q-dk p .mi svg{width:16px;height:16px}
.q-dk p+p{border-top:0;box-shadow:inset 0 1px 0 var(--hi),inset 0 2px 0 rgba(120,98,70,.12)}
.q-sl i{box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi)}
.t-tom em,.t-pt em,.x-the em{background:var(--n);box-shadow:var(--sunk);color:#0A1629}
.t-tom em svg,.x-the em svg{width:26px;height:26px}.t-pt em svg{width:22px;height:22px}
.t-tong{border-top:0;box-shadow:inset 0 2px 0 rgba(120,98,70,.14),inset 0 3px 0 var(--hi)}
.t-pt div{box-shadow:var(--sh)}
.t-pt i{border:0;background:var(--n);box-shadow:var(--sunk)}
.t-pt div[aria-checked="true"]{background:#0A1629;color:#F4C76A;box-shadow:0 0 0 2px #D9AE57}
.t-pt div[aria-checked="true"] em{background:#0A1629;color:#F4C76A;box-shadow:none}
.t-pt div[aria-checked="true"] i{border:7px solid #F4C76A;background:#0A1629;box-shadow:none}
.t-an{font-weight:600}.t-an .mi{font-size:14px;vertical-align:-2px;color:#0A1629}.t-an .mi svg{width:14px;height:14px}
.x-the small{color:#0A1629}.x-the small svg{width:14px;height:14px}
.t-tom .d b,.x-the b{font-weight:800}
</style></head><body><div class="app"><div class="a-top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-s416tfdj"><svg viewBox="0 0 256 256" width="24" height="24" fill="#0A1629"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><div class="buoc" aria-label="Bước 3 trên 5: Quà" style="margin-left:auto"><i class="xong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></i><i class="xong"><svg viewBox="0 0 24 24" fill="#E2B354" stroke="#C9973B" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"></path></svg></i><i class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13M5 12v8h14v-8M12 8c-2-4-6-3-5 0 .5 1.5 5 0 5 0zm0 0c2-4 6-3 5 0-.5 1.5-5 0-5 0z"></path></svg></i><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M5 4L3 6m16-2l2 2"></path></svg></i><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></i></div></div><h2 class="k9h">Quà Ba Mẹ mua</h2><div class="q-hinh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 010 5H17M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3M3 21h16"></path></svg></div><div class="q-ten"><h2>Voucher AiiCafe 50k</h2><p>Con dùng ở AiiCafe: nước, bánh, đồ chơi nhỏ.</p></div><div class="q-2"><div><small>Ba Mẹ trả</small><b><i class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M3 10h18M7 15h4"></path></svg></i>50.000đ</b></div><div><small>Con đổi bằng</small><b><svg viewBox="0 0 24 24" fill="#E2B354" stroke="#C9973B" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"></path></svg>500 sao</b></div></div><div class="q-dk"><p><i class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M11 18h2"></path></svg></i><span>Đổi xong, con nhận mã QR trong app</span></p><p><i class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"></path></svg></i><span>Mã dùng trong 60 ngày</span></p><p><i class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg></i><span>Chưa đổi thì Ba Mẹ vẫn giữ, không mất tiền</span></p></div><div class="q-sl">Số lượng<span><i role="button" tabindex="0">−</i>1<i role="button" tabindex="0">＋</i></span></div><div class="c6-day"><button class="nut" type="button" data-toi="them-bbxb64oc"><span>Mua · 50.000đ</span></button></div></div></body></html>
