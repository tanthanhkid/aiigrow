<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--noi:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--noi2:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--n);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--n)}
.nen{position:absolute;inset:0;padding:100px 16px 0}
.the{position:relative;height:196px;border-radius:34px;background:var(--n);box-shadow:var(--noi2)}
.avt{position:absolute;left:20px;top:18px;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:#0A1629;box-shadow:0 0 0 3px var(--n),0 0 0 5px #D9AE57,5px 6px 12px var(--lo);font-size:34px;font-weight:800;color:#F4C76A}
.tenc{position:absolute;left:22px;bottom:24px;font-size:26px;font-weight:800;color:#0A1629}
.nhan{margin:14px 0 8px 6px;font-size:14px;font-weight:700}
.lom{height:50px;padding:0 20px;border-radius:25px;background:#E3D9CB;box-shadow:var(--lom);display:flex;align-items:center;font:700 20px 'Be Vietnam Pro',sans-serif}
.lom.dang{box-shadow:0 0 0 2.5px #D9AE57,var(--lom)}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.45);z-index:2}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 20px 22px;border-radius:32px 32px 0 0;background:var(--n);box-shadow:0 -10px 30px -10px rgba(0,0,0,.35)}
.keo{width:44px;height:5px;margin:0 auto 14px;border-radius:3px;background:#cfc5b6}
.ns-dau{display:flex;align-items:center;justify-content:space-between;margin:0 4px 6px}
.ns-dau b{font-size:20px;font-weight:800;letter-spacing:-.3px}
.ns-nut{display:flex;gap:12px;margin-top:20px}
.nut{flex:1;height:58px;border-radius:18px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#0A1629;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.bx{position:relative;perspective:600px;overflow:hidden}
.bx-dai{position:absolute;left:0;right:0;border-radius:14px;background:#E3D9CB;box-shadow:var(--lom)}
.bx-cot{position:relative}
.bx i{display:flex;align-items:center;justify-content:center;height:44px;font-style:normal;font-size:20px;font-weight:600;color:#0A1629}
.bx i.ch{font-size:23px;font-weight:800;color:#0A1629}
.bx::before,.bx::after{content:"";position:absolute;left:0;right:0;height:64px;z-index:2;pointer-events:none}
.bx::before{top:0;background:linear-gradient(var(--bxn),rgba(236,228,217,0))}
.bx::after{bottom:0;background:linear-gradient(rgba(236,228,217,0),var(--bxn))}
.sheet{--bxn:#ECE4D9}.bx{margin:4px 0 0;--bxn:#ECE4D9}
</style></head>
<body><div class="app">
<div class="nen" aria-hidden="true">
<div class="the"><div class="avt">A</div><div class="tenc">Bảo Anh</div></div>
<div class="nhan">Tên gọi ở nhà</div><div class="lom">Bảo Anh</div>
<div class="nhan">Năm sinh</div><div class="lom dang">2017</div>
</div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng bảng chọn năm" data-toi="bm1-ob-ten-con"></div>
<div class="sheet" role="dialog" aria-label="Chọn năm sinh của Bảo Anh">
<div class="keo"></div>
<div class="ns-dau"><b>Năm sinh</b></div>
<div class="bx" role="listbox" aria-label="Năm sinh, 2009 đến 2024" style="height:308px"><div class="bx-dai" style="top:132px;height:44px"></div><div class="bx-cot"><i style="transform:rotateX(54deg) scale(0.85);opacity:0.2">2014</i><i style="transform:rotateX(36deg) scale(0.90);opacity:0.38">2015</i><i style="transform:rotateX(18deg) scale(0.95);opacity:0.62">2016</i><i style="transform:rotateX(0deg) scale(1.00);opacity:1" class="ch" aria-selected="true">2017</i><i style="transform:rotateX(-18deg) scale(0.95);opacity:0.62">2018</i><i style="transform:rotateX(-36deg) scale(0.90);opacity:0.38">2019</i><i style="transform:rotateX(-54deg) scale(0.85);opacity:0.2">2020</i></div></div><div class="ns-nut">

<button class="nut" type="button" data-toi="bm1-ob-ten-con">Chọn 2017</button>
</div>
</div>
</div>
</body></html>
