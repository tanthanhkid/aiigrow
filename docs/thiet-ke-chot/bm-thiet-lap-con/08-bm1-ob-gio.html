<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(10,22,41,.26),0 4px 8px -5px rgba(10,22,41,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(10,22,41,.12);--nho:0 6px 10px -6px rgba(10,22,41,.3),inset 0 1.5px 0 #fff,inset 0 -6px 10px -5px rgba(10,22,41,.14);--lom:inset 0 5px 10px rgba(10,22,41,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ECE4D9;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#ECE4D9}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:260px;background:linear-gradient(#ECE4D9,#ECE4D9)}
.top{position:absolute;left:8px;right:16px;top:44px;height:48px;display:flex;align-items:center;justify-content:space-between;z-index:4}
.lui{width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.buoc{display:flex;gap:8px}.buoc i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ECE4D9;box-shadow:var(--lom)}.buoc i img{width:17px;height:17px;opacity:.45}.buoc i.xong img{opacity:1}.buoc i.on{background:#ECE4D9;box-shadow:0 0 0 2px #D9AE57,var(--clay)}.buoc i.on img{opacity:1}
.noi{position:absolute;left:16px;right:16px;top:98px;z-index:2}
h1{font-size:25px;line-height:30px;font-weight:800;letter-spacing:-.5px;margin:0 4px 12px;white-space:nowrap}
.the{position:relative;overflow:hidden;border-radius:28px;padding:14px;box-shadow:var(--clay);margin-bottom:12px}
.the::before{content:"";position:absolute;left:22px;right:22px;top:5px;height:16px;border-radius:30px 30px 60% 60%;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none}
.vang{height:138px;padding:0;background:radial-gradient(circle at 22% 70%,#ECE4D9 0,#ECE4D9 30%,transparent 60%),linear-gradient(160deg,#fff4dc,#f9d996)}
.vang .rob{position:absolute;left:-2px;bottom:-8px;width:124px;height:124px;object-fit:contain}
.vang .sao-bay{position:absolute;width:22px;height:22px}
.s1{left:106px;top:16px;transform:rotate(-14deg)}.s2{left:16px;top:12px;width:15px!important;height:15px!important;transform:rotate(12deg)}
.vang .phai{position:absolute;right:14px;top:12px;width:186px;text-align:center}
.nhan{font-size:14px;font-weight:800;color:#0A1629}
.dem{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.dem button{width:40px;height:40px;border-radius:50%;border:0;background:#ECE4D9;box-shadow:var(--nho);font:800 22px 'Be Vietnam Pro';color:#0A1629}
.so{display:flex;align-items:center;gap:4px;font-size:40px;font-weight:900;letter-spacing:-1.5px;color:#0A1629}
.so img{width:30px;height:30px}
.pill{display:inline-block;padding:5px 12px;border-radius:14px;background:rgba(255,255,255,.75);box-shadow:var(--lom);font-size:12.5px;font-weight:800;color:#0A1629}
.kem{background:#ECE4D9}
.hoi{position:relative;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;padding-left:2px;white-space:nowrap}
.hoi img{width:28px;height:28px}
.dong{display:flex;align-items:center;gap:8px;margin-top:10px}
.dong+.dong{margin-top:8px}
.nh{flex:1;min-width:0;font-size:14.5px;font-weight:800;white-space:nowrap}
.nh small{display:block;font-size:12px;font-weight:700;color:#0A1629;margin-top:2px}
.tg{display:flex;align-items:center;gap:6px}
.tg button{width:40px;height:40px;border-radius:50%;border:0;background:#ECE4D9;box-shadow:var(--nho);font:800 20px 'Be Vietnam Pro';color:#0A1629;flex:none}
.o{width:92px;height:48px;border-radius:16px;background:#ECE4D9;box-shadow:0 0 0 2px #ECE4D9,var(--lom);display:flex;align-items:baseline;justify-content:center;gap:3px;padding-top:9px}
.o b{font-size:22px;font-weight:900;color:#0A1629}
.o span{font-size:12.5px;font-weight:800;color:#7c7166}
.o.dang{box-shadow:0 0 0 2px #D9AE57,var(--lom)}
.o.dang b::after{content:"";display:inline-block;width:2px;height:20px;margin-left:2px;background:#0A1629;vertical-align:-3px}
.chk{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#7c7166}
.chk i{width:20px;height:20px;border-radius:6px;background:#ECE4D9;box-shadow:0 0 0 2px #c9ccc9,var(--lom)}
.minh{display:flex;align-items:flex-start;justify-content:space-between;margin-top:10px;padding:8px 8px 7px;border-radius:18px;background:#ECE4D9;box-shadow:var(--lom)}
.minh .b{width:92px;text-align:center;font-size:12px;font-weight:800;color:#0A1629;white-space:nowrap}
.minh .b span{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:#ECE4D9;box-shadow:var(--nho)}
.minh .b img{width:21px;height:21px}
.minh .mui{margin-top:7px;font-size:18px;font-weight:800;color:#0A1629}
.day{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 24px;z-index:5}
.nut{position:relative;width:100%;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 14px 20px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.04))}
.nut span{position:relative}

:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--clay:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--nho:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);--clayNho:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--lomIn:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
svg.si{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
svg.si.st{fill:#E2B354;stroke:#C9973B;stroke-width:1.2}
html,body,.app{background:var(--n)!important}
.app::before{display:none!important}
.nut{background:var(--kim)!important;color:#0A1629!important;border-radius:16px!important;font-weight:700!important;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)!important}
.nut::before{display:none!important}
.buoc i{background:var(--n)!important;box-shadow:var(--lom)!important;color:#7c7166}
.buoc i svg{width:20px;height:20px;opacity:1!important}
.buoc i.xong{background:#0A1629!important;color:#F4C76A;box-shadow:none!important}
.buoc i.on{background:var(--kim)!important;color:#0A1629;box-shadow:0 0 0 1.5px #0A1629!important}
.lui svg{fill:#0A1629}
.lk{color:#8a6a2b!important;font-weight:600!important}
.so svg.si{width:30px;height:30px}
.hoi svg.si{width:28px;height:28px}
.minh .b svg.si{width:21px;height:21px}
.ds-m{background:var(--n)!important;box-shadow:var(--nho);color:#0A1629!important}
.ds-t{color:#0A1629!important}
.v-trai{background:var(--n)!important;box-shadow:var(--lom);border-right:2px dashed #cbbfae!important;color:#0A1629}
.q-tab span[aria-selected="true"]{background:#0A1629!important;color:#F4C76A!important}
.q-tab{background:var(--n)!important}
.t-goi span,.t-o em,.t-them,.ds-c,.c6-all{background:var(--n)!important;box-shadow:var(--nho)}
.t-them{color:#8a6a2b!important}
.t-rong{border-color:#cbbfae!important}
.ds-e{box-shadow:var(--lom)!important;background:var(--n)!important}
.ds-d+.ds-d,.ds-tao{border-top-color:rgba(120,98,70,.2)!important}
.q-rob{background:var(--n)!important;box-shadow:var(--nho)}
.c6-day{box-shadow:0 -8px 16px -10px rgba(120,98,70,.35)!important}
.vang{background:#0A1629!important}.the::before{display:none!important}
.vang .nhan{color:#F2EBE3!important}.so{color:#F4C76A!important}
.pill{background:rgba(244,199,106,.16)!important;box-shadow:none!important;color:#F4C76A!important}
.dem button,.tg button{background:var(--n)!important;box-shadow:var(--nho)!important}
.o{background:var(--n)!important;box-shadow:var(--lom)!important}
.o.dang{box-shadow:0 0 0 2px #D9AE57,var(--lom)!important}
.chk i{background:var(--n)!important;box-shadow:var(--lom)!important}
.minh .b span{background:var(--n)!important;box-shadow:var(--nho)!important;color:#0A1629}
.minh .b span svg{width:21px;height:21px}
.hoi svg{width:26px;height:26px;color:#0A1629}.hoi{font-size:16px}
.vang .sao-bay{width:22px;height:22px}
.minh{background:var(--n)!important}
.nh small{color:#7c7166!important}
.vang .dem button{box-shadow:inset 0 1px 0 rgba(255,255,255,.6)!important}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="bm1-ob-mau"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><div class="buoc" aria-label="Bước 4 trên 5: Giờ chơi"><i class="xong"><svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg></i><i class="xong"><svg class="si" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"></path></svg></i><i class="xong"><svg class="si" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13M5 12v8a1 1 0 001 1h12a1 1 0 001-1v-8M8 8a2.5 2.5 0 110-5c2 0 4 2 4 5 0-3 2-5 4-5a2.5 2.5 0 110 5"></path></svg></i><i class="on"><svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></i><i><svg class="si" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></i></div></div>
<div class="noi">
<h1>Bảo Anh chơi máy thế nào?</h1>

<div class="the vang">
<svg class="si st" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"></path></svg><svg class="si st" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"></path></svg>
<img class="rob" src="/assets/rob/rob-goc.webp" alt="">
<div class="phai">
<div class="nhan">Quà khởi đầu cho con</div>
<div class="dem"><button type="button" aria-label="Bớt 10 sao">−</button><div class="so"><svg class="si st" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"></path></svg>30</div><button type="button" aria-label="Thêm 10 sao">+</button></div>
<span class="pill">1 sao = chơi 1 phút</span>
</div>
</div>

<div class="the kem">
<div class="hoi"><svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Mỗi ngày chơi bao lâu?</div>
<div class="dong"><div class="nh">Thứ 2 – Thứ 6<small>= 1 tiếng</small></div><div class="tg"><button type="button" aria-label="Bớt 15 phút">−</button><div class="o dang" role="textbox" inputmode="numeric" aria-label="Số phút ngày thường" tabindex="0"><b>60</b><span>phút</span></div><button type="button" aria-label="Thêm 15 phút">+</button></div></div>
<div class="dong"><div class="nh">Thứ 7, Chủ nhật<small>= 1 tiếng rưỡi</small></div><div class="tg"><button type="button" aria-label="Bớt 15 phút">−</button><div class="o" role="textbox" inputmode="numeric" aria-label="Số phút cuối tuần" tabindex="0"><b>90</b><span>phút</span></div><button type="button" aria-label="Thêm 15 phút">+</button></div></div>
</div>

<div class="the kem">
<div class="hoi"><svg class="si" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"></path></svg>Chơi liền bao lâu thì nghỉ?</div>
<div class="dong"><div class="nh">Chơi liền<small>= nửa tiếng</small></div><div class="tg"><button type="button" aria-label="Bớt 15 phút">−</button><div class="o" role="textbox" inputmode="numeric" aria-label="Số phút mỗi lần chơi" tabindex="0"><b>30</b><span>phút</span></div><button type="button" aria-label="Thêm 15 phút">+</button></div></div>
<div class="minh">
<div class="b"><span><svg class="si" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5"></rect><path d="M7 10.5v4M5 12.5h4M15.5 11.5h.01M18 13.5h.01"></path></svg></span>Chơi 30 phút</div>
<div class="mui">→</div>
<div class="b"><span><svg class="si" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg></span>Nghỉ 30 phút</div>
<div class="mui">→</div>
<div class="b"><span><svg class="si" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5"></rect><path d="M7 10.5v4M5 12.5h4M15.5 11.5h.01M18 13.5h.01"></path></svg></span>Chơi tiếp</div>
</div>
<div class="dong"><div class="chk" role="checkbox" aria-checked="false" tabindex="0" style="margin-left:2px"><i></i>Không cần nghỉ</div></div>
</div>
</div>
<div class="day"><button class="nut" type="button" data-toi="them-mdujxlg2"><span>Tiếp: chọn app cho con</span></button></div>
</div>
</body></html>
