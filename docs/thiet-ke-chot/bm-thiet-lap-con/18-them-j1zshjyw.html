<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 14px 22px -14px rgba(10,22,41,.28),0 3px 8px -5px rgba(10,22,41,.12),inset 0 1.5px 0 #fff,inset 0 -8px 14px -8px rgba(10,22,41,.08)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.nut{position:relative;width:100%;overflow:hidden;height:58px;border-radius:30px;border:0;font:800 17px 'Be Vietnam Pro',sans-serif;color:#fff;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:46%;border-radius:26px 26px 40px 40px;background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.03))}
.nut span{position:relative}
.c6-day{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 22px;z-index:5;background:#F2EBE3;box-shadow:0 -12px 18px -12px rgba(10,22,41,.25)}
.x-hinh{position:absolute;left:0;right:0;top:120px;display:grid;place-items:center}
.x-hinh img{width:200px;height:200px;object-fit:contain}
.x-chu{position:absolute;left:24px;right:24px;top:340px;text-align:center}
.x-chu h1{font-size:25px;line-height:31px;font-weight:800;letter-spacing:-.5px}
.x-chu p{margin-top:8px;font-size:14.5px;line-height:21px;font-weight:600;color:#5a5a5a}
.x-the{position:absolute;left:16px;right:16px;top:470px;display:flex;align-items:center;gap:12px;border-radius:28px;background:#fff;box-shadow:var(--clay);padding:12px}
.x-the em{width:52px;height:52px;border-radius:16px;background:#F2EBE3;display:grid;place-items:center;font-style:normal;font-size:28px}
.x-the b{display:block;font-size:15px;font-weight:800}
.x-the small{display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:#0A1629}.x-the small img{width:14px;height:14px}

:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--clay:var(--shL);--nho:var(--sh);--lom:var(--sunk)}
html,body,.app{background:var(--n)}
.app::before{display:none}
svg{flex:none}
.nut{height:56px;border-radius:16px;overflow:visible;color:#0A1629;font-weight:700;background:var(--kim);box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)}
.nut::before{display:none}
.c6-day{background:var(--n);box-shadow:0 -6px 12px rgba(120,98,70,.18)}
.buoc i{background:var(--n);box-shadow:var(--sunk);color:#7c7166}
.buoc i svg{width:20px;height:20px}
.buoc i.xong{background:#0A1629;color:#F4C76A;box-shadow:none}
.buoc i.xong svg[fill="#E2B354"]{fill:#F4C76A;stroke:#F4C76A}
.buoc i.on{background:var(--kim);color:#0A1629;box-shadow:0 0 0 1.5px #0A1629}
.mi{display:inline-grid;place-items:center;flex:none}.mi svg{width:1em;height:1em}
.q-hinh{background:var(--n);box-shadow:var(--shL);color:#0A1629;font-size:92px}.q-hinh svg{width:92px;height:92px;stroke-width:1.1}
.q-ten p,.t-an,.x-chu p,.t-tom small{color:#5b5248}
.q-2 div,.q-dk,.q-sl i,.t-tom,.t-pt div,.x-the{background:var(--n);box-shadow:var(--sh)}
.q-2 b{font-size:19px}.q-2 b svg{width:20px;height:20px}
.q-2 b .mi{font-size:20px;color:#0A1629}
.q-2 small{color:#5b5248}
.q-dk{box-shadow:var(--sh)}
.q-dk p{align-items:center;font-weight:600}
.q-dk p .mi{font-size:18px;color:#0A1629;width:30px;height:30px;border-radius:50%;box-shadow:var(--sunk);flex:none}
.q-dk p .mi svg{width:16px;height:16px}
.q-dk p+p{border-top:0;box-shadow:inset 0 1px 0 var(--hi),inset 0 2px 0 rgba(120,98,70,.12)}
.q-sl i{box-shadow:4px 4px 8px var(--lo),-4px -4px 8px var(--hi)}
.t-tom em,.t-pt em,.x-the em{background:var(--n);box-shadow:var(--sunk);color:#0A1629}
.t-tom em svg,.x-the em svg{width:26px;height:26px}.t-pt em svg{width:22px;height:22px}
.t-tong{border-top:0;box-shadow:inset 0 2px 0 rgba(120,98,70,.14),inset 0 3px 0 var(--hi)}
.t-pt div{box-shadow:var(--sh)}
.t-pt i{border:0;background:var(--n);box-shadow:var(--sunk)}
.t-pt div[aria-checked="true"]{background:#0A1629;color:#F4C76A;box-shadow:0 0 0 2px #D9AE57}
.t-pt div[aria-checked="true"] em{background:#0A1629;color:#F4C76A;box-shadow:none}
.t-pt div[aria-checked="true"] i{border:7px solid #F4C76A;background:#0A1629;box-shadow:none}
.t-an{font-weight:600}.t-an .mi{font-size:14px;vertical-align:-2px;color:#0A1629}.t-an .mi svg{width:14px;height:14px}
.x-the small{color:#0A1629}.x-the small svg{width:14px;height:14px}
.t-tom .d b,.x-the b{font-weight:800}
</style></head><body><div class="app"><div class="x-hinh"><img src="/assets/rob/qua.webp" alt=""></div><div class="x-chu"><h1>Đã mua quà cho Bảo Anh!</h1><p>Quà nằm trong kho quà của con. Con đủ 500 sao là đổi được, Ba Mẹ nhận thông báo.</p></div><div class="x-the"><em><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 010 5H17M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3M3 21h16"></path></svg></em><div><b>Voucher AiiCafe 50k</b><small><svg viewBox="0 0 24 24" fill="#E2B354" stroke="#C9973B" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"></path></svg>500 sao để đổi</small></div></div><div class="c6-day"><button class="nut" type="button" data-toi="them-s416tfdj"><span>Về chọn quà</span></button></div></div></body></html>
