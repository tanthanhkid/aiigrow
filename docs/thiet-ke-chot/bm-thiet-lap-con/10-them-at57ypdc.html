<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(10,22,41,.26),0 4px 8px -5px rgba(10,22,41,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(10,22,41,.12);--lom:inset 0 5px 10px rgba(10,22,41,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#ECE4D9;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#ECE4D9}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#ECE4D9,#ECE4D9)}
.top{position:absolute;left:0;right:0;top:0;height:136px;padding:44px 16px 0 8px;z-index:4}
.row{display:flex;align-items:center;height:48px}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{margin:4px 0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.buoc{display:flex;gap:8px;margin-left:auto}
.buoc i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ECE4D9;box-shadow:inset 2px 2px 4px rgba(0,0,0,.08)}
.buoc i img{width:20px;height:20px;opacity:.45}
.buoc i.xong img{opacity:1}
.buoc i.on{background:#ECE4D9;box-shadow:0 0 0 2px #D9AE57,0 6px 12px rgba(217,174,87,.25)}
.buoc i.on img{opacity:1}
.tim{position:absolute;left:16px;right:16px;top:140px;height:52px;display:flex;align-items:center;padding:0 6px 0 18px;border-radius:26px;background:#ECE4D9;box-shadow:var(--lom);font-size:16px;font-weight:700;z-index:3}
.tim span{flex:1}
.xoa{flex:none;width:44px;height:44px;display:grid;place-items:center;color:#7c7166;font-size:15px}
.cuon{position:absolute;left:0;right:0;top:204px;bottom:96px;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.muc{margin:4px 6px 8px;font-size:14px;font-weight:700;color:#7c7166}.muc b{color:#0A1629}
.ds{padding:4px 12px;border-radius:26px;background:#ECE4D9;box-shadow:var(--clay)}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg,.chon+.lg{border-top:1.5px solid rgba(0,0,0,.06)}
.ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#ECE4D9;box-shadow:0 8px 12px -8px rgba(10,22,41,.3)}.ic img{width:26px;height:26px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg p small{display:block;font-size:12.5px;font-weight:600;color:#7c7166}
.c{flex:none;width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:#ECE4D9;box-shadow:var(--lom);font-size:18px;font-weight:800;color:#0A1629}
.c.ok{background:#0A1629;color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -4px 6px -2px rgba(0,0,0,.3);font-size:15px}
.chon{padding-bottom:12px}
.hoi{margin:2px 2px 8px;font-size:13.5px;font-weight:800;color:#5b5248}
.den{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.den>div{display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 10px;border-radius:20px;background:#ECE4D9;box-shadow:var(--clay)}
.den i{flex:none;width:24px;height:24px;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -5px 7px -2px rgba(0,0,0,.25);opacity:.4}
.den .x i{background:#7ED957}.den .v i{background:#FF751F}
.den span{min-width:0;font-size:13.5px;font-weight:800;white-space:nowrap}.den small{display:block;font-size:11.5px;font-weight:600;color:#7c7166}
.den .on{background:#ECE4D9;box-shadow:0 0 0 3px #F4C76A,var(--clay)}.den .on i{opacity:1}
.bar{position:absolute;left:0;right:0;bottom:0;height:96px;padding:12px 16px 32px;background:linear-gradient(rgba(244,244,242,0),#ECE4D9 30%)}
.nut{display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}

:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--clay:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--nho:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);--clayNho:5px 5px 10px var(--lo),-5px -5px 10px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--lomIn:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi)}
svg.si{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
svg.si.st{fill:#E2B354;stroke:#C9973B;stroke-width:1.2}
html,body,.app{background:var(--n)!important}
.app::before{display:none!important}
.nut{background:var(--kim)!important;color:#0A1629!important;border-radius:16px!important;font-weight:700!important;box-shadow:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6)!important}
.nut::before{display:none!important}
.buoc i{background:var(--n)!important;box-shadow:var(--lom)!important;color:#7c7166}
.buoc i svg{width:20px;height:20px;opacity:1!important}
.buoc i.xong{background:#0A1629!important;color:#F4C76A;box-shadow:none!important}
.buoc i.on{background:var(--kim)!important;color:#0A1629;box-shadow:0 0 0 1.5px #0A1629!important}
.lui svg{fill:#0A1629}
.lk{color:#8a6a2b!important;font-weight:600!important}
.ic svg.si{width:26px;height:26px}
.ds-m{background:var(--n)!important;box-shadow:var(--nho);color:#0A1629!important}
.ds-t{color:#0A1629!important}
.v-trai{background:var(--n)!important;box-shadow:var(--lom);border-right:2px dashed #cbbfae!important;color:#0A1629}
.q-tab span[aria-selected="true"]{background:#0A1629!important;color:#F4C76A!important}
.q-tab{background:var(--n)!important}
.t-goi span,.t-o em,.t-them,.ds-c,.c6-all{background:var(--n)!important;box-shadow:var(--nho)}
.t-them{color:#8a6a2b!important}
.t-rong{border-color:#cbbfae!important}
.ds-e{box-shadow:var(--lom)!important;background:var(--n)!important}
.ds-d+.ds-d,.ds-tao{border-top-color:rgba(120,98,70,.2)!important}
.q-rob{background:var(--n)!important;box-shadow:var(--nho)}
.c6-day{box-shadow:0 -8px 16px -10px rgba(120,98,70,.35)!important}
.ic{background:var(--n)!important;box-shadow:var(--nho)!important;color:#0A1629}.ic svg{width:24px;height:24px}
.c.ok{background:#0A1629!important;color:#F4C76A!important;box-shadow:none!important}
.den>div{background:var(--n)!important;box-shadow:var(--clay)}
.den .on{box-shadow:0 0 0 2px #D9AE57,var(--clay)!important}
.den i{box-shadow:var(--lom)!important;opacity:1!important;background:var(--n)!important}
.den .x i,.den .v i{background:var(--n)!important}
.den .on i{background:var(--kim)!important;box-shadow:0 0 0 1.5px #0A1629!important}
.den .v i{background:var(--n)!important}
.tim{box-shadow:var(--lom)!important}
.lg+.lg,.chon+.lg{border-top-color:rgba(120,98,70,.2)!important}
.bar{background:linear-gradient(rgba(236,228,217,0),#ECE4D9 30%)!important}
</style></head>
<body><div class="app">
<div class="top"><div class="row"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-mdujxlg2"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><div class="buoc" aria-label="Bước 5 trên 5: App &amp; web"><i class="xong"><svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg></i><i class="xong"><svg class="si" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"></path></svg></i><i class="xong"><svg class="si" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13M5 12v8a1 1 0 001 1h12a1 1 0 001-1v-8M8 8a2.5 2.5 0 110-5c2 0 4 2 4 5 0-3 2-5 4-5a2.5 2.5 0 110 5"></path></svg></i><i class="xong"><svg class="si" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></i><i class="on"><svg class="si" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg></i></div></div><h1>Thêm app cho Bảo Anh</h1></div>
<div class="tim" role="searchbox" tabindex="0"><span>Duolingo</span><b class="xoa" role="button" tabindex="0" aria-label="Xoá chữ">✕</b></div>
<div class="cuon">
<p class="muc">Kết quả cho <b>«Duolingo»</b></p>
<div class="ds">
<div class="chon">
<div class="lg" role="checkbox" aria-checked="true" tabindex="0"><span class="ic"><svg class="si" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 012-2h13v15H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h13"></path></svg></span><p>Duolingo ABC<small>Học đọc tiếng Anh · 3–8 tuổi</small></p><span class="c ok">✓</span></div>
<p class="hoi">Duolingo ABC có tính phút không?</p>
<div class="den" role="radiogroup"><div class="v" role="radio" aria-checked="false" tabindex="0"><i></i><span>Tính phút<small>Trả bằng sao</small></span></div><div class="x on" role="radio" aria-checked="true" tabindex="0"><i></i><span>Không tính phút<small>Vào thoải mái</small></span></div></div>
</div>
<div class="lg" role="checkbox" aria-checked="false" tabindex="0"><span class="ic"><svg class="si" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 012-2h13v15H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h13"></path></svg></span><p>Duolingo<small>Học ngoại ngữ</small></p><span class="c">+</span></div>
<div class="lg" role="checkbox" aria-checked="false" tabindex="0"><span class="ic"><svg class="si" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 012-2h13v15H6a2 2 0 00-2 2zm0 0a2 2 0 002 2h13"></path></svg></span><p>Duolingo Math<small>Học toán</small></p><span class="c">+</span></div>
</div>
</div>
<div class="bar"><div class="nut" role="button" tabindex="0" data-toi="them-mdujxlg2">Thêm Duolingo ABC · Không tính phút</div></div>
</div>
</body></html>
