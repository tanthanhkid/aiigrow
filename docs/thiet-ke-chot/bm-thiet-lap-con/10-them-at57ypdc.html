<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(10,22,41,.26),0 4px 8px -5px rgba(10,22,41,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(10,22,41,.12);--lom:inset 0 5px 10px rgba(10,22,41,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#F2EBE3;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#0A1629;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#F2EBE3}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e8ddcf,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:136px;padding:44px 16px 0 8px;z-index:4}
.row{display:flex;align-items:center;height:48px}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{margin:4px 0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.buoc{display:flex;gap:8px;margin-left:auto}
.buoc i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ebe2d7;box-shadow:inset 2px 2px 4px rgba(0,0,0,.08)}
.buoc i img{width:20px;height:20px;opacity:.45}
.buoc i.xong img{opacity:1}
.buoc i.on{background:#F2EBE3;box-shadow:0 0 0 2.5px #0A1629,0 6px 12px rgba(15,107,92,.25)}
.buoc i.on img{opacity:1}
.tim{position:absolute;left:16px;right:16px;top:140px;height:52px;display:flex;align-items:center;padding:0 6px 0 18px;border-radius:26px;background:#F2EBE3;box-shadow:var(--lom);font-size:16px;font-weight:700;z-index:3}
.tim span{flex:1}
.xoa{flex:none;width:44px;height:44px;display:grid;place-items:center;color:#5a5a5a;font-size:15px}
.cuon{position:absolute;left:0;right:0;top:204px;bottom:96px;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.muc{margin:4px 6px 8px;font-size:14px;font-weight:700;color:#5a5a5a}.muc b{color:#0A1629}
.ds{padding:4px 12px;border-radius:26px;background:#F2EBE3;box-shadow:var(--clay)}
.lg{display:flex;align-items:center;gap:10px;min-height:62px}
.lg+.lg,.chon+.lg{border-top:1.5px solid rgba(0,0,0,.06)}
.ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:0 8px 12px -8px rgba(10,22,41,.3)}.ic img{width:26px;height:26px}
.lg p{flex:1;min-width:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg p small{display:block;font-size:12.5px;font-weight:600;color:#5a5a5a}
.c{flex:none;width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:#F2EBE3;box-shadow:var(--lom);font-size:18px;font-weight:800;color:#0A1629}
.c.ok{background:#0A1629;color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -4px 6px -2px rgba(0,0,0,.3);font-size:15px}
.chon{padding-bottom:12px}
.hoi{margin:2px 2px 8px;font-size:13.5px;font-weight:800;color:#3a3a3a}
.den{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.den>div{display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 10px;border-radius:20px;background:#fff;box-shadow:var(--clay)}
.den i{flex:none;width:24px;height:24px;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -5px 7px -2px rgba(0,0,0,.25);opacity:.4}
.den .x i{background:#7ED957}.den .v i{background:#FF751F}
.den span{min-width:0;font-size:13.5px;font-weight:800;white-space:nowrap}.den small{display:block;font-size:11.5px;font-weight:600;color:#5a5a5a}
.den .on{background:#fdf3d8;box-shadow:0 0 0 3px #F4C76A,var(--clay)}.den .on i{opacity:1}
.bar{position:absolute;left:0;right:0;bottom:0;height:96px;padding:12px 16px 32px;background:linear-gradient(rgba(244,244,242,0),#F2EBE3 30%)}
.nut{display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;background:linear-gradient(#1b2b47,#0A1629);box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
</style></head>
<body><div class="app">
<div class="top"><div class="row"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-mdujxlg2"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><div class="buoc" aria-label="Bước 5 trên 5: App &amp; web"><i class="xong"><img src="/assets/icon3d/tick.webp" alt=""></i><i class="xong"><img src="/assets/icon3d/sao.webp" alt=""></i><i class="xong"><img src="/assets/icon3d/qua.webp" alt=""></i><i class="xong"><img src="/assets/icon3d/dongho.webp" alt=""></i><i class="on"><img src="/assets/icon3d/may_tinh.webp" alt=""></i></div></div><h1>Thêm app cho Bảo Anh</h1></div>
<div class="tim" role="searchbox" tabindex="0"><span>Duolingo</span><b class="xoa" role="button" tabindex="0" aria-label="Xoá chữ">✕</b></div>
<div class="cuon">
<p class="muc">Kết quả cho <b>«Duolingo»</b></p>
<div class="ds">
<div class="chon">
<div class="lg" role="checkbox" aria-checked="true" tabindex="0"><span class="ic"><img src="/assets/icon3d/sach.webp" alt=""></span><p>Duolingo ABC<small>Học đọc tiếng Anh · 3–8 tuổi</small></p><span class="c ok">✓</span></div>
<p class="hoi">Duolingo ABC có tính phút không?</p>
<div class="den" role="radiogroup"><div class="v" role="radio" aria-checked="false" tabindex="0"><i></i><span>Tính phút<small>Trả bằng sao</small></span></div><div class="x on" role="radio" aria-checked="true" tabindex="0"><i></i><span>Không tính phút<small>Vào thoải mái</small></span></div></div>
</div>
<div class="lg" role="checkbox" aria-checked="false" tabindex="0"><span class="ic"><img src="/assets/icon3d/sach.webp" alt=""></span><p>Duolingo<small>Học ngoại ngữ</small></p><span class="c">+</span></div>
<div class="lg" role="checkbox" aria-checked="false" tabindex="0"><span class="ic"><img src="/assets/icon3d/sach.webp" alt=""></span><p>Duolingo Math<small>Học toán</small></p><span class="c">+</span></div>
</div>
</div>
<div class="bar"><div class="nut" role="button" tabindex="0" data-toi="them-mdujxlg2">Thêm Duolingo ABC · Không tính phút</div></div>
</div>
</body></html>
