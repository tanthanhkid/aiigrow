<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden}
body{width:400px;height:360px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:#0f1312;-webkit-font-smoothing:antialiased;background:radial-gradient(circle 420px at 20% 0,#e3ebe7,#ecebe7)}
.wrap{padding:20px 20px 32px}
.the{position:relative;border-radius:28px;background:#f7f6f3;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 30px rgba(28,32,30,.38),0 4px 10px rgba(28,32,30,.20)}

.hs{display:flex;align-items:center;gap:12px}
.vc{width:52px;height:52px;flex:none;border-radius:50%;background:#dcebe6;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(28,32,30,.40),0 2px 5px rgba(28,32,30,.22)}
.nut{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;border:0;border-radius:18px;padding:0 14px;font:700 15px/18px -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;white-space:nowrap;cursor:pointer}
.nut.sang{color:#0f1312;background:#f7f6f3;box-shadow:0 6px 14px rgba(28,32,30,.40),0 2px 4px rgba(28,32,30,.24)}
.demo{display:flex;gap:8px}
.demo div{flex:1;text-align:center;padding:8px 6px;border-radius:12px;border:1.5px dashed #f08c2e;background:#fff4e8;color:#9a4a00;font:600 12px/16px -apple-system,sans-serif;cursor:pointer}

  <div class="demo"><div data-toi="them-6v9ousjb">▶ Ba Mẹ cho phép</div><div data-toi="them-kzlo6qyy">▶ Ba Mẹ chưa cho</div></div>
