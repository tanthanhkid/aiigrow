<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);
--bg:#ECE4D9;--hero:#ECE4D9;--topBg:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0));--card:#ECE4D9;--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--badge:#0A1629;--ring:#0A1629;--hiBg:#0A1629;--hiSh:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);--btn:var(--kim);--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--line:rgba(120,98,70,.18);--nho:var(--sh)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--bg)}
.sau{position:absolute;inset:0;filter:blur(5px);background:linear-gradient(#ECE4D9,#F2EBE3 300px)}
.sau .t{position:absolute;left:56px;top:58px;font-size:22px;font-weight:800}
.sau .k{position:absolute;left:16px;right:16px;top:104px;height:300px;border-radius:28px;background:#ECE4D9;box-shadow:var(--sh)}
.sau .k i{position:absolute;left:10px;right:10px;top:10px;height:220px;border-radius:22px;background:#0A1629}
.sau .b{position:absolute;left:16px;right:16px;top:430px;height:70px;border-radius:24px;background:#ECE4D9}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.42);z-index:2}
.bang{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 16px 26px;border-radius:32px 32px 0 0;background:var(--bg);box-shadow:0 -10px 30px rgba(10,22,41,.25)}
.keo{width:40px;height:5px;border-radius:3px;background:#b9ad9e;margin:0 auto 14px}
.dau{display:flex;align-items:center;gap:12px}
.dau img{flex:none;width:60px;height:auto}
.dau h2{font-size:20px;line-height:26px;font-weight:800;letter-spacing:-.3px}
.dau h2 small{display:block;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-top:2px}
.muc{display:flex;align-items:center;gap:7px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;background:#0A1629;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.chip{display:flex;flex-wrap:wrap;gap:8px}
.chip span{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;background:#ECE4D9;box-shadow:var(--sh);font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.chip span.on{background:#0A1629;color:#F4C76A;box-shadow:0 8px 14px -8px rgba(10,22,41,.6),inset 0 1.5px 0 rgba(255,255,255,.22)}
.lom{display:flex;align-items:center;min-height:56px;padding:10px 18px;border-radius:22px;background:#ECE4D9;box-shadow:var(--lom);font-size:15.5px;font-weight:700;line-height:22px}
.ghi{display:flex;align-items:center;gap:8px;margin:10px 6px 0;font-size:12.5px;font-weight:700;color:var(--ink2)}
.ghi svg{width:18px;height:18px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;margin-top:18px;border-radius:26px;font-size:16px;font-weight:800;color:#F4C76A;white-space:nowrap;background:#0A1629;box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut svg{width:22px;height:22px}
.lk{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:4px;font-size:15px;font-weight:800;color:var(--ink)}

svg{width:1em;height:1em;flex:none}
.app::before{display:none!important}
html,body,.app{background:#ECE4D9}
.av{color:#0A1629!important;background:#ECE4D9!important;box-shadow:var(--sunk)!important}
.be.on .av{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #D9AE57!important}
.av em{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #ECE4D9!important}
.be small.s{background:var(--kim)!important;color:#0A1629!important}
.be small.s.no{background:#ECE4D9!important;color:#A2412C!important;box-shadow:var(--sunk)}
.muc .t::before{background:#D9AE57!important}
.muc a{color:#8a6a2b!important;font-weight:600!important}
.muc em{background:#0A1629!important;color:#F4C76A!important}
.nut{background:var(--kim)!important;color:#0A1629!important;font-weight:700!important;border-radius:16px!important;box-shadow:var(--btnSh)!important}
.diem{background:var(--kim)!important;color:#0A1629!important}
.vi{color:#F2EBE3}.vi small{color:#F2EBE3!important}.vi p{background:var(--kim)!important;color:#0A1629!important}
.day{background:linear-gradient(rgba(236,228,217,0),#ECE4D9 20px)!important}
.ghi{background:#ECE4D9!important;box-shadow:var(--sunk)}
.keo{background:#b9ad9e!important}
.bang,.sheet{box-shadow:0 -8px 24px rgba(10,22,41,.2)!important}
.mo{background:rgba(10,22,41,.35)!important}
.ei{width:1.15em;height:1.15em;vertical-align:-3px;margin-right:2px}
.ic.x{background:#ECE4D9!important}
.diem svg{fill:#0A1629;stroke:#0A1629}
.vi strong svg{color:#F4C76A;fill:#F4C76A}
.qua .ic{background:#ECE4D9!important}
.qua{background:#ECE4D9!important}
.tab{background:#ECE4D9!important;box-shadow:0 -6px 12px -6px var(--lo)!important}
.tab div{color:#7c7166!important;font-weight:600!important}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:#0A1629!important;font-weight:700!important}.tab .on svg{background:#ECE4D9;box-shadow:var(--sunk)}
.tag.ok{background:#0A1629;color:#F4C76A}
.tag.sao{background:var(--kim)}
.sao{background:var(--kim)}
</style></head>
<body><div class="app">
<div class="sau" aria-hidden="true"><p class="t">Đọc sách 20 phút</p><div class="k"><i></i></div><div class="b"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-d40e3495"></div>
<div class="bang">
<div class="keo"></div>
<div class="dau"><img src="/assets/rob/chi.webp" alt=""><h2>Nhờ Bảo Anh đọc lại<small>Con chưa nhận sao. Nộp ghi âm mới thì Ba Mẹ duyệt tiếp.</small></h2></div>
<p class="muc">Vì sao?</p>
<div class="chip"><span class="on" role="button" tabindex="0">Nghe chưa rõ</span><span role="button" tabindex="0">Chưa đủ 20 phút</span><span role="button" tabindex="0">Nhầm bài</span></div>
<p class="muc">Nhắn con</p>
<div class="lom">Con đọc to hơn một chút nhé!</div>
<p class="ghi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.7A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"></path></svg>Nói nhẹ nhàng để con vui vẻ làm lại</p>
<span class="nut" role="button" tabindex="0" data-toi="them-4u3doee9"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"></path></svg>Gửi lời nhắn cho Bảo Anh</span>
<span class="lk" role="button" tabindex="0" data-toi="them-d40e3495">Thôi, quay lại nghe ghi âm</span>
</div>
</div></body></html>
