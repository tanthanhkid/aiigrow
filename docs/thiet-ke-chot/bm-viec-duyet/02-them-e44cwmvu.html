<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:320px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:92px;padding:46px 12px 0 20px;display:flex;align-items:center;gap:10px;z-index:4;background:linear-gradient(#e3efeb 70%,rgba(227,239,235,0))}
.top h1{flex:1;font-size:28px;font-weight:800;letter-spacing:-.6px}
.cuon{position:absolute;left:0;right:0;top:92px;bottom:84px;overflow-y:auto;padding:0 0 28px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.pad{padding:0 16px}
.cac-con{display:flex;gap:6px;padding:12px 16px 4px;overflow:hidden;white-space:nowrap}
.be{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px}
.av{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;box-shadow:0 8px 14px -8px rgba(28,32,30,.4),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 10px -4px rgba(0,0,0,.18)}
.av.a{background:#f08a3c}.av.m{background:#5b7fd6}.av.n{background:#d86a8f}.av.k{background:#3f9a86}
.be.on .av{box-shadow:0 0 0 3px #f4f4f2,0 0 0 6px #0f6b5c,0 10px 16px -8px rgba(10,82,70,.6)}
.av em{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e2660f;color:#fff;font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px #f4f4f2}
.be b{font-size:13px;font-weight:800;color:#3a403d}
.be.on b{color:#0a5246}
.rong{text-align:center;margin-top:8px}
.rong img{width:160px;height:auto}
.rong h2{margin-top:4px;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px}
.rong p{margin:6px 16px 0;font-size:15px;line-height:21px;font-weight:600;color:#3a403d}
.chon{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px 12px 12px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.chon.dau{margin-top:20px}
.chon .ic{flex:none;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:#ecebe7;box-shadow:var(--lom)}.chon .ic img{width:32px;height:32px}
.chon .ic.x{background:#dcebe6}
.chon p{flex:1;min-width:0;font-size:16px;font-weight:800;line-height:22px}
.chon p small{display:block;font-size:13px;font-weight:600;color:#565c59}
.chon b{flex:none;width:28px;font-size:22px;font-weight:800;color:#0a5246;text-align:center}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;padding:6px 4px 24px;display:flex;background:#f7f6f3;box-shadow:0 -1px 0 #e4e3df,0 -12px 18px -12px rgba(28,32,30,.25);z-index:4}
.tab div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:#565c59;white-space:nowrap}
.tab img{width:26px;height:26px;opacity:.5}
.tab .on{color:#0a5246;font-weight:800}.tab .on img{opacity:1}
</style></head>
<body><div class="app">
<div class="top"><h1>Nhiệm vụ</h1></div>
<div class="cuon">
<div class="cac-con" aria-label="Chọn con">
<div class="be" role="button" tabindex="0" data-toi="them-e91jg28j"><span class="av a">B<em>2</em></span><b>Bảo Anh</b></div>
<div class="be on" role="button" tabindex="0"><span class="av m">M</span><b>Bảo Minh</b></div>
<div class="be" role="button" tabindex="0"><span class="av n">N</span><b>Bảo Ngọc</b></div>
<div class="be" role="button" tabindex="0"><span class="av k">K</span><b>Khang</b></div>
</div>
<div class="pad">
<div class="rong"><img src="/assets/rob/chi.webp" alt=""><h2>Ngày của Bảo Minh còn trống</h2><p>Con làm xong nhận sao, đổi ra phút chơi.</p></div>
<div class="chon dau" role="button" tabindex="0" data-toi="them-1jii7k19"><span class="ic"><img src="/assets/icon3d/qua.webp" alt=""></span><p>Chọn từ danh sách<small>Học · Vận động · Giúp Ba Mẹ</small></p><b>›</b></div>
<div class="chon" role="button" tabindex="0" data-toi="them-6pjz1stu"><span class="ic x"><img src="/assets/icon3d/but.webp" alt=""></span><p>Tự đặt một việc<small>Tên việc, số sao, ngày làm</small></p><b>›</b></div>
</div>
</div>
<nav class="tab">
<div role="button" tabindex="0" data-toi="bm2-trang-chu"><img src="/assets/icon3d/nha.webp" alt="">Hôm nay</div>
<div class="on" role="button" tabindex="0" data-toi="them-e91jg28j"><img src="/assets/icon3d/sao.webp" alt="">Nhiệm vụ</div>
<div role="button" tabindex="0" data-toi="bm2-ung-dung-may"><img src="/assets/icon3d/khien.webp" alt="">Chặn</div>
<div role="button" tabindex="0" data-toi="them-gftgyspn"><img src="/assets/icon3d/lich.webp" alt="">Báo cáo</div>
<div role="button" tabindex="0" data-toi="them-h60stad7"><img src="/assets/icon3d/nguoi.webp" alt="">Cả nhà</div>
</nav>
</div></body></html>
