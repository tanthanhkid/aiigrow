<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);
--bg:#ECE4D9;--hero:#ECE4D9;--topBg:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0));--card:#ECE4D9;--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--badge:#0A1629;--ring:#0A1629;--hiBg:#0A1629;--hiSh:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);--btn:var(--kim);--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--line:rgba(120,98,70,.18);--nho:var(--sh)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--bg)}
.sau{position:absolute;inset:0;filter:blur(5px);background:linear-gradient(#ECE4D9,#F2EBE3 300px)}
.sau h2{position:absolute;left:56px;top:58px;font-size:22px;font-weight:800}
.sau .o{position:absolute;left:16px;right:16px;border-radius:28px;background:#ECE4D9;box-shadow:var(--sh)}
.sau .o svg{position:absolute;left:12px;top:10px;width:40px;height:40px}
.mo{position:absolute;inset:0;background:rgba(10,22,41,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 26px;border-radius:32px 32px 0 0;background:var(--bg);box-shadow:0 -16px 30px -10px rgba(10,22,41,.35),inset 0 1.5px 0 #fff}
.keo{width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:#b9ad9e}
.hinh{position:relative;width:88px;height:88px;margin:0 auto;border-radius:28px;display:grid;place-items:center;background:#ECE4D9;box-shadow:var(--sh)}
.hinh svg{width:56px;height:56px}
.hinh .x{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:#ECE4D9;box-shadow:var(--sh)}.hinh .x svg{width:22px;height:22px}
h1{margin-top:14px;text-align:center;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.the{margin-top:14px;padding:4px 14px;border-radius:24px;background:#ECE4D9;box-shadow:var(--lom)}
.dong{display:flex;align-items:center;gap:12px;min-height:52px;font-size:14.5px;font-weight:700;line-height:20px;color:var(--ink)}
.dong+.dong{border-top:1.5px solid rgba(120,98,70,.18)}
.dong svg{flex:none;width:26px;height:26px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#c8372c,#a11d14);box-shadow:0 12px 18px -10px rgba(161,29,20,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.phu{display:flex;align-items:center;justify-content:center;margin-top:8px;height:46px;border-radius:23px;background:#ECE4D9;box-shadow:var(--sh);font-size:15px;font-weight:800;color:var(--ink)}

svg{width:1em;height:1em;flex:none}
.app::before{display:none!important}
html,body,.app{background:#ECE4D9}
.av{color:#0A1629!important;background:#ECE4D9!important;box-shadow:var(--sunk)!important}
.be.on .av{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #D9AE57!important}
.av em{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #ECE4D9!important}
.be small.s{background:var(--kim)!important;color:#0A1629!important}
.be small.s.no{background:#ECE4D9!important;color:#A2412C!important;box-shadow:var(--sunk)}
.muc .t::before{background:#D9AE57!important}
.muc a{color:#8a6a2b!important;font-weight:600!important}
.muc em{background:#0A1629!important;color:#F4C76A!important}
.nut{background:var(--kim)!important;color:#0A1629!important;font-weight:700!important;border-radius:16px!important;box-shadow:var(--btnSh)!important}
.diem{background:var(--kim)!important;color:#0A1629!important}
.day{background:linear-gradient(rgba(236,228,217,0),#ECE4D9 20px)!important}
.ghi{background:#ECE4D9!important;box-shadow:var(--sunk)}
.keo{background:#b9ad9e!important}
.bang,.sheet{box-shadow:0 -8px 24px rgba(10,22,41,.2)!important}
.mo{background:rgba(10,22,41,.35)!important}
.ei{width:1.15em;height:1.15em;vertical-align:-3px;margin-right:2px}
.ic.x{background:#ECE4D9!important}
.diem svg{fill:#0A1629;stroke:#0A1629}
.vi strong svg{color:#F4C76A;fill:#F4C76A}
.qua .ic{background:#ECE4D9!important}
.qua{background:#ECE4D9!important}
.tab{background:#ECE4D9!important;box-shadow:0 -6px 12px -6px var(--lo)!important}
.tab div{color:#7c7166!important;font-weight:600!important}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:#0A1629!important;font-weight:700!important}.tab .on svg{background:#ECE4D9;box-shadow:var(--sunk)}
.sheet{box-shadow:0 -8px 24px rgba(10,22,41,.2)}
.sheet .nut{background:#ECE4D9!important;color:#b42318!important;font-weight:700!important;box-shadow:var(--sh)!important}
.hinh .x{color:#b42318}
.hinh .x svg{width:22px;height:22px}
.mo{background:rgba(10,22,41,.35)}
.phu{box-shadow:var(--sh)}
</style></head>
<body><div class="app">
<div class="sau"><h2>Sửa việc</h2><div class="o" style="top:110px;height:60px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg></div><div class="o" style="top:200px;height:50px;right:120px"></div><div class="o" style="top:290px;height:50px"></div><div class="o" style="top:380px;height:68px"><svg style="opacity:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-ncq0jtzo"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg><span class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></span></div>
<h1>Xoá việc «Dọn phòng»?</h1>
<div class="the">
<div class="dong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>Bảo Anh không thấy việc này nữa</div>
<div class="dong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>30 sao con đang có vẫn giữ nguyên</div>
<div class="dong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>Ngày của Bảo Anh còn 4 việc</div>
</div>
<span class="nut" role="button" tabindex="0" data-toi="them-e91jg28j">Xoá «Dọn phòng»</span>
<span class="phu" role="button" tabindex="0" data-toi="them-ncq0jtzo">Giữ lại việc này</span>
</div>
</div></body></html>
