<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);
--bg:#ECE4D9;--hero:#ECE4D9;--topBg:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0));--card:#ECE4D9;--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--badge:#0A1629;--ring:#0A1629;--hiBg:#0A1629;--hiSh:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);--btn:var(--kim);--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--line:rgba(120,98,70,.18);--nho:var(--sh)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--bg)}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#ECE4D9,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 16px 0 8px;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#ECE4D9 75%,rgba(232,221,207,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 124px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.dau{display:flex;align-items:center;gap:12px}
.dau .ic{flex:none;width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:#ECE4D9;box-shadow:var(--sh)}.dau .ic svg{width:38px;height:38px}
.lom{flex:1;display:flex;align-items:center;height:56px;padding:0 20px;border-radius:28px;background:#ECE4D9;box-shadow:var(--lom)}
.lom input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:800 18px 'Be Vietnam Pro',sans-serif;color:var(--ink)}
.muc{display:flex;align-items:center;gap:7px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;background:#0A1629;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.chon{display:flex;gap:8px;flex-wrap:wrap}
.chon span{display:flex;align-items:center;justify-content:center;gap:4px;min-width:62px;height:46px;padding:0 16px;border-radius:23px;background:#ECE4D9;box-shadow:var(--sh);font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap}
.chon span svg{width:18px;height:18px}
.chon .on{background:#0A1629;color:#F4C76A;box-shadow:0 8px 14px -8px rgba(10,22,41,.6),inset 0 1.5px 0 rgba(255,255,255,.22)}
.chon i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#fff;margin-left:-8px}
.chon i.a{background:#E8600C}.chon i.m{background:#1F48FF}.chon i.n{background:#9b2fc0}.chon i.k{background:#0f8a68}
.chon .on i{box-shadow:0 0 0 2px #fff}
.ds{margin-top:18px;padding:4px 14px;border-radius:28px;background:#ECE4D9;box-shadow:var(--sh)}
.dong{display:flex;align-items:center;gap:12px;min-height:68px}
.dong p{flex:1;min-width:0;font-size:15.5px;font-weight:800}.dong p small{display:block;font-size:12.5px;font-weight:600;color:var(--ink2)}
.gat{flex:none;position:relative;width:52px;height:32px;border-radius:16px;background:#7ED957;box-shadow:inset 0 2px 4px rgba(10,22,41,.2)}
.gat::after{content:"";position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#ECE4D9;box-shadow:0 2px 4px rgba(10,22,41,.25)}
.xoa{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;height:50px;border-radius:25px;background:#ECE4D9;box-shadow:var(--sh);font-size:15px;font-weight:800;color:#b42318}
.xoa svg{width:20px;height:20px}
.day{position:absolute;left:0;right:0;bottom:0;padding:20px 16px 30px;background:linear-gradient(rgba(242,235,227,0),#F2EBE3 20px);z-index:4}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#F4C76A;white-space:nowrap;background:#0A1629;box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut svg{width:22px;height:22px}

svg{width:1em;height:1em;flex:none}
.app::before{display:none!important}
html,body,.app{background:#ECE4D9}
.av{color:#0A1629!important;background:#ECE4D9!important;box-shadow:var(--sunk)!important}
.be.on .av{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #D9AE57!important}
.av em{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #ECE4D9!important}
.be small.s{background:var(--kim)!important;color:#0A1629!important}
.be small.s.no{background:#ECE4D9!important;color:#A2412C!important;box-shadow:var(--sunk)}
.muc .t::before{background:#D9AE57!important}
.muc a{color:#8a6a2b!important;font-weight:600!important}
.muc em{background:#0A1629!important;color:#F4C76A!important}
.nut{background:var(--kim)!important;color:#0A1629!important;font-weight:700!important;border-radius:16px!important;box-shadow:var(--btnSh)!important}
.diem{background:var(--kim)!important;color:#0A1629!important}
.vi{color:#F2EBE3}.vi small{color:#F2EBE3!important}.vi p{background:var(--kim)!important;color:#0A1629!important}
.ei{width:1.15em;height:1.15em;vertical-align:-3px;margin-right:2px}
.ic.x{background:#ECE4D9!important}
.diem svg{fill:#0A1629;stroke:#0A1629}
.vi strong svg{color:#F4C76A;fill:#F4C76A}
.qua .ic{background:#ECE4D9!important}
.qua{background:#ECE4D9!important}
.tab{background:#ECE4D9!important;box-shadow:0 -6px 12px -6px var(--lo)!important}
.tab div{color:#7c7166!important;font-weight:600!important}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:#0A1629!important;font-weight:700!important}.tab .on svg{background:#ECE4D9;box-shadow:var(--sunk)}
.chon i{background:#ECE4D9!important;color:#0A1629!important;box-shadow:var(--sunk)}
.chon .on i{background:#F4C76A!important;box-shadow:none!important}
.gat{background:#0A1629!important;box-shadow:var(--sunk)}
.gat::after{background:var(--kim)!important;box-shadow:none}
.day{background:linear-gradient(rgba(236,228,217,0),#ECE4D9 20px)}
.lom{box-shadow:var(--sunk)}
.dau .ic{background:#ECE4D9}
</style></head>
<body><div class="app">
<div class="top"><div class="lui" role="button" tabindex="0" aria-label="Quay lại" data-toi="them-e91jg28j"><svg viewBox="0 0 256 256"><path d="M168.49,199.51a12,12,0,0,1-17,17l-80-80a12,12,0,0,1,0-17l80-80a12,12,0,0,1,17,17L97,128Z"></path></svg></div><h1>Sửa việc</h1></div>
<div class="cuon">
<div class="dau"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg></span><div class="lom" style="flex: 0 0 auto; width: 268px; max-width: none; height: 48px;"><input type="text" aria-label="Tên việc" value="Dọn phòng"></div></div>
<p class="muc">Con nhận bao nhiêu sao?</p>
<div class="chon"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>5</span><span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>10</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>20</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>30</span></div>
<p class="muc">Làm khi nào?</p>
<div class="chon"><span class="on">Mỗi ngày</span><span>Thứ 2 – Thứ 6</span><span>Cuối tuần</span></div>
<p class="muc">Con báo xong bằng</p>
<div class="chon"><span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Chụp ảnh</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Ghi âm</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12.5 3 3 5-6"></path></svg>Bấm «Xong»</span></div>
<div class="ds"><div class="dong"><p>Ba Mẹ xem rồi mới cộng sao<small>Tắt thì con báo xong là nhận sao</small></p><span class="gat" role="switch" aria-checked="true" tabindex="0"></span></div></div>
<p class="muc">Áp cho</p>
<div class="chon"><span class="on"><i class="a">B</i>Bảo Anh</span><span><i class="m">M</i>Bảo Minh</span><span><i class="n">N</i>Bảo Ngọc</span><span><i class="k">K</i>Khang</span></div>
<div class="xoa" role="button" tabindex="0" data-toi="them-4axhvgpl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>Xoá việc này</div>
</div>
<div class="day"><span class="nut" role="button" tabindex="0" data-toi="them-e91jg28j"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12.5 3 3 5-6"></path></svg>Lưu việc «Dọn phòng»</span></div>
</div></body></html>
