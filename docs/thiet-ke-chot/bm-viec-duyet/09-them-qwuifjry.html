<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#e3efeb,#f4f4f2)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 16px 0 8px;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#e3efeb 75%,rgba(227,239,235,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0a5246}
.top h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.dem{flex:none;padding:4px 10px;border-radius:12px;background:#dcebe6;font-size:12.5px;font-weight:800;color:#0a5246}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 166px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.the{padding:10px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.phong{position:relative;height:240px;border-radius:22px;overflow:hidden;background:linear-gradient(#f6e7cf 0 62%,#dcbb8e 62%)}
.phong div{position:absolute}
.cua{left:22px;top:20px;width:84px;height:70px;border-radius:10px;background:linear-gradient(#bfe3f2,#eaf6fb);border:5px solid #fff;box-shadow:0 4px 8px -4px rgba(0,0,0,.2)}
.ke{right:26px;top:58px;width:100px;height:8px;border-radius:4px;background:#a87444}
.do1{right:96px;top:30px;width:22px;height:28px;border-radius:6px;background:#e2660f}
.do2{right:66px;top:38px;width:24px;height:20px;border-radius:50%;background:#5b7fd6}

.giuong{left:16px;bottom:30px;width:160px;height:58px;border-radius:14px;background:#7fb3d5;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.goi2{left:50px;bottom:80px;width:50px;height:22px;border-radius:11px;background:#fff}
.chan{left:104px;bottom:76px;width:66px;height:24px;border-radius:8px;background:#f2c46d;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.ban{right:20px;bottom:66px;width:118px;height:12px;border-radius:4px;background:#a87444}
.chb1{right:30px;bottom:24px;width:8px;height:44px;background:#8c5f37}
.chb2{right:120px;bottom:24px;width:8px;height:44px;background:#8c5f37}
.sach1{right:40px;bottom:78px;width:40px;height:10px;border-radius:3px;background:#d2453b}
.sach2{right:44px;bottom:88px;width:34px;height:9px;border-radius:3px;background:#0f6b5c}
.den{right:104px;bottom:78px;width:10px;height:34px;border-radius:4px;background:#3a403d}
.den2{right:96px;bottom:106px;width:28px;height:16px;border-radius:14px 14px 4px 4px;background:#ffd36b}
.tham{left:150px;bottom:8px;width:110px;height:22px;border-radius:50%;background:#e9a0a0;opacity:.75}
.nh{left:10px;bottom:10px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.92);font-size:12.5px;font-weight:800;color:#3a403d}
.vuot{right:10px;top:10px;padding:5px 10px;border-radius:12px;background:rgba(15,19,18,.62);font-size:12px;font-weight:800;color:#fff}
.cham{left:50%;bottom:14px;margin-left:-14px;display:flex;gap:6px}
.cham i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.7)}.cham i.on{background:#fff;width:16px}
.dai{display:flex;gap:8px;margin-top:10px}
.mini{position:relative;flex:1;height:58px;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-weight:800;color:#3a403d;box-shadow:var(--lom)}
.mini.truoc{background:radial-gradient(circle at 30% 70%,#e2660f 0 5px,transparent 6px),radial-gradient(circle at 60% 80%,#5b7fd6 0 6px,transparent 7px),radial-gradient(circle at 78% 66%,#1aa37a 0 5px,transparent 6px),radial-gradient(circle at 45% 60%,#d2453b 0 4px,transparent 5px),linear-gradient(#f6e7cf 0 55%,#dcbb8e 55%)}
.mini.sau{background:linear-gradient(#f6e7cf 0 55%,#dcbb8e 55%);box-shadow:0 0 0 3px #0f6b5c}
.mini span{padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.92)}
.dong{display:flex;align-items:center;gap:10px;margin:14px 6px 0}
.dong p{flex:1;font-size:15px;font-weight:800;color:#3a403d}
.sao{flex:none;display:flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:12px;background:#fbecc0;color:#6e4300;font-size:13px;font-weight:800}.sao img{width:16px;height:16px}
.nhan{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f08a3c;color:#fff;font-weight:800;font-size:17px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 10px -4px rgba(0,0,0,.18)}
.bong{flex:1;padding:12px 14px;border-radius:6px 22px 22px 22px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:700;line-height:21px}
.bong small{display:block;font-size:12.5px;font-weight:600;color:#565c59;margin-top:2px}
.muc{margin:18px 6px 8px;font-size:15px;font-weight:800;color:#3a403d}
.chip{display:flex;flex-wrap:wrap;gap:8px}
.chip span{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;background:#f7f6f3;box-shadow:var(--clay);font-size:14.5px;font-weight:800;color:#3a403d;white-space:nowrap}
.chip span.on{background:#0f6b5c;color:#fff;box-shadow:0 8px 14px -8px rgba(10,82,70,.6),inset 0 1.5px 0 rgba(255,255,255,.35)}
.day{position:absolute;left:0;right:0;bottom:0;padding:20px 16px 22px;background:linear-gradient(rgba(244,244,242,0),#f4f4f2 20px);z-index:4;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#2e3533,#121615);box-shadow:0 12px 18px -10px rgba(18,22,21,.55),inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 10px -4px rgba(0,0,0,.5)}
.nut img{width:22px;height:22px}
.lk{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:15px;font-weight:800;color:#0a5246}
.lk img{width:20px;height:20px}
</style></head>
