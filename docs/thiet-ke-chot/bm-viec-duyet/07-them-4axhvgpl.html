<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--clay:0 16px 24px -14px rgba(28,32,30,.26),0 4px 8px -5px rgba(28,32,30,.14),inset 0 1.5px 0 #fff,inset 0 -10px 16px -8px rgba(40,44,42,.12);--lom:inset 0 5px 10px rgba(40,44,42,.17),inset 0 -1.5px 0 rgba(255,255,255,.95)}
html,body{width:375px;height:812px;overflow:hidden;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#0f1312;font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:#f4f4f2}
.sau{position:absolute;inset:0;filter:blur(5px);background:linear-gradient(#e3efeb,#f4f4f2 300px)}
.sau h2{position:absolute;left:56px;top:58px;font-size:22px;font-weight:800}
.sau .o{position:absolute;left:16px;right:16px;border-radius:28px;background:#f7f6f3;box-shadow:var(--clay)}
.sau .o img{position:absolute;left:12px;top:10px;width:40px;height:40px}
.mo{position:absolute;inset:0;background:rgba(15,19,18,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 26px;border-radius:32px 32px 0 0;background:#f4f4f2;box-shadow:0 -16px 30px -10px rgba(0,0,0,.3),inset 0 1.5px 0 #fff}
.keo{width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:#d3d2cd}
.hinh{position:relative;width:88px;height:88px;margin:0 auto;border-radius:28px;display:grid;place-items:center;background:#f7f6f3;box-shadow:var(--clay)}
.hinh img{width:56px;height:56px}
.hinh .x{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:#fff;box-shadow:var(--clay)}.hinh .x img{width:22px;height:22px}
h1{margin-top:14px;text-align:center;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.the{margin-top:14px;padding:4px 14px;border-radius:24px;background:#ecebe7;box-shadow:var(--lom)}
.dong{display:flex;align-items:center;gap:12px;min-height:52px;font-size:14.5px;font-weight:700;line-height:20px;color:#3a403d}
.dong+.dong{border-top:1.5px solid #e1e0dc}
.dong img{flex:none;width:26px;height:26px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#fff;white-space:nowrap;background:linear-gradient(#c8372c,#a11d14);box-shadow:0 12px 18px -10px rgba(161,29,20,.55),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -6px 10px -4px rgba(0,0,0,.35)}
.phu{display:flex;align-items:center;justify-content:center;margin-top:8px;height:46px;border-radius:23px;background:#fff;box-shadow:var(--clay);font-size:15px;font-weight:800;color:#0f1312}
</style></head>
<body><div class="app">
<div class="sau"><h2>Sửa việc</h2><div class="o" style="top:110px;height:60px"><img src="/assets/icon3d/lau.webp" alt=""></div><div class="o" style="top:200px;height:50px;right:120px"></div><div class="o" style="top:290px;height:50px"></div><div class="o" style="top:380px;height:68px"><img src="/assets/icon3d/x.webp" alt="" style="opacity:0"></div></div>
<div class="mo" role="button" tabindex="0" aria-label="Đóng" data-toi="them-ncq0jtzo"></div>
<div class="sheet">
<div class="keo"></div>
<div class="hinh"><img src="/assets/icon3d/lau.webp" alt=""><span class="x"><img src="/assets/icon3d/x.webp" alt=""></span></div>
<h1>Xoá việc «Dọn phòng»?</h1>
<div class="the">
<div class="dong"><img src="/assets/icon3d/tablet.webp" alt="">Bảo Anh không thấy việc này nữa</div>
<div class="dong"><img src="/assets/icon3d/sao.webp" alt="">30 sao con đang có vẫn giữ nguyên</div>
<div class="dong"><img src="/assets/icon3d/lich.webp" alt="">Ngày của Bảo Anh còn 4 việc</div>
</div>
<span class="nut" role="button" tabindex="0" data-toi="them-e91jg28j">Xoá «Dọn phòng»</span>
<span class="phu" role="button" tabindex="0" data-toi="them-ncq0jtzo">Giữ lại việc này</span>
</div>
</div></body></html>
