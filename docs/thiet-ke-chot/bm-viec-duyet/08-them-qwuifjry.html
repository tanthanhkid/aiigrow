<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#ECE4D9;--hi:#FFFBF5;--lo:rgba(120,98,70,.28);--ink:#0A1629;--ink2:#5b5248;--ink3:#7c7166;--kim:linear-gradient(135deg,#FBE7B0 0%,#F4C76A 38%,#C9973B 72%,#F2D48C 100%);--shL:8px 8px 16px var(--lo),-8px -8px 16px var(--hi);--sunk:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);
--bg:#ECE4D9;--hero:#ECE4D9;--topBg:linear-gradient(#ECE4D9 75%,rgba(236,228,217,0));--card:#ECE4D9;--sh:6px 6px 12px var(--lo),-6px -6px 12px var(--hi);--lom:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);--badge:#0A1629;--ring:#0A1629;--hiBg:#0A1629;--hiSh:var(--shL),inset 0 0 0 1px rgba(244,199,106,.35);--btn:var(--kim);--btnSh:4px 4px 10px var(--lo),-4px -4px 10px var(--hi),inset 0 1px 0 rgba(255,255,255,.6);--line:rgba(120,98,70,.18);--nho:var(--sh)}
html,body{width:375px;height:812px;overflow:hidden;background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.app{position:relative;width:375px;height:812px;overflow:hidden;background:var(--bg)}
.app::before{content:"";position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(#ECE4D9,#F2EBE3)}
.top{position:absolute;left:0;right:0;top:0;height:100px;padding:44px 16px 0 8px;display:flex;align-items:center;gap:2px;z-index:4;background:linear-gradient(#ECE4D9 75%,rgba(232,221,207,0))}
.lui{flex:none;width:44px;height:44px;display:grid;place-items:center}.lui svg{width:24px;height:24px;fill:#0A1629}
.top h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.dem{flex:none;padding:4px 10px;border-radius:12px;background:#ECE4D9;box-shadow:var(--sh);font-size:12.5px;font-weight:800;color:var(--ink)}
.cuon{position:absolute;left:0;right:0;top:100px;bottom:0;overflow-y:auto;padding:4px 16px 166px;scrollbar-width:none}
.cuon::-webkit-scrollbar{display:none}
.the{padding:10px;border-radius:28px;background:#ECE4D9;box-shadow:var(--sh)}
.phong{position:relative;height:240px;border-radius:22px;overflow:hidden;background:linear-gradient(#f6e7cf 0 62%,#dcbb8e 62%)}
.phong div{position:absolute}
.cua{left:22px;top:20px;width:84px;height:70px;border-radius:10px;background:linear-gradient(#bfe3f2,#eaf6fb);border:5px solid #fff;box-shadow:0 4px 8px -4px rgba(0,0,0,.2)}
.ke{right:26px;top:58px;width:100px;height:8px;border-radius:4px;background:#a87444}
.do1{right:96px;top:30px;width:22px;height:28px;border-radius:6px;background:#E8600C}
.do2{right:66px;top:38px;width:24px;height:20px;border-radius:50%;background:#1F48FF}
.do3{right:36px;top:26px;width:18px;height:32px;border-radius:5px;background:#0f8a68}
.dau{left:16px;bottom:58px;width:28px;height:70px;border-radius:10px 10px 0 0;background:#5c8fb3}
.giuong{left:16px;bottom:30px;width:160px;height:58px;border-radius:14px;background:#7fb3d5;box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.goi2{left:50px;bottom:80px;width:50px;height:22px;border-radius:11px;background:#ECE4D9}
.chan{left:104px;bottom:76px;width:66px;height:24px;border-radius:8px;background:#F4C76A;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.ban{right:20px;bottom:66px;width:118px;height:12px;border-radius:4px;background:#a87444}
.chb1{right:30px;bottom:24px;width:8px;height:44px;background:#8c5f37}
.chb2{right:120px;bottom:24px;width:8px;height:44px;background:#8c5f37}
.sach1{right:40px;bottom:78px;width:40px;height:10px;border-radius:3px;background:#d2453b}
.sach2{right:44px;bottom:88px;width:34px;height:9px;border-radius:3px;background:#0A1629}
.den{right:104px;bottom:78px;width:10px;height:34px;border-radius:4px;background:#0A1629}
.den2{right:96px;bottom:106px;width:28px;height:16px;border-radius:14px 14px 4px 4px;background:#ffd36b}
.tham{left:150px;bottom:8px;width:110px;height:22px;border-radius:50%;background:#e9a0a0;opacity:.75}
.nh{left:10px;bottom:10px;padding:5px 10px;border-radius:12px;background:rgba(255,255,255,.92);font-size:12.5px;font-weight:800;color:var(--ink)}
.vuot{right:10px;top:10px;padding:5px 10px;border-radius:12px;background:rgba(10,22,41,.7);font-size:12px;font-weight:800;color:#fff}
.cham{left:50%;bottom:14px;margin-left:-14px;display:flex;gap:6px}
.cham i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.7)}.cham i.on{background:#ECE4D9;width:16px}
.dai{display:flex;gap:8px;margin-top:10px}
.mini{position:relative;flex:1;height:58px;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;padding:6px 8px;font-size:12px;font-weight:800;color:var(--ink);box-shadow:var(--lom)}
.mini.truoc{background:radial-gradient(circle at 30% 70%,#E8600C 0 5px,transparent 6px),radial-gradient(circle at 60% 80%,#1F48FF 0 6px,transparent 7px),radial-gradient(circle at 78% 66%,#0f8a68 0 5px,transparent 6px),radial-gradient(circle at 45% 60%,#d2453b 0 4px,transparent 5px),linear-gradient(#f6e7cf 0 55%,#dcbb8e 55%)}
.mini.sau{background:linear-gradient(#f6e7cf 0 55%,#dcbb8e 55%);box-shadow:0 0 0 3px #0A1629}
.mini span{padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.92)}
.dong{display:flex;align-items:center;gap:10px;margin:14px 6px 0}
.dong p{flex:1;font-size:15px;font-weight:800;color:var(--ink)}
.sao{flex:none;display:flex;align-items:center;gap:4px;padding:4px 10px 4px 6px;border-radius:12px;background:#F4C76A;color:#0A1629;font-size:13px;font-weight:800}.sao svg{width:16px;height:16px}
.nhan{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#E8600C;color:#fff;font-weight:800;font-size:17px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 10px -4px rgba(0,0,0,.2)}
.bong{flex:1;padding:12px 14px;border-radius:6px 22px 22px 22px;background:#ECE4D9;box-shadow:var(--sh);font-size:15px;font-weight:700;line-height:21px}
.bong small{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:2px}
.muc{display:flex;align-items:center;gap:7px;margin:18px 6px 8px;font-size:15px;font-weight:800;color:var(--ink)}
.muc::before{content:"";width:9px;height:13px;background:#0A1629;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.chip{display:flex;flex-wrap:wrap;gap:8px}
.chip span{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;background:#ECE4D9;box-shadow:var(--sh);font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.chip span.on{background:#0A1629;color:#F4C76A;box-shadow:0 8px 14px -8px rgba(10,22,41,.6),inset 0 1.5px 0 rgba(255,255,255,.22)}
.day{position:absolute;left:0;right:0;bottom:0;padding:20px 16px 22px;background:linear-gradient(rgba(242,235,227,0),#F2EBE3 20px);z-index:4;display:flex;flex-direction:column;gap:4px}
.nut{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:26px;font-size:16px;font-weight:800;color:#F4C76A;white-space:nowrap;background:#0A1629;box-shadow:0 12px 18px -10px rgba(10,22,41,.55),inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -6px 10px -4px rgba(0,0,0,.45)}
.nut svg{width:22px;height:22px}
.lk{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:15px;font-weight:800;color:var(--ink)}
.lk svg{width:20px;height:20px}

svg{width:1em;height:1em;flex:none}
.app::before{display:none!important}
html,body,.app{background:#ECE4D9}
.av{color:#0A1629!important;background:#ECE4D9!important;box-shadow:var(--sunk)!important}
.be.on .av{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #D9AE57!important}
.av em{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #ECE4D9!important}
.be small.s{background:var(--kim)!important;color:#0A1629!important}
.be small.s.no{background:#ECE4D9!important;color:#A2412C!important;box-shadow:var(--sunk)}
.muc .t::before{background:#D9AE57!important}
.muc a{color:#8a6a2b!important;font-weight:600!important}
.muc em{background:#0A1629!important;color:#F4C76A!important}
.nut{background:var(--kim)!important;color:#0A1629!important;font-weight:700!important;border-radius:16px!important;box-shadow:var(--btnSh)!important}
.diem{background:var(--kim)!important;color:#0A1629!important}
.vi{color:#F2EBE3}.vi small{color:#F2EBE3!important}.vi p{background:var(--kim)!important;color:#0A1629!important}
.day{background:linear-gradient(rgba(236,228,217,0),#ECE4D9 20px)!important}
.ghi{background:#ECE4D9!important;box-shadow:var(--sunk)}
.keo{background:#b9ad9e!important}
.bang,.sheet{box-shadow:0 -8px 24px rgba(10,22,41,.2)!important}
.mo{background:rgba(10,22,41,.35)!important}
.ei{width:1.15em;height:1.15em;vertical-align:-3px;margin-right:2px}
.ic.x{background:#ECE4D9!important}
.diem svg{fill:#0A1629;stroke:#0A1629}
.vi strong svg{color:#F4C76A;fill:#F4C76A}
.qua .ic{background:#ECE4D9!important}
.qua{background:#ECE4D9!important}
.tab{background:#ECE4D9!important;box-shadow:0 -6px 12px -6px var(--lo)!important}
.tab div{color:#7c7166!important;font-weight:600!important}
.tab svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:15px}
.tab .on{color:#0A1629!important;font-weight:700!important}.tab .on svg{background:#ECE4D9;box-shadow:var(--sunk)}
.sao{background:var(--kim)}.sao svg{fill:#0A1629;stroke:#0A1629}
.mini.sau{box-shadow:0 0 0 3px #D9AE57}
.bong{background:var(--n)}
.av{background:#0A1629!important;color:#F4C76A!important;box-shadow:0 0 0 2px #D9AE57!important}
</style></head>
